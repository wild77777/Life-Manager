function newId(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// ---- Period helpers ---------------------------------------
function startOfPeriod(date, period) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  if (period === 'dia') return d;
  if (period === 'semana') {
    const dow = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dow);
    return d;
  }
  if (period === 'mes') { d.setDate(1); return d; }
  if (period === 'anio') { d.setMonth(0, 1); return d; }
  return d;
}
function endOfPeriod(date, period) {
  const s = startOfPeriod(date, period);
  const e = new Date(s);
  if (period === 'dia') e.setDate(e.getDate() + 1);
  if (period === 'semana') e.setDate(e.getDate() + 7);
  if (period === 'mes') e.setMonth(e.getMonth() + 1);
  if (period === 'anio') e.setFullYear(e.getFullYear() + 1);
  return e;
}
function shiftPeriod(date, period, delta) {
  const d = new Date(date);
  if (period === 'dia') d.setDate(d.getDate() + delta);
  if (period === 'semana') d.setDate(d.getDate() + delta * 7);
  if (period === 'mes') d.setMonth(d.getMonth() + delta);
  if (period === 'anio') d.setFullYear(d.getFullYear() + delta);
  return d;
}

const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MONTHS_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const WEEKDAYS_SHORT = ['lun','mar','mié','jue','vie','sáb','dom'];

function formatPeriodLabel(date, period) {
  const d = new Date(date);
  if (period === 'dia') {
    return `${WEEKDAYS_SHORT[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }
  if (period === 'semana') {
    const s = startOfPeriod(d, 'semana');
    const e = new Date(endOfPeriod(d, 'semana').getTime() - DAY);
    if (s.getMonth() === e.getMonth()) {
      return `${s.getDate()}–${e.getDate()} ${MONTHS[s.getMonth()]} ${s.getFullYear()}`;
    }
    return `${s.getDate()} ${MONTHS_SHORT[s.getMonth()]} – ${e.getDate()} ${MONTHS_SHORT[e.getMonth()]} ${s.getFullYear()}`;
  }
  if (period === 'mes') return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  if (period === 'anio') return `${d.getFullYear()}`;
  return '';
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
}
function formatDateFull(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
}
function todayISO() { return TODAY.toISOString().slice(0, 10); }

const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function money(n) { return USD.format(n || 0); }
function moneyCompact(n) {
  const a = Math.abs(n);
  if (a >= 1000) return '$' + (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return '$' + Math.round(n);
}

// ---- Aggregations ------------------------------------------
function inRange(iso, start, end) {
  const t = new Date(iso + 'T00:00:00').getTime();
  return t >= start.getTime() && t < end.getTime();
}

function aggregate(txs, anchor, period) {
  const start = startOfPeriod(anchor, period);
  const end = endOfPeriod(anchor, period);
  const prevAnchor = shiftPeriod(anchor, period, -1);
  const prevStart = startOfPeriod(prevAnchor, period);
  const prevEnd = startOfPeriod(anchor, period);

  let ingreso = 0, gasto = 0, venta = 0;
  let pIngreso = 0, pGasto = 0, pVenta = 0;
  const byCat = {};
  let count = 0;

  for (const t of txs) {
    if (inRange(t.fecha, start, end)) {
      count++;
      if (t.tipo === 'ingreso') ingreso += t.monto;
      else if (t.tipo === 'gasto') { gasto += t.monto; byCat[t.categoria] = (byCat[t.categoria] || 0) + t.monto; }
      else if (t.tipo === 'venta') venta += t.monto;
    } else if (inRange(t.fecha, prevStart, prevEnd)) {
      if (t.tipo === 'ingreso') pIngreso += t.monto;
      else if (t.tipo === 'gasto') pGasto += t.monto;
      else if (t.tipo === 'venta') pVenta += t.monto;
    }
  }
  return {
    start, end, count,
    ingreso, gasto, venta,
    balance: ingreso + venta - gasto,
    prev: { ingreso: pIngreso, gasto: pGasto, venta: pVenta, balance: pIngreso + pVenta - pGasto },
    byCat,
  };
}

function chartBuckets(txs, anchor, period) {
  const start = startOfPeriod(anchor, period);
  const end = endOfPeriod(anchor, period);
  let buckets = [];
  if (period === 'dia') {
    for (let h = 0; h < 24; h++) buckets.push({ label: String(h).padStart(2, '0'), ingreso: 0, gasto: 0, venta: 0 });
    for (const t of txs) {
      if (!inRange(t.fecha, start, end)) continue;
      const h = (parseInt(String(t.id).replace(/[^0-9a-z]/gi,'').slice(-4), 36) || 0) % 24;
      buckets[h][t.tipo] += t.monto;
    }
  } else if (period === 'semana') {
    for (let i = 0; i < 7; i++) buckets.push({ label: WEEKDAYS_SHORT[i], ingreso: 0, gasto: 0, venta: 0 });
    for (const t of txs) {
      if (!inRange(t.fecha, start, end)) continue;
      const d = new Date(t.fecha + 'T00:00:00');
      const dow = (d.getDay() + 6) % 7;
      buckets[dow][t.tipo] += t.monto;
    }
  } else if (period === 'mes') {
    const days = new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate();
    for (let i = 1; i <= days; i++) buckets.push({ label: String(i), ingreso: 0, gasto: 0, venta: 0 });
    for (const t of txs) {
      if (!inRange(t.fecha, start, end)) continue;
      const d = new Date(t.fecha + 'T00:00:00');
      buckets[d.getDate() - 1][t.tipo] += t.monto;
    }
  } else if (period === 'anio') {
    for (let i = 0; i < 12; i++) buckets.push({ label: MONTHS_SHORT[i], ingreso: 0, gasto: 0, venta: 0 });
    for (const t of txs) {
      if (!inRange(t.fecha, start, end)) continue;
      const d = new Date(t.fecha + 'T00:00:00');
      buckets[d.getMonth()][t.tipo] += t.monto;
    }
  }
  return buckets;
}

function sparkSeries(txs, period, tipo) {
  const series = [];
  let anchor = new Date(TODAY);
  for (let i = 11; i >= 0; i--) {
    const a = shiftPeriod(anchor, period, -i);
    const start = startOfPeriod(a, period);
    const end = endOfPeriod(a, period);
    let sum = 0;
    for (const t of txs) {
      if (!inRange(t.fecha, start, end)) continue;
      if (tipo === 'balance') {
        if (t.tipo === 'ingreso') sum += t.monto;
        else if (t.tipo === 'venta') sum += t.monto;
        else if (t.tipo === 'gasto') sum -= t.monto;
      } else if (t.tipo === tipo) sum += t.monto;
    }
    series.push(sum);
  }
  return series;
}

// ---- CSV export --------------------------------------------
function downloadCSV(filename, rows) {
  const escape = (v) => {
    if (v == null) return '';
    const s = String(v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const csv = rows.map((r) => r.map(escape).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportTransactions(txs, products, clients) {

    t.clienteId ? cMap[t.clienteId] || '' : '', t.nota || '',
  ])];
  downloadCSV(`life-manager_movimientos_${todayISO()}.csv`, rows);
}

// ---- Excel (.xls) export -----------------------------------
// Uses HTML/SpreadsheetML — opens cleanly in Excel, Numbers, Google Sheets.
function downloadXLS(filename, sheetName, rows) {
  const escape = (v) => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const headerRow = rows[0] || [];
  const bodyRows = rows.slice(1);
  const thead = '<tr>' + headerRow.map((h) => `<th>${escape(h)}</th>`).join('') + '</tr>';
  const tbody = bodyRows.map((r) => '<tr>' + r.map((cell) => {
    const isNumber = typeof cell === 'number' || (typeof cell === 'string' && /^-?\d+(?:\.\d+)?$/.test(cell) && cell !== '');
    return isNumber
      ? `<td x:num="${escape(cell)}" style="mso-number-format:'0.00'">${escape(cell)}</td>`
      : `<td>${escape(cell)}</td>`;
  }).join('') + '</tr>').join('');

  const html = `<!doctype html>
<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:x="urn:schemas-microsoft-com:office:excel"
      xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"/>
<!--[if gte mso 9]><xml>
  <x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
    <x:Name>${escape(sheetName)}</x:Name>
    <x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
  </x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook>
</xml><![endif]-->
<style>
  table { border-collapse: collapse; }
  th { background:#F2F0EA; text-align:left; padding:4px 8px; border:1px solid #C8C4BB; font-weight:600; }
  td { padding:4px 8px; border:1px solid #E2DED4; }
</style>
</head><body>
<table>${thead}${tbody}</table>
</body></html>`;

  const blob = new Blob(['\uFEFF' + html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

// Build rows + dispatch to the right exporter
function exportMovements({ format, txs, products, clients, sheetName, filenameBase }) {
  const pMap = Object.fromEntries(products.map((p) => [p.id, p.nombre]));
  const cMap = Object.fromEntries(clients.map((c) => [c.id, c.nombre]));
  const header = ['Fecha', 'Tipo', 'Categoría', 'Concepto', 'Monto USD', 'Producto', 'Cantidad', 'Cliente', 'Notas'];
  const rows = [header, ...txs.map((t) => [
    t.fecha, t.tipo, categoryLabel(t.tipo, t.categoria), t.concepto, t.monto.toFixed(2),
    t.productoId ? pMap[t.productoId] || '' : '', t.cantidad || '',
    t.clienteId ? cMap[t.clienteId] || '' : '', t.nota || '',
  ])];
  const base = filenameBase || `life-manager_movimientos_${todayISO()}`;
  if (format === 'xls') downloadXLS(`${base}.xls`, sheetName || 'Movimientos', rows);
  else downloadCSV(`${base}.csv`, rows);
}

// ============================================================
// CRM — clients, projects, payments, WhatsApp
// ============================================================

const PROJECT_STATES = [
  { id: 'pendiente',  label: 'Pendiente',  cls: 'pendiente' },
  { id: 'proceso',    label: 'En proceso', cls: 'proceso' },
  { id: 'finalizado', label: 'Finalizado', cls: 'finalizado' },
  { id: 'entregado',  label: 'Entregado',  cls: 'entregado' },
];
function projectStateMeta(id) {
  return PROJECT_STATES.find((s) => s.id === id) || PROJECT_STATES[0];
}

const PAYMENT_METHODS = [
  { id: 'transferencia', label: 'Transferencia' },
  { id: 'efectivo',      label: 'Efectivo' },
  { id: 'deposito',      label: 'Depósito' },
  { id: 'payphone',      label: 'PayPhone' },
  { id: 'otros',         label: 'Otros' },
];
function paymentMethodLabel(id) {
  const m = PAYMENT_METHODS.find((x) => x.id === id);
  return m ? m.label : (id || '—');
}

const OBSERVATION_PRESETS = [
  'Falta logo',
  'Falta información del negocio',
  'Falta imágenes',
  'Cliente debe aprobar diseño',
  'Solicitud de valores adicionales',
];

function projectPaid(project) {
  if (!project || !Array.isArray(project.pagos)) return 0;
  return project.pagos.reduce((s, p) => s + (+p.monto || 0), 0);
}
function projectPending(project) {
  return Math.max(0, (+project.precioTotal || 0) - projectPaid(project));
}

// Days until a date (negative = overdue). Returns null if no date.
function daysUntil(iso) {
  if (!iso) return null;
  const target = new Date(iso + 'T00:00:00');
  const diff = target.getTime() - TODAY.getTime();
  return Math.round(diff / 86400000);
}

// Build the WhatsApp message a client receives — full detail
function buildWhatsappMessage(project, client, bank) {
  const total = +project.precioTotal || 0;
  const paid = projectPaid(project);
  const pending = projectPending(project);
  const estado = projectStateMeta(project.estado).label;
  const nombre = [client.nombre, client.apellido].filter(Boolean).join(' ') || 'cliente';
  const pagos = [...(project.pagos || [])].sort((a, b) => (a.fecha < b.fecha ? -1 : 1));

  // Estado de pago: pagado / abonado parcial / sin abono
  let pagoEstado, pagoIcon;
  if (total <= 0 || pending <= 0.009) { pagoEstado = 'PAGADO ✔️'; pagoIcon = '🟢'; }
  else if (paid > 0) { pagoEstado = 'ABONADO PARCIAL'; pagoIcon = '🟡'; }
  else { pagoEstado = 'PENDIENTE DE PAGO'; pagoIcon = '🔴'; }
  const pct = total > 0 ? Math.round((paid / total) * 100) : 0;

  const lines = [];
  lines.push(`Hola ${client.nombre || nombre} 👋`);
  lines.push('Te compartimos el detalle de tu cuenta:');
  lines.push('');
  lines.push('━━━━━━━━━━━━━━━');
  lines.push(`📋 *${project.nombre}*`);
  if (project.descripcion) lines.push(`_${project.descripcion}_`);
  lines.push(`📌 Estado del trabajo: *${estado}*`);
  lines.push('━━━━━━━━━━━━━━━');
  lines.push('');

  // Fechas
  if (project.fechaInicio) lines.push(`🗓️ Inicio: ${formatDateFull(project.fechaInicio)}`);
  if (!project.plazoIndefinido && project.fechaLimite) lines.push(`⏳ Entrega: ${formatDateFull(project.fechaLimite)}`);
  if (project.fechaInicio || (!project.plazoIndefinido && project.fechaLimite)) lines.push('');

  // Resumen de pago
  lines.push(`${pagoIcon} *Estado de pago: ${pagoEstado}*`);
  lines.push('');
  lines.push(`💵 Valor total: ${money(total)}`);
  lines.push(`✅ Abonado: ${money(paid)}  (${pct}%)`);
  lines.push(`🔻 Saldo pendiente: ${money(pending)}`);

  // Historial de abonos
  if (pagos.length > 0) {
    lines.push('');
    lines.push('🧾 *Detalle de abonos:*');
    pagos.forEach((p, i) => {
      const met = paymentMethodLabel(p.metodo);
      lines.push(`  ${i + 1}. ${formatDateFull(p.fecha)} — ${money(p.monto)} (${met})`);
    });
  }

  // Datos de pago si hay saldo
  if (pending > 0.009 && bank && (bank.banco || bank.numeroCuenta)) {
    lines.push('');
    lines.push('💳 *Para abonar el saldo:*');
    if (bank.banco)        lines.push(`🏦 Banco: ${bank.banco}`);
    if (bank.tipoCuenta)   lines.push(`📂 Tipo: Cuenta ${bank.tipoCuenta}`);
    if (bank.numeroCuenta) lines.push(`#️⃣ N° de cuenta: ${bank.numeroCuenta}`);
    if (bank.titular)      lines.push(`👤 Titular: ${bank.titular}`);
  }

  lines.push('');
  if (pending <= 0.009 && total > 0) {
    lines.push('¡Tu cuenta está al día! Gracias por tu confianza 🙌');
  } else {
    lines.push('¡Gracias por confiar en nuestro trabajo! 🙌');
  }
  return lines.join('\n');
}

// Normalise a phone to digits and build a wa.me link
function whatsappLink(phone, message) {
  const digits = String(phone || '').replace(/[^\d]/g, '');
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}

// ============================================================
// Reporte consolidado por cliente (todos los proyectos)
// ============================================================
function reportClientName(c) {
  return [c.nombre, c.apellido].filter(Boolean).join(' ') || 'Sin nombre';
}
function clientReportTotals(projects) {
  let total = 0, abonado = 0, pendiente = 0;
  for (const p of projects) { total += +p.precioTotal || 0; abonado += projectPaid(p); pendiente += projectPending(p); }
  return { total, abonado, pendiente, count: projects.length };
}
function projectPagoEstado(p) {
  const total = +p.precioTotal || 0, pend = projectPending(p), paid = projectPaid(p);
  if (total <= 0 || pend <= 0.009) return { label: 'Pagado', icon: '🟢', cls: 'pagado' };
  if (paid > 0) return { label: 'Abonado parcial', icon: '🟡', cls: 'parcial' };
  return { label: 'Pendiente', icon: '🔴', cls: 'pendiente' };
}

// Texto para WhatsApp: resumen de TODOS los proyectos del cliente
function buildClientReport(client, projects, bank) {
  const nombre = client.nombre || reportClientName(client) || 'cliente';
  const t = clientReportTotals(projects);

  });

  if (t.pendiente > 0.009 && bank && (bank.banco || bank.numeroCuenta)) {
    lines.push('');
    lines.push('═══════════════════');

  }
  lines.push('');
  lines.push(t.pendiente <= 0.009 && t.total > 0 ? '¡Tu cuenta está al día! Gracias por tu confianza 🙌' : '¡Gracias por confiar en nuestro trabajo! 🙌');
  return lines.join('\n');
}

// 'cobrar' = un cliente me debe (fiado) · 'pagar' = yo le debo a alguien
const DEBT_DIRECTIONS = [
  { id: 'cobrar', label: 'Por cobrar', persona: 'Cliente', who: 'Me debe' },
  { id: 'pagar',  label: 'Por pagar',  persona: 'Acreedor', who: 'Le debo' },
];

function debtPaid(d) {
  if (!d || !Array.isArray(d.pagos)) return 0;
  return d.pagos.reduce((s, p) => s + (+p.monto || 0), 0);
}
function debtBalance(d) {
  return Math.max(0, (+d.total || 0) - debtPaid(d));
}

// Semáforo de cobro: 'pagado' | 'aldia' | 'porvencer' | 'vencido'
function debtStatus(d) {
  if (debtBalance(d) <= 0.009) return 'pagado';
  const dleft = daysUntil(d.fechaVencimiento);
  if (dleft == null) return 'aldia';
  if (dleft < 0) return 'vencido';
  if (dleft <= 3) return 'porvencer';
  return 'aldia';
}
const DEBT_STATUS_META = {
  pagado:    { label: 'Pagado',           cls: 'pagado',    dot: 'pagado' },
  aldia:     { label: 'Al día',           cls: 'aldia',     dot: 'verde' },
  porvencer: { label: 'Próximo a vencer', cls: 'porvencer', dot: 'amarillo' },
  vencido:   { label: 'Vencido',          cls: 'vencido',   dot: 'rojo' },
};
function debtStatusMeta(d) { return DEBT_STATUS_META[debtStatus(d)] || DEBT_STATUS_META.aldia; }

// Mensaje de recordatorio de cobro (WhatsApp)
function buildDebtReminder(d, bank) {
  const saldo = debtBalance(d);

  lines.push(`Hola ${d.contraparte || ''} 👋`.trim());

  lines.push(`✅ Abonado: ${money(debtPaid(d))}`);
  lines.push(`🔻 Saldo pendiente: ${money(saldo)}`);
  if (d.fechaVencimiento) lines.push(`📅 Vence: ${formatDateFull(d.fechaVencimiento)}`);
  if (bank && (bank.banco || bank.numeroCuenta)) {
    lines.push('');

    if (bank.banco)        lines.push(`🏦 Banco: ${bank.banco}`);

  }
  lines.push('');
  lines.push('¡Gracias! 🙌');
  return lines.join('\n');
}

function zonaLabel(id) { return id ? zonaMeta(id).label : '—'; }

// Estados operativos del pedido
const PEDIDO_ESTADOS = [
  { id: 'nuevo',      label: 'Por confirmar', short: 'Por confirmar', cls: 'nuevo',      dot: 'gris' },
  { id: 'confirmado', label: 'Confirmado',    short: 'Confirmado',    cls: 'confirmado', dot: 'azul' },
  { id: 'ruta',       label: 'En ruta',       short: 'En ruta',       cls: 'ruta',       dot: 'amarillo' },
  { id: 'entregado',  label: 'Entregado',     short: 'Entregado',     cls: 'entregado',  dot: 'verde' },
  { id: 'reagendado', label: 'Reagendado',    short: 'Reagendado',    cls: 'reagendado', dot: 'amarillo' },
  { id: 'devuelto',   label: 'Devuelto',      short: 'Devuelto',      cls: 'devuelto',   dot: 'rojo' },
  { id: 'cancelado',  label: 'Cancelado',     short: 'Cancelado',     cls: 'cancelado',  dot: 'gris' },
];
function pedidoEstadoMeta(id) { return PEDIDO_ESTADOS.find((e) => e.id === id) || PEDIDO_ESTADOS[0]; }

// Estados que ya cerraron el ciclo (no cuentan como pendientes)
const ESTADOS_CERRADOS = ['entregado', 'devuelto', 'cancelado'];
function pedidoAbierto(p) { return !ESTADOS_CERRADOS.includes(p.estado); }

// ---- Totales ------------------------------------------------
function pedidoSubtotal(p) {
  return (p.items || []).reduce((s, it) => s + (+it.precio || 0) * (+it.cantidad || 0), 0);
}
function pedidoUnidades(p) {
  return (p.items || []).reduce((s, it) => s + (+it.cantidad || 0), 0);
}
function pedidoTotal(p) {
  return Math.max(0, pedidoSubtotal(p) - (+p.descuento || 0) + (+p.flete || 0));
}
// Lo que el negocio se queda: total menos el flete que se lleva el repartidor
function pedidoNeto(p) {
  return pedidoTotal(p) - (p.fleteParaRepartidor ? (+p.flete || 0) : 0);
}
function pedidoItemsResumen(p) {
  const items = p.items || [];
  if (!items.length) return '—';
  const first = `${items[0].cantidad}× ${items[0].nombre}`;
  return items.length === 1 ? first : `${first} +${items.length - 1}`;
}
function nextPedidoNumero(pedidos) {
  let max = 0;
  for (const p of pedidos) { const n = parseInt(p.numero, 10); if (n > max) max = n; }
  return max + 1;
}
function pedidoRef(p) { return '#' + String(p.numero || 0).padStart(4, '0'); }

// ---- Cuadre de repartidores ---------------------------------
// Efectivo que el repartidor cobró y todavía no ha liquidado,
// menos los fletes que le corresponden.
function cuadreRepartidor(pedidos, repartidorId) {
  const suyos = pedidos.filter((p) => p.repartidorId === repartidorId);
  const entregados = suyos.filter((p) => p.estado === 'entregado');
  const porLiquidar = entregados.filter((p) => !p.liquidado);

  let efectivo = 0, otros = 0, fletes = 0;
  for (const p of porLiquidar) {
    if (p.metodoPago === 'efectivo') efectivo += pedidoTotal(p);
    else otros += pedidoTotal(p);
    if (p.fleteParaRepartidor) fletes += (+p.flete || 0);
  }
  return {
    enRuta: suyos.filter((p) => p.estado === 'ruta').length,
    entregados: entregados.length,
    porLiquidar,
    efectivo,          // plata en mano del repartidor
    otros,             // cobrado por transferencia / payphone
    fletes,            // lo que hay que pagarle
    aRecibir: efectivo - fletes,
    devueltos: suyos.filter((p) => p.estado === 'devuelto').length,
  };
}

function repartidorNombre(reps, id) {
  const r = (reps || []).find((x) => x.id === id);
  return r ? r.nombre : '';
}

function buildRutaWhatsapp(repartidor, pedidos, fecha) {

      ? `💵 COBRAR ${money(t)} en efectivo`
      : `✅ YA PAGADO (${paymentMethodLabel(p.metodoPago)}) — no cobrar`);

}

// ---- Cierre de caja (ventas en local) -----------------------
function cierreCaja(pedidos, fechaISO) {
  const dia = pedidos.filter((p) => p.canal === 'local' && p.fecha === fechaISO && p.estado !== 'cancelado');
  const porMetodo = {};
  let total = 0;
  for (const p of dia) {
    const t = pedidoTotal(p);
    total += t;
    porMetodo[p.metodoPago || 'efectivo'] = (porMetodo[p.metodoPago || 'efectivo'] || 0) + t;
  }
  return {
    fecha: fechaISO,
    tickets: dia.length,
    total,
    promedio: dia.length ? total / dia.length : 0,
    efectivo: porMetodo.efectivo || 0,
    porMetodo,
    unidades: dia.reduce((s, p) => s + pedidoUnidades(p), 0),
    lista: dia,
  };
}

// ---- Delta + Sparkline -------------------------------------
function Delta({ now, prev }) {
  if (!prev) return <span className="delta neutral">— sin dato previo</span>;
  const change = now - prev;
  const pct = (change / Math.max(1, Math.abs(prev))) * 100;
  const sign = change > 0 ? '+' : change < 0 ? '−' : '';
  const cls = change > 0 ? 'pos' : change < 0 ? 'neg' : 'neutral';
  const arrow = change > 0 ? '↑' : change < 0 ? '↓' : '·';
  return (
    <span className={`delta ${cls}`}>
      <span className="delta-arrow">{arrow}</span>
      {sign}{Math.abs(pct).toFixed(1)}% <span className="delta-vs">vs anterior</span>
    </span>
  );
}

function Sparkline({ values, height = 28, stroke = 'var(--ink)', fill = false }) {
  if (!values || !values.length) return null;
  const allZero = values.every((v) => v === 0);
  const w = 96, h = height;
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 1);
  const range = max - min || 1;
  const step = w / (values.length - 1 || 1);
  const points = values.map((v, i) => {
    const x = i * step;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return [x, y];
  });
  const d = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
  const dArea = `${d} L${w},${h} L0,${h} Z`;
  if (allZero) {
    return (
      <svg className="spark" viewBox={`0 0 ${w} ${h}`} width={w} height={h} preserveAspectRatio="none">
        <line x1="0" y1={h - 2} x2={w} y2={h - 2} stroke="var(--hairline)" strokeDasharray="2 3" />
      </svg>
    );
  }
  return (
    <svg className="spark" viewBox={`0 0 ${w} ${h}`} width={w} height={h} preserveAspectRatio="none">
      {fill && <path d={dArea} fill="var(--ink-wash)" />}
      <path d={d} fill="none" stroke={stroke} strokeWidth="1.25" />
    </svg>
  );
}

// ---- Flow chart --------------------------------------------
function FlowChart({ buckets, hasData }) {
  const [mode, setMode] = useState('diario');
  const totalIn = buckets.reduce((s, b) => s + b.ingreso + b.venta, 0);
  const totalOut = buckets.reduce((s, b) => s + b.gasto, 0);

  const w = 760, h = 240, padL = 44, padR = 16, padT = 16, padB = 28;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const n = buckets.length;
  const gap = n > 30 ? 1 : n > 12 ? 2 : 4;
  const groupW = innerW / n;
  const barW = Math.max(2, (groupW - gap) / 2);

  let maxVal;
  if (mode === 'diario') {
    maxVal = Math.max(1, ...buckets.map(b => Math.max(b.ingreso + b.venta, b.gasto)));
  } else {
    let inAcc = 0, outAcc = 0, peak = 1;
    for (const b of buckets) { inAcc += b.ingreso + b.venta; outAcc += b.gasto; peak = Math.max(peak, inAcc, outAcc); }
    maxVal = peak;
  }
  const niceMax = hasData
    ? Math.pow(10, Math.floor(Math.log10(maxVal))) * Math.ceil(maxVal / Math.pow(10, Math.floor(Math.log10(maxVal))))
    : 100;
  const yMax = niceMax;
  const yTicks = [0, yMax * 0.25, yMax * 0.5, yMax * 0.75, yMax];
  const tickEvery = n <= 12 ? 1 : n <= 24 ? 4 : n <= 31 ? 5 : 1;

  return (
    <div className="card chart-card">
      <div className="card-head">
        <div>
          <div className="card-eyebrow">Flujo del periodo</div>
          <div className="card-title">Ingresos &amp; gastos</div>
        </div>
        <div className="chart-meta">
          <div className="legend">
            <span className="swatch in" /> <span>Entradas</span>
            <span className="dot">·</span>
            <span className="swatch out" /> <span>Gastos</span>
          </div>
          <div className="mini-tabs">
            <button className={classNames('mini-tab', mode === 'diario' && 'is-active')} onClick={() => setMode('diario')}>Por unidad</button>
            <button className={classNames('mini-tab', mode === 'acumulado' && 'is-active')} onClick={() => setMode('acumulado')}>Acumulado</button>
          </div>
        </div>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} className="chart-svg" role="img" aria-label="Gráfico de ingresos y gastos">
        {yTicks.map((t, i) => {
          const y = padT + innerH - (t / yMax) * innerH;
          return (
            <g key={i}>
              <line x1={padL} x2={w - padR} y1={y} y2={y} stroke="var(--hairline)" strokeDasharray={i === 0 ? '' : '2 3'} />
              <text x={padL - 8} y={y + 3} textAnchor="end" className="axis-label">{moneyCompact(t)}</text>
            </g>
          );
        })}
        {hasData && mode === 'diario' && buckets.map((b, i) => {
          const x = padL + i * groupW;
          const ent = b.ingreso + b.venta;
          const out = b.gasto;
          const hIn = (ent / yMax) * innerH;
          const hOut = (out / yMax) * innerH;
          const baseY = padT + innerH;
          return (
            <g key={i}>
              <rect x={x + gap / 2} y={baseY - hIn} width={barW} height={hIn} fill="var(--ink)" />
              <rect x={x + gap / 2 + barW} y={baseY - hOut} width={barW} height={hOut} fill="var(--ink-soft)" />
            </g>
          );
        })}
        {hasData && mode === 'acumulado' && (() => {
          let inAcc = 0, outAcc = 0;
          const inPts = []; const outPts = [];
          buckets.forEach((b, i) => {
            inAcc += b.ingreso + b.venta; outAcc += b.gasto;
            const x = padL + i * groupW + groupW / 2;
            inPts.push([x, padT + innerH - (inAcc / yMax) * innerH]);
            outPts.push([x, padT + innerH - (outAcc / yMax) * innerH]);
          });
          const toPath = (pts) => pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
          return (
            <g>
              <path d={toPath(inPts)} fill="none" stroke="var(--ink)" strokeWidth="1.5" />
              <path d={toPath(outPts)} fill="none" stroke="var(--ink-soft)" strokeWidth="1.5" strokeDasharray="3 3" />
              {inPts.map((p, i) => <circle key={'i'+i} cx={p[0]} cy={p[1]} r="2" fill="var(--ink)" />)}
            </g>
          );
        })()}
        {buckets.map((b, i) => {
          if (i % tickEvery !== 0 && i !== buckets.length - 1) return null;
          const x = padL + i * groupW + groupW / 2;
          return <text key={i} x={x} y={h - 8} textAnchor="middle" className="axis-label">{b.label}</text>;
        })}
        {!hasData && (
          <text x={w/2} y={h/2} textAnchor="middle" className="chart-empty-text">Sin movimientos en este periodo</text>
        )}
      </svg>
      <div className="chart-foot">
        <div className="foot-item"><span className="foot-label">Total entradas</span><span className="foot-value">{money(totalIn)}</span></div>
        <div className="foot-item"><span className="foot-label">Total gastos</span><span className="foot-value">{money(totalOut)}</span></div>
        <div className="foot-item"><span className="foot-label">Resultado</span><span className={classNames('foot-value', totalIn - totalOut < 0 && 'is-neg')}>{money(totalIn - totalOut)}</span></div>
      </div>
    </div>
  );
}

// ---- Transaction drawer (create + edit) --------------------
function TransactionDrawer({ open, onClose, onSave, editing, products, clients }) {
  const isEdit = !!editing;
  const [tipo, setTipo] = useState('gasto');
  const [monto, setMonto] = useState('');
  const [concepto, setConcepto] = useState('');
  const [categoria, setCategoria] = useState('comida');
  const [fecha, setFecha] = useState(todayISO());
  const [productoId, setProductoId] = useState('');
  const [cantidad, setCantidad] = useState(1);
  const [clienteId, setClienteId] = useState('');
  const [nota, setNota] = useState('');
  const [touched, setTouched] = useState(false);
  const [autoCalc, setAutoCalc] = useState(true);

  // Initialise when opened / editing changes
  useEffect(() => {
    if (!open) return;
    if (editing) {
      setTipo(editing.tipo);
      setMonto(String(editing.monto));
      setConcepto(editing.concepto);
      setCategoria(editing.categoria);
      setFecha(editing.fecha);
      setProductoId(editing.productoId || '');
      setCantidad(editing.cantidad || 1);
      setClienteId(editing.clienteId || '');
      setNota(editing.nota || '');
      setAutoCalc(false);
    } else {
      setTipo('gasto'); setMonto(''); setConcepto('');
      setCategoria('comida'); setFecha(todayISO());
      setProductoId(products[0]?.id || ''); setCantidad(1);
      setClienteId(clients[0]?.id || ''); setNota('');
      setAutoCalc(true);
    }
    setTouched(false);
  }, [open, editing]);

  const cats = CATEGORIES[tipo] || [];
  useEffect(() => { if (!cats.find((c) => c.id === categoria)) setCategoria(cats[0]?.id || ''); }, [tipo]);

  // Auto-fill amount + concept when product changes (sale type)
  useEffect(() => {
    if (tipo !== 'venta' || !autoCalc) return;
    const p = products.find((x) => x.id === productoId);
    if (p) {
      setMonto((p.precio * cantidad).toFixed(2));
      setConcepto(`Venta · ${p.nombre}`);
    }
  }, [tipo, productoId, cantidad, autoCalc, products]);

  const valid = monto && +monto > 0 && concepto.trim().length > 0 && fecha;

  function handleSave() {
    setTouched(true);
    if (!valid) return;
    const tx = {
      id: editing ? editing.id : newId('tx'),
      tipo, categoria,
      concepto: concepto.trim(),
      monto: +(+monto).toFixed(2),
      fecha,
      nota: nota.trim(),
    };
    if (tipo === 'venta') {
      if (productoId) tx.productoId = productoId;
      if (cantidad) tx.cantidad = +cantidad;
      if (clienteId) tx.clienteId = clienteId;
    }
    onSave(tx, isEdit);
    onClose();
  }

  return (
    <>
      <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
      <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open}>
        <header className="drawer-head">
          <div>
            <div className="drawer-eyebrow">{isEdit ? 'Editar' : 'Nueva transacción'}</div>
            <div className="drawer-title">{isEdit ? 'Modificar movimiento' : 'Registrar movimiento'}</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>

        <div className="drawer-body">
          <div className="type-tabs">
            {[
              { id: 'ingreso', label: 'Ingreso' },
              { id: 'gasto', label: 'Gasto' },
              { id: 'venta', label: 'Venta' },
            ].map((t) => (
              <button
                key={t.id}
                className={classNames('type-tab', tipo === t.id && 'is-active', `tab-${t.id}`)}
                onClick={() => { setTipo(t.id); setAutoCalc(t.id === 'venta'); }}
              >{t.label}</button>
            ))}
          </div>

          <div className="field amount-field">
            <label>Monto</label>
            <div className="amount-input">
              <span className="amount-symbol">$</span>
              <input
                type="number" inputMode="decimal" step="0.01" min="0"
                value={monto} onChange={(e) => { setMonto(e.target.value); setAutoCalc(false); }}
                placeholder="0.00"
              />
              <span className="amount-iso">USD</span>
            </div>
            {touched && (!monto || +monto <= 0) && <div className="field-error">Indica un monto mayor a 0.</div>}
          </div>

          {tipo === 'venta' && (
            <>
              {products.length === 0 ? (
                <div className="callout">
                  <strong>Sin productos.</strong> Crea un producto en <em>Inventario</em> antes de registrar ventas con producto, o deja este campo vacío y registra una venta libre.
                </div>
              ) : (
                <>
                  <div className="field">
                    <label>Producto</label>
                    <select value={productoId} onChange={(e) => { setProductoId(e.target.value); setAutoCalc(true); }}>
                      <option value="">— Sin producto específico —</option>
                      {products.map((p) => (

function ExportDrawer({ open, onClose, transactions, products, clients, onToast }) {
  const [format, setFormat] = useState('xls');
  const [preset, setPreset] = useState('mes');
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [tipo, setTipo] = useState('todos');

  // Compute date range from preset
  useEffect(() => {
    if (preset === 'personalizado') return;
    const today = new Date(TODAY);
    let s, e;
    if (preset === 'hoy') { s = today; e = today; }
    else if (preset === 'semana') {
      s = startOfPeriod(today, 'semana');
      e = new Date(endOfPeriod(today, 'semana').getTime() - 86400000);
    }
    else if (preset === 'mes') {
      s = startOfPeriod(today, 'mes');
      e = new Date(endOfPeriod(today, 'mes').getTime() - 86400000);
    }
    else if (preset === 'mes_pasado') {
      const prev = shiftPeriod(today, 'mes', -1);
      s = startOfPeriod(prev, 'mes');
      e = new Date(endOfPeriod(prev, 'mes').getTime() - 86400000);
    }
    else if (preset === 'anio') {
      s = startOfPeriod(today, 'anio');
      e = new Date(endOfPeriod(today, 'anio').getTime() - 86400000);
    }
    else if (preset === 'todo') { s = null; e = null; }
    setFrom(s ? s.toISOString().slice(0,10) : '');
    setTo(e ? e.toISOString().slice(0,10) : '');
  }, [preset, open]);

  // Filtered transactions
  const filtered = useMemo(() => {
    return transactions.filter((t) => {
      if (tipo !== 'todos' && t.tipo !== tipo) return false;
      if (from && t.fecha < from) return false;
      if (to && t.fecha > to) return false;
      return true;
    });
  }, [transactions, tipo, from, to]);

  // Summary
  const summary = useMemo(() => {
    let i = 0, g = 0, v = 0;
    for (const t of filtered) {
      if (t.tipo === 'ingreso') i += t.monto;
      else if (t.tipo === 'gasto') g += t.monto;
      else if (t.tipo === 'venta') v += t.monto;
    }
    return { i, g, v, count: filtered.length };
  }, [filtered]);

  function buildFilename() {
    const parts = ['life-manager', tipo === 'todos' ? 'movimientos' : tipo];
    if (from && to) parts.push(`${from}_a_${to}`);
    else if (from) parts.push(`desde_${from}`);
    else if (to) parts.push(`hasta_${to}`);
    else parts.push('todo');
    return parts.join('_');
  }

  function handleExport() {
    if (filtered.length === 0) {
      onToast && onToast('No hay movimientos en ese rango.');
      return;
    }
    exportMovements({
      format, txs: filtered, products, clients,
      sheetName: 'Movimientos',
      filenameBase: buildFilename(),
    });
    onToast && onToast(`${filtered.length} movimientos exportados a ${format === 'xls' ? 'Excel' : 'CSV'}.`);
    onClose();
  }

  const presets = [
    { id: 'hoy', label: 'Hoy' },
    { id: 'semana', label: 'Esta semana' },
    { id: 'mes', label: 'Este mes' },
    { id: 'mes_pasado', label: 'Mes pasado' },
    { id: 'anio', label: 'Este año' },
    { id: 'todo', label: 'Todo' },
    { id: 'personalizado', label: 'Personalizado' },
  ];

  return (
    <>
      <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
      <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open}>
        <header className="drawer-head">
          <div>
            <div className="drawer-eyebrow">Exportar</div>
            <div className="drawer-title">Descargar movimientos</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>
        <div className="drawer-body">
          <div className="field">
            <label>Formato</label>
            <div className="format-toggle">
              <button
                className={classNames('format-btn', format === 'xls' && 'is-active')}
                onClick={() => setFormat('xls')}
              >
                <span className="format-ext">XLS</span>
                <span className="format-name">Excel</span>
                <span className="format-desc">Abre en Microsoft Excel, Numbers o Google Sheets</span>
              </button>
              <button
                className={classNames('format-btn', format === 'csv' && 'is-active')}
                onClick={() => setFormat('csv')}
              >
                <span className="format-ext">CSV</span>
                <span className="format-name">Valores separados</span>
                <span className="format-desc">Universal · funciona en cualquier hoja de cálculo</span>
              </button>
            </div>
          </div>

          <div className="field">
            <label>Periodo</label>
            <div className="preset-grid">
              {presets.map((p) => (
                <button
                  key={p.id}
                  className={classNames('preset-btn', preset === p.id && 'is-active')}
                  onClick={() => setPreset(p.id)}
                >{p.label}</button>
              ))}
            </div>
          </div>

          <div className="field-row">
            <div className="field">
              <label>Desde</label>
              <input type="date" value={from} onChange={(e) => { setFrom(e.target.value); setPreset('personalizado'); }} />
            </div>
            <div className="field">
              <label>Hasta</label>
              <input type="date" value={to} onChange={(e) => { setTo(e.target.value); setPreset('personalizado'); }} />
            </div>
          </div>

          <div className="field">
            <label>Tipo de movimiento</label>
            <div className="chip-row">
              {[['todos','Todos'],['ingreso','Ingresos'],['gasto','Gastos'],['venta','Ventas']].map(([id, label]) => (
                <button key={id} className={classNames('chip', tipo === id && 'is-active')} onClick={() => setTipo(id)}>{label}</button>
              ))}
            </div>
          </div>

          <div className="export-summary">
            <div className="export-summary-head">
              <span className="card-eyebrow">Selección</span>
              <span className="summary-count">{summary.count} {summary.count === 1 ? 'movimiento' : 'movimientos'}</span>
            </div>
            <div className="export-summary-grid">
              <div><span className="ts-label">Ingresos</span><span className="ts-value">{money(summary.i)}</span></div>
              <div><span className="ts-label">Gastos</span><span className="ts-value">{money(summary.g)}</span></div>
              <div><span className="ts-label">Ventas</span><span className="ts-value">{money(summary.v)}</span></div>
              <div><span className="ts-label">Balance</span><span className={classNames('ts-value', (summary.i + summary.v - summary.g) < 0 && 'is-neg')}>{money(summary.i + summary.v - summary.g)}</span></div>
            </div>
          </div>
        </div>
        <footer className="drawer-foot">
          <button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" onClick={handleExport} disabled={summary.count === 0}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{marginRight: 2}}><path d="M7 1.5v8M3.5 6L7 9.5 10.5 6M2 12h10" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Descargar {format === 'xls' ? 'Excel' : 'CSV'}
          </button>
        </footer>
      </aside>
    </>
  );
}

  <script type="text/babel" data-presets="env,react">
// ============================================================
// Life Manager — page views
// ============================================================
const { useState: useStateV, useMemo: useMemoV } = React;

// ---- Empty state -------------------------------------------
function EmptyState({ title, body, action }) {

// ============================================================
// 1. Resumen
// ============================================================
function ResumenView(props) {
  const { transactions, products, clients, period, setPeriod, anchor, setAnchor, onOpenAdd, onEdit, onDelete } = props;
  const stats = useMemoV(() => aggregate(transactions, anchor, period), [transactions, anchor, period]);
  const buckets = useMemoV(() => chartBuckets(transactions, anchor, period), [transactions, anchor, period]);
  const sparks = useMemoV(() => ({
    ingreso: sparkSeries(transactions, period, 'ingreso'),
    gasto:   sparkSeries(transactions, period, 'gasto'),
    venta:   sparkSeries(transactions, period, 'venta'),
    balance: sparkSeries(transactions, period, 'balance'),
  }), [transactions, period]);
  const periodLabel = formatPeriodLabel(anchor, period);

  // ⚠️ All hooks MUST be called before any early return — rules of hooks.
  const recent = useMemoV(() => {
    const start = startOfPeriod(anchor, period);
    const end = endOfPeriod(anchor, period);
    return transactions
      .filter((t) => { const d = new Date(t.fecha + 'T00:00:00'); return d >= start && d < end; })
      .slice(0, 8);
  }, [transactions, anchor, period]);

  if (transactions.length === 0) {
    return (
      <>
        <PeriodBar period={period} setPeriod={setPeriod} anchor={anchor} setAnchor={setAnchor}
          label={periodLabel} eyebrow="Resumen" />
        <EmptyState
          title="Aún no tienes movimientos"
          body="Empieza registrando tu primer ingreso, gasto o venta. Aquí verás tu balance, gráficos y categorías en cuanto agregues datos."
          action={<button className="btn-primary" onClick={onOpenAdd}><span>+</span> Registrar transacción</button>}
        />
      </>
    );
  }

  return (
    <>
      <PeriodBar period={period} setPeriod={setPeriod} anchor={anchor} setAnchor={setAnchor}
        label={periodLabel} eyebrow="Resumen" />
      <KPIRow stats={stats} sparks={sparks} />
      <section className="row row-chart">
        <FlowChart buckets={buckets} hasData={stats.count > 0} />
        <CategoriesPanel byCat={stats.byCat} total={stats.gasto} />
      </section>
      <section className="card mov-card" style={{marginTop:'var(--row-gap)'}}>
        <div className="card-head">
          <div>
            <div className="card-eyebrow">Detalle</div>
            <div className="card-title">Movimientos del periodo</div>
          </div>
          <div className="card-meta">{stats.count} movimientos</div>
        </div>
        <MovementsTable txs={recent} products={products} clients={clients} onEdit={onEdit} onDelete={onDelete} compact />
      </section>
    </>
  );
}

// ============================================================
// Shared movements table
// ============================================================
function MovementsTable({ txs, products, clients, onEdit, onDelete, compact }) {
  const pMap = useMemoV(() => Object.fromEntries(products.map((p) => [p.id, p])), [products]);
  const cMap = useMemoV(() => Object.fromEntries(clients.map((c) => [c.id, c])), [clients]);

  if (txs.length === 0) {
    return <div className="empty-row" style={{padding:'40px 0'}}>Sin movimientos para mostrar.</div>;
  }
  return (
    <div className="table-wrap">
      <table className="movs">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Categoría</th>
            {!compact && <th>Detalle</th>}
            <th>Tipo</th>
            <th className="num">Monto</th>
            <th className="actions-col"></th>
          </tr>
        </thead>
        <tbody>
          {txs.map((t) => {
            const sign = t.tipo === 'gasto' ? '−' : '+';
            const cls = t.tipo === 'gasto' ? 'neg' : t.tipo === 'venta' ? 'venta' : 'pos';
            const product = t.productoId ? pMap[t.productoId] : null;
            const client = t.clienteId ? cMap[t.clienteId] : null;
            return (
              <tr key={t.id}>
                <td className="muted">{formatDate(t.fecha)}</td>
                <td className="concept">{t.concepto}</td>
                <td className="muted">{categoryLabel(t.tipo, t.categoria)}</td>
                {!compact && (
                  <td className="muted small">
                    {product && <>{t.cantidad}× {product.nombre}{client && <> · {client.nombre}</>}</>}
                    {!product && client && <>{client.nombre}</>}
                    {!product && !client && t.nota}
                  </td>
                )}
                <td><span className={`pill pill-${t.tipo}`}>{t.tipo}</span></td>
                <td className={`num amount ${cls}`}>{sign}{money(t.monto).replace('$','$')}</td>
                <td className="actions-col">
                  <div className="row-actions">
                    <button className="row-btn" onClick={() => onEdit(t)} title="Editar">
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4.5 11.5 2 12l.5-2.5L9.5 2.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>
                    </button>
                    <button className="row-btn danger" onClick={() => onDelete(t)} title="Eliminar">
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    </button>
                  </div>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ============================================================
// 2. Movimientos (full)
// ============================================================
function MovimientosView(props) {
  const { transactions, products, clients, onOpenAdd, onEdit, onDelete } = props;
  const [filter, setFilter] = useStateV('todos');
  const [query, setQuery] = useStateV('');
  const [dateFrom, setDateFrom] = useStateV('');
  const [dateTo, setDateTo] = useStateV('');

  const filtered = useMemoV(() => {
    const q = query.trim().toLowerCase();
    return transactions.filter((t) => {
      if (filter !== 'todos' && t.tipo !== filter) return false;
      if (q && !(t.concepto.toLowerCase().includes(q) || (t.nota || '').toLowerCase().includes(q))) return false;
      if (dateFrom && t.fecha < dateFrom) return false;
      if (dateTo && t.fecha > dateTo) return false;
      return true;
    });
  }, [transactions, filter, query, dateFrom, dateTo]);

  const totals = useMemoV(() => {
    let i = 0, g = 0, v = 0;
    for (const t of filtered) {
      if (t.tipo === 'ingreso') i += t.monto;
      else if (t.tipo === 'gasto') g += t.monto;
      else if (t.tipo === 'venta') v += t.monto;
    }
    return { i, g, v, balance: i + v - g };
  }, [filtered]);

  return (
    <>
      <section className="action-bar">
        <div className="action-bar-left">
          <div className="page-eyebrow">Detalle</div>
          <h1 className="page-title">movimientos</h1>
        </div>
        <div className="action-bar-right">
          <button className="btn-ghost" onClick={() => props.onOpenExport && props.onOpenExport()}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{marginRight: 4}}><path d="M7 1.5v8M3.5 6L7 9.5 10.5 6M2 12h10" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Exportar
          </button>
          <button className="btn-primary" onClick={onOpenAdd}><span>+</span> Nueva transacción</button>
        </div>
      </section>

      {transactions.length === 0 ? (
        <EmptyState
          title="Sin movimientos registrados"
          body="Cuando registres ingresos, gastos o ventas aparecerán aquí en una lista filtrable y exportable."
          action={<button className="btn-primary" onClick={onOpenAdd}><span>+</span> Registrar primera transacción</button>}
        />
      ) : (
        <div className="card">
          <div className="filters-bar">
            <div className="filters-left">
              <div className="search-field">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.25" stroke="currentColor" strokeWidth="1.1"/><path d="M9.5 9.5L12.5 12.5" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round"/></svg>
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar concepto o nota…" />
              </div>
              <div className="mini-tabs">
                {[['todos','Todos'],['ingreso','Ingresos'],['gasto','Gastos'],['venta','Ventas']].map(([id, label]) => (
                  <button key={id} className={classNames('mini-tab', filter === id && 'is-active')} onClick={() => setFilter(id)}>{label}</button>
                ))}
              </div>
            </div>
            <div className="filters-right">
              <label className="date-range">
                <span>Desde</span>
                <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} />
              </label>
              <label className="date-range">
                <span>Hasta</span>
                <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)} />
              </label>
              {(dateFrom || dateTo || query || filter !== 'todos') && (
                <button className="link-btn" onClick={() => { setDateFrom(''); setDateTo(''); setQuery(''); setFilter('todos'); }}>Limpiar</button>
              )}
            </div>
          </div>

          <div className="totals-strip">
            <div><span className="ts-label">Resultados</span><span className="ts-value">{filtered.length}</span></div>
            <div><span className="ts-label">Ingresos</span><span className="ts-value">{money(totals.i)}</span></div>
            <div><span className="ts-label">Gastos</span><span className="ts-value">{money(totals.g)}</span></div>
            <div><span className="ts-label">Ventas</span><span className="ts-value">{money(totals.v)}</span></div>
            <div><span className="ts-label">Balance</span><span className={classNames('ts-value', totals.balance < 0 && 'is-neg')}>{money(totals.balance)}</span></div>
          </div>

          <MovementsTable txs={filtered} products={products} clients={clients} onEdit={onEdit} onDelete={onDelete} />
        </div>
      )}
    </>
  );
}

// 3. Inventario
// ============================================================
function InventarioView(props) {
  const { products, transactions, onAdd, onEdit, onDelete } = props;
  const sold = useMemoV(() => {
    const m = {};
    for (const t of transactions) if (t.tipo === 'venta' && t.productoId) m[t.productoId] = (m[t.productoId] || 0) + (t.cantidad || 1);
    return m;
  }, [transactions]);

  const revenue = useMemoV(() => {
    const m = {};
    for (const t of transactions) if (t.tipo === 'venta' && t.productoId) m[t.productoId] = (m[t.productoId] || 0) + t.monto;
    return m;
  }, [transactions]);

  const totals = useMemoV(() => {
    const totalValue = products.reduce((s, p) => s + p.stock * p.costo, 0);
    const totalUnits = products.reduce((s, p) => s + p.stock, 0);
    const lowStock = products.filter((p) => p.stock > 0 && p.stock <= 5).length;
    const outStock = products.filter((p) => p.stock === 0).length;
    return { totalValue, totalUnits, lowStock, outStock };
  }, [products]);

  return (
    <>
      <section className="action-bar">
        <div className="action-bar-left">
          <div className="page-eyebrow">Productos</div>
          <h1 className="page-title">inventario</h1>
        </div>
        <div className="action-bar-right">
          <button className="btn-primary" onClick={onAdd}><span>+</span> Nuevo producto</button>
        </div>
      </section>

      {products.length === 0 ? (
        <EmptyState
          title="Sin productos en inventario"
          body="Agrega tus productos para poder registrar ventas con stock automático, márgenes y top de productos vendidos."
          action={<button className="btn-primary" onClick={onAdd}><span>+</span> Crear primer producto</button>}
        />
      ) : (
        <>
          <div className="kpi-row inv-kpis">
            <div className="kpi"><div className="kpi-label">Productos</div><div className="kpi-value">{products.length}</div></div>
            <div className="kpi"><div className="kpi-label">Unidades en stock</div><div className="kpi-value">{totals.totalUnits}</div></div>
            <div className="kpi"><div className="kpi-label">Valor inventario</div><div className="kpi-value">{money(totals.totalValue)}</div></div>
            <div className="kpi"><div className="kpi-label">Alertas</div><div className="kpi-value">{totals.lowStock + totals.outStock}<span className="kpi-suffix"> {totals.outStock > 0 ? `· ${totals.outStock} sin stock` : `· ${totals.lowStock} bajo`}</span></div></div>
          </div>

          <div className="card" style={{marginTop:'var(--row-gap)'}}>
            <div className="card-head">
              <div>
                <div className="card-eyebrow">Catálogo</div>
                <div className="card-title">{products.length} productos</div>
              </div>
            </div>
            <div className="table-wrap">
              <table className="movs">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th className="num">Stock</th>
                    <th className="num">Precio</th>
                    <th className="num">Costo</th>
                    <th className="num">Margen</th>
                    <th className="num">Vendidas</th>
                    <th className="num">Ingreso</th>
                    <th className="actions-col"></th>
                  </tr>
                </thead>
                <tbody>
                  {products.map((p) => {
                    const margin = p.precio - p.costo;
                    const marginPct = p.precio > 0 ? (margin / p.precio) * 100 : 0;
                    const out = p.stock === 0;
                    const low = !out && p.stock <= 5;
                    return (
                      <tr key={p.id}>
                        <td className="concept">
                          <div className="inv-name">
                            <span>{p.nombre}</span>
                            {out && <span className="badge danger">Sin stock</span>}
                            {low && <span className="badge warn">Bajo</span>}
                          </div>
                        </td>
                        <td className="num"><strong>{p.stock}</strong></td>
                        <td className="num">{money(p.precio)}</td>
                        <td className="num muted">{money(p.costo)}</td>
                        <td className="num">{money(margin)} <span className="muted small">· {marginPct.toFixed(0)}%</span></td>
                        <td className="num">{sold[p.id] || 0}</td>
                        <td className="num">{money(revenue[p.id] || 0)}</td>
                        <td className="actions-col">
                          <div className="row-actions">
                            <button className="row-btn" onClick={() => onEdit(p)} title="Editar"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4.5 11.5 2 12l.5-2.5L9.5 2.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg></button>
                            <button className="row-btn danger" onClick={() => onDelete(p)} title="Eliminar"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}
    </>
  );
}

// ============================================================
// 5. Reportes
// ============================================================
function ReportesView(props) {
  const { transactions, products, clients, period, setPeriod, anchor, setAnchor } = props;
  const stats = useMemoV(() => aggregate(transactions, anchor, period), [transactions, anchor, period]);
  const buckets = useMemoV(() => chartBuckets(transactions, anchor, period), [transactions, anchor, period]);
  const periodLabel = formatPeriodLabel(anchor, period);

  // Top productos (in this period)
  const topProducts = useMemoV(() => {
    const start = startOfPeriod(anchor, period);
    const end = endOfPeriod(anchor, period);
    const m = {};
    for (const t of transactions) {
      if (t.tipo !== 'venta' || !t.productoId) continue;
      const d = new Date(t.fecha + 'T00:00:00');
      if (d < start || d >= end) continue;
      if (!m[t.productoId]) m[t.productoId] = { qty: 0, total: 0 };
      m[t.productoId].qty += t.cantidad || 1; m[t.productoId].total += t.monto;
    }
    const pMap = Object.fromEntries(products.map((p) => [p.id, p]));
    return Object.entries(m)
      .map(([id, v]) => ({ id, nombre: pMap[id]?.nombre || 'Producto', qty: v.qty, total: v.total }))
      .sort((a, b) => b.total - a.total).slice(0, 8);
  }, [transactions, products, anchor, period]);

  // Top clientes
  const topClients = useMemoV(() => {
    const start = startOfPeriod(anchor, period);
    const end = endOfPeriod(anchor, period);
    const m = {};
    for (const t of transactions) {
      if (t.tipo !== 'venta' || !t.clienteId) continue;
      const d = new Date(t.fecha + 'T00:00:00');
      if (d < start || d >= end) continue;
      if (!m[t.clienteId]) m[t.clienteId] = { count: 0, total: 0 };
      m[t.clienteId].count += 1; m[t.clienteId].total += t.monto;
    }
    const cMap = Object.fromEntries(clients.map((c) => [c.id, c]));
    return Object.entries(m)
      .map(([id, v]) => ({ id, nombre: cMap[id]?.nombre || 'Cliente', count: v.count, total: v.total }))
      .sort((a, b) => b.total - a.total).slice(0, 8);
  }, [transactions, clients, anchor, period]);

  // 12-period trend (ingresos vs gastos)
  const trend12 = useMemoV(() => {
    const arr = [];
    for (let i = 11; i >= 0; i--) {
      const a = shiftPeriod(anchor, period, -i);
      const start = startOfPeriod(a, period);
      const end = endOfPeriod(a, period);
      let ing = 0, gas = 0, ven = 0;
      for (const t of transactions) {
        const d = new Date(t.fecha + 'T00:00:00');
        if (d < start || d >= end) continue;
        if (t.tipo === 'ingreso') ing += t.monto;
        else if (t.tipo === 'gasto') gas += t.monto;
        else if (t.tipo === 'venta') ven += t.monto;
      }
      arr.push({ label: formatPeriodLabel(a, period), ing, gas, ven, net: ing + ven - gas });
    }
    return arr;
  }, [transactions, anchor, period]);

  if (transactions.length === 0) {
    return (
      <>
        <PeriodBar period={period} setPeriod={setPeriod} anchor={anchor} setAnchor={setAnchor}
          label={periodLabel} eyebrow="Reportes" />
        <EmptyState
          title="Aún no hay reportes"
          body="Cuando registres movimientos verás aquí tendencias, top productos y top clientes."
          action={null}
        />
      </>
    );
  }

  const maxTrend = Math.max(1, ...trend12.flatMap((d) => [d.ing + d.ven, d.gas]));

  return (
    <>
      <PeriodBar period={period} setPeriod={setPeriod} anchor={anchor} setAnchor={setAnchor}
        label={periodLabel} eyebrow="Reportes" />

      <div className="kpi-row">
        <div className="kpi"><div className="kpi-label">Ingresos</div><div className="kpi-value">{money(stats.ingreso)}</div><Delta now={stats.ingreso} prev={stats.prev.ingreso} /></div>
        <div className="kpi"><div className="kpi-label">Gastos</div><div className="kpi-value">{money(stats.gasto)}</div><Delta now={stats.gasto} prev={stats.prev.gasto} /></div>
        <div className="kpi"><div className="kpi-label">Ventas</div><div className="kpi-value">{money(stats.venta)}</div><Delta now={stats.venta} prev={stats.prev.venta} /></div>
        <div className="kpi"><div className="kpi-label">Balance</div><div className="kpi-value">{money(stats.balance)}</div><Delta now={stats.balance} prev={stats.prev.balance} /></div>
      </div>

      <section className="row row-chart">
        <FlowChart buckets={buckets} hasData={stats.count > 0} />
        <CategoriesPanel byCat={stats.byCat} total={stats.gasto} />
      </section>

      <section className="card" style={{marginTop:'var(--row-gap)'}}>
        <div className="card-head">
          <div>
            <div className="card-eyebrow">Tendencia · últimos 12</div>
            <div className="card-title">Comparación periodo a periodo</div>
          </div>
          <div className="legend">
            <span className="swatch in" /> <span>Entradas</span>
            <span className="dot">·</span>
            <span className="swatch out" /> <span>Gastos</span>
          </div>
        </div>
        <div className="trend-grid">
          {trend12.map((d, i) => {
            const inH = ((d.ing + d.ven) / maxTrend) * 100;
            const outH = (d.gas / maxTrend) * 100;
            return (
              <div className="trend-col" key={i}>
                <div className="trend-bars">
                  <div className="trend-bar in" style={{height: inH + '%'}} title={`Entradas ${money(d.ing + d.ven)}`}></div>

function clientInitials(c) {
