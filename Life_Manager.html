<!doctype html>
<html lang="es" data-theme="claro" data-density="comoda">
<head>
  <meta charset="utf-8" />
  <title>Life Manager · Pedidos, ingresos, gastos y ventas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F5EF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   Life Manager — stylesheet
   Minimalist, professional, B/W with subtle warmth.
   ============================================================ */

:root {
  --bg:           #F7F5EF;
  --surface:      #FFFFFF;
  --surface-2:    #FBF9F4;
  --ink:          #0E0E0C;
  --ink-2:        #555350;
  --ink-3:        #8E8B84;
  --ink-4:        #B7B3AB;
  --ink-soft:     #C8C4BB;
  --ink-wash:     rgba(14,14,12,0.06);
  --hairline:     #E2DED4;
  --hairline-2:   #ECE8DE;
  --pos:          #2B6E47;
  --neg:          #A8392A;
  --venta:        #2A4A6E;
  --brand:        #1C6B43;
  --brand-strong: #155435;
  --brand-ink:    #FFFFFF;
  --brand-wash:   rgba(28,107,67,0.10);
  --brand-line:   rgba(28,107,67,0.28);
  --shadow:       0 1px 0 rgba(14,14,12,0.04);
  --radius:       6px;
  --radius-lg:    10px;

  --row-gap:      18px;
  --col-gap:      18px;
  --cell-py:      14px;
}

html[data-theme="oscuro"] {
  --bg:         #111110;
  --surface:    #181816;
  --surface-2:  #1E1D1A;
  --ink:        #F4F2EC;
  --ink-2:      #B6B2A8;
  --ink-3:      #807C73;
  --ink-4:      #5A574F;
  --ink-soft:   #46433C;
  --ink-wash:   rgba(244,242,236,0.08);
  --hairline:   #2A2925;
  --hairline-2: #232220;
  --pos:        #6FBE8A;
  --neg:        #E58A7D;
  --venta:      #8FB3E5;
  --brand:        #2E8A57;
  --brand-strong: #379A63;
  --brand-ink:    #FFFFFF;
  --brand-wash:   rgba(79,168,119,0.14);
  --brand-line:   rgba(79,168,119,0.34);
}
html[data-density="compacta"] {
  --row-gap: 12px;
  --col-gap: 12px;
  --cell-py: 10px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hanken Grotesk", "Helvetica Neue", Helvetica, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea, button { font-family: inherit; font-size: inherit; color: inherit; }

.num, .amount, .kpi-value, .axis-label, .foot-value,
.contacts td.num, .inv-stock strong, .cat-amount, .inv-price,
.ts-value, .rank-num, .rank-amount, .trend-net {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-feature-settings: "tnum", "zero";
  letter-spacing: -0.01em;
}

/* ---------------------------------------------------------- */
/* Layout                                                      */
/* ---------------------------------------------------------- */
.app { min-height: 100vh; }
.main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 28px 32px 80px;
}
.row { display: grid; gap: var(--col-gap); margin-top: var(--row-gap); }
.row-chart  { grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); }
.row-detail { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

/* ---------------------------------------------------------- */
/* Header                                                      */
/* ---------------------------------------------------------- */
.header {
  position: sticky; top: 0;
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: saturate(140%) blur(6px);
  border-bottom: 1px solid var(--hairline);
  z-index: 30;
}
.header-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 14px 32px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 28px;
  align-items: center;
}
.brand-btn {
  display: flex; align-items: baseline; gap: 8px;
  border: 0; background: transparent; padding: 0;
}
.brand-mark {
  width: 10px; height: 10px; background: var(--brand); display: inline-block;
  transform: translateY(1px);
  border-radius: 2px;
}
.brand-word { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }

.nav { display: flex; gap: 6px; }
.nav-link {
  border: 0; background: transparent;
  color: var(--ink-3); font-size: 13px; font-weight: 500;
  padding: 6px 12px; border-radius: var(--radius);
}
.nav-link:hover { color: var(--ink); background: var(--ink-wash); }
.nav-link.active {
  color: var(--brand);
  background: var(--brand-wash);
  box-shadow: inset 0 -2px 0 var(--brand);
}

.header-actions { display: flex; align-items: center; gap: 14px; }
.header-count {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
}

/* ---------------------------------------------------------- */
/* Action bar                                                  */
/* ---------------------------------------------------------- */
.action-bar {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 22px; gap: 24px; flex-wrap: wrap;
}
.page-eyebrow {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 4px;
}
.page-title {
  font-size: 30px; font-weight: 600; letter-spacing: -0.025em; margin: 0;
  text-transform: lowercase;
}
.action-bar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.segmented {
  display: inline-flex; background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 2px;
}
.segmented-btn {
  border: 0; background: transparent; color: var(--ink-2);
  padding: 6px 12px; font-size: 13px; font-weight: 500;
  border-radius: calc(var(--radius) - 2px);
}
.segmented-btn:hover { color: var(--ink); }
.segmented-btn.is-active { background: var(--ink); color: var(--bg); }

.date-nav { display: inline-flex; align-items: center; gap: 4px; }
.icon-btn {
  width: 30px; height: 30px; border: 1px solid var(--hairline);
  background: var(--surface); border-radius: var(--radius);
  color: var(--ink); font-size: 14px; line-height: 1;
}
.icon-btn:hover { border-color: var(--ink); }
.icon-btn.pill { width: auto; padding: 0 12px; font-size: 12px; font-weight: 500; }
.icon-btn[disabled], .icon-btn.is-disabled { color: var(--ink-3); cursor: default; }
.icon-btn[disabled]:hover, .icon-btn.is-disabled:hover { border-color: var(--hairline); }

.btn-ghost, .btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--radius);
  padding: 7px 14px;
  font-size: 13px; font-weight: 500;
  border: 1px solid var(--hairline);
  background: var(--surface);
}
.btn-ghost:hover { border-color: var(--ink); }
.btn-primary {
  background: var(--brand); color: var(--brand-ink); border-color: var(--brand);
}
.btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary.is-danger { background: var(--neg); border-color: var(--neg); }
.btn-primary.is-danger:hover { background: color-mix(in oklab, var(--neg) 90%, black); }

.export-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px);
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 4px;
  min-width: 220px; box-shadow: 0 8px 30px rgba(14,14,12,0.08);
  z-index: 20;
}
.menu-item {
  display: block; width: 100%; text-align: left;
  border: 0; background: transparent;
  padding: 8px 10px; border-radius: 4px;
  font-size: 13px; color: var(--ink);
}
.menu-item:hover { background: var(--ink-wash); }

.link-btn {
  border: 0; background: transparent; padding: 0;
  font-size: inherit; color: var(--ink);
  text-decoration: underline; text-underline-offset: 3px;
  font-weight: 500;
}
.link-btn:hover { opacity: 0.7; }
.link-btn.danger-link { color: var(--neg); }

/* ---------------------------------------------------------- */
/* KPI                                                         */
/* ---------------------------------------------------------- */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--col-gap);
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  padding: 18px 20px 16px;
  box-shadow: var(--shadow);
}
.kpi-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.kpi-label {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500;
}
.kpi-value {
  font-size: 28px; font-weight: 600; letter-spacing: -0.025em;
  margin: 0 0 8px; color: var(--ink);
}
.kpi-suffix { font-size: 12px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; margin-left: 4px; font-family: "Hanken Grotesk", sans-serif; }

.delta { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
.delta-arrow { font-size: 11px; }
.delta-vs { color: var(--ink-3); }
.delta.pos { color: var(--pos); }
.delta.neg { color: var(--neg); }
.delta.pos .delta-vs, .delta.neg .delta-vs { color: var(--ink-3); }

.spark { color: var(--ink); opacity: 0.95; }

.inv-kpis .kpi-value { font-size: 24px; }

/* ---------------------------------------------------------- */
/* Cards                                                       */
/* ---------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 16px;
}
.card-eyebrow {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 3px;
}
.card-title { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
.card-meta { font-size: 12px; color: var(--ink-3); }
.card-meta strong { color: var(--ink); font-weight: 600; }

.empty {
  font-size: 13px; color: var(--ink-3); padding: 18px 0; text-align: center;
  border: 1px dashed var(--hairline); border-radius: var(--radius);
}
.empty-row { color: var(--ink-3); font-size: 13px; padding: 24px 0; text-align: center; }

/* ---------------------------------------------------------- */
/* Empty state                                                 */
/* ---------------------------------------------------------- */
.empty-state {
  margin-top: 40px;
  padding: 60px 24px;
  background: var(--surface);
  border: 1px dashed var(--hairline);
  border-radius: var(--radius-lg);
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-mark {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--hairline);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3); margin-bottom: 4px;
}
.empty-title { font-size: 18px; font-weight: 600; letter-spacing: -0.015em; }
.empty-body { font-size: 13px; color: var(--ink-3); max-width: 420px; }

/* ---------------------------------------------------------- */
/* Chart                                                       */
/* ---------------------------------------------------------- */
.chart-card { min-height: 360px; display: flex; flex-direction: column; }
.chart-meta { display: flex; align-items: center; gap: 18px; }
.legend { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.legend .swatch { width: 12px; height: 8px; display: inline-block; border-radius: 1px; }
.legend .swatch.in { background: var(--ink); }
.legend .swatch.out { background: var(--ink-soft); }
.legend .dot { color: var(--ink-4); margin: 0 2px; }
.mini-tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 2px; }
.mini-tab {
  border: 0; background: transparent; color: var(--ink-3);
  padding: 5px 10px; font-size: 12px; font-weight: 500;
  border-radius: calc(var(--radius) - 2px);
}
.mini-tab:hover { color: var(--ink); }
.mini-tab.is-active { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hairline); }

.chart-svg { width: 100%; height: 260px; display: block; flex: 1; }
.axis-label { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: var(--ink-3); }
.chart-empty-text { fill: var(--ink-3); font-size: 12px; }

.chart-foot {
  display: flex; gap: 28px; margin-top: 12px; padding-top: 14px;
  border-top: 1px dashed var(--hairline); flex-wrap: wrap;
}
.foot-item { display: flex; flex-direction: column; gap: 2px; }
.foot-label {
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
}
.foot-value { font-size: 15px; font-weight: 600; color: var(--ink); }
.foot-value.is-neg { color: var(--neg); }

/* ---------------------------------------------------------- */
/* Categories                                                  */
/* ---------------------------------------------------------- */
.cat-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.cat-row { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; }
.cat-row-top { grid-column: 1 / span 2; display: flex; justify-content: space-between; align-items: baseline; }
.cat-name { font-size: 13px; font-weight: 500; }
.cat-amount { font-size: 13px; color: var(--ink); }
.cat-bar { height: 4px; background: var(--ink-wash); border-radius: 2px; overflow: hidden; }
.cat-bar-fill { height: 100%; background: var(--ink); }
.cat-pct { font-size: 11px; color: var(--ink-3); font-family: "JetBrains Mono", monospace; text-align: right; }

/* ---------------------------------------------------------- */
/* Tables                                                      */
/* ---------------------------------------------------------- */
.table-wrap { overflow-x: auto; }
.movs, .contacts {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.movs thead th, .contacts thead th {
  text-align: left; padding: 8px 10px;
  font-weight: 500; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-3);
  border-bottom: 1px solid var(--hairline);
  white-space: nowrap;
}
.movs th.num, .contacts th.num { text-align: right; }
.movs tbody td, .contacts tbody td {
  padding: var(--cell-py) 10px;
  border-bottom: 1px solid var(--hairline-2);
  vertical-align: middle;
}
.movs tbody tr:last-child td, .contacts tbody tr:last-child td { border-bottom: 0; }
.movs tbody tr:hover { background: var(--ink-wash); }
.movs td.num { text-align: right; white-space: nowrap; }
.movs td.muted, .contacts td.muted { color: var(--ink-3); }
.movs td.concept { font-weight: 500; }
.muted { color: var(--ink-3); }
.small { font-size: 11px; }

.amount.pos { color: var(--pos); }
.amount.neg { color: var(--neg); }
.amount.venta { color: var(--venta); }

.pill {
  display: inline-flex; align-items: center;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid var(--hairline); border-radius: 999px;
  padding: 2px 8px; color: var(--ink-2); background: var(--surface-2);
  font-weight: 500;
}
.pill-ingreso { color: var(--pos); border-color: color-mix(in oklab, var(--pos) 30%, var(--hairline)); }
.pill-gasto   { color: var(--neg); border-color: color-mix(in oklab, var(--neg) 30%, var(--hairline)); }
.pill-venta   { color: var(--venta); border-color: color-mix(in oklab, var(--venta) 30%, var(--hairline)); }

.actions-col { width: 70px; text-align: right; }
.row-actions {
  display: inline-flex; gap: 4px; opacity: 0; transition: opacity 120ms ease;
}
.movs tbody tr:hover .row-actions,
.contacts tbody tr:hover .row-actions { opacity: 1; }
.row-btn {
  width: 26px; height: 26px; border-radius: 4px;
  border: 1px solid var(--hairline); background: var(--surface);
  color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center;
}
.row-btn:hover { color: var(--ink); border-color: var(--ink); }
.row-btn.danger:hover { color: var(--neg); border-color: var(--neg); }

/* Filters bar (movements) */
.filters-bar {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.filters-left, .filters-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search-field {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 6px 10px;
  color: var(--ink-3); min-width: 240px;
}
.search-field input { border: 0; outline: none; background: transparent; flex: 1; font-size: 13px; }
.date-range {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase;
}
.date-range input {
  border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: var(--radius); padding: 5px 8px;
  font-size: 12px; color: var(--ink); letter-spacing: 0;
}

.totals-strip {
  display: grid; grid-template-columns: repeat(5, minmax(0,1fr));
  gap: 1px;
  background: var(--hairline); border: 1px solid var(--hairline);
  border-radius: var(--radius);
  margin-bottom: 14px; overflow: hidden;
}
.totals-strip > div {
  background: var(--surface-2);
  padding: 10px 14px;
  display: flex; flex-direction: column; gap: 2px;
}
.ts-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.ts-value { font-size: 14px; font-weight: 600; color: var(--ink); }
.ts-value.is-neg { color: var(--neg); }

/* Inventory name + badges */
.inv-name { display: flex; align-items: center; gap: 8px; }
.badge {
  font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 3px; font-weight: 600;
}
.badge.warn { background: color-mix(in oklab, var(--neg) 12%, transparent); color: var(--neg); }
.badge.danger { background: var(--neg); color: var(--bg); }

/* Contacts */
.contact-name { display: flex; align-items: center; gap: 10px; }
.avatar-sm {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--hairline);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--ink-2);
}

/* ---------------------------------------------------------- */
/* Reports — trend grid + rank lists                           */
/* ---------------------------------------------------------- */
.trend-grid {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 8px; align-items: end;
  margin-top: 12px;
}
.trend-col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.trend-bars {
  width: 100%; height: 140px;
  display: flex; gap: 2px;
  align-items: flex-end; justify-content: center;
  border-bottom: 1px solid var(--hairline);
  padding-bottom: 1px;
}
.trend-bar { width: 12px; min-height: 1px; transition: height 220ms ease; }
.trend-bar.in  { background: var(--ink); }
.trend-bar.out { background: var(--ink-soft); }
.trend-net { font-size: 11px; color: var(--ink); }
.trend-net.neg { color: var(--neg); }
.trend-label {
  font-size: 10px; color: var(--ink-3);
  text-align: center; max-width: 80px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;
}

.rank-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.rank-row {
  display: grid; grid-template-columns: 30px 1fr auto auto; gap: 12px;
  align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--hairline-2);
}
.rank-row:last-child { border-bottom: 0; }
.rank-num { color: var(--ink-3); font-size: 11px; letter-spacing: 0.06em; }
.rank-name { font-size: 13px; font-weight: 500; }
.rank-meta { font-size: 11px; color: var(--ink-3); }
.rank-amount { font-size: 13px; font-weight: 600; }

/* ---------------------------------------------------------- */
/* Drawer                                                      */
/* ---------------------------------------------------------- */
.drawer-scrim {
  position: fixed; inset: 0; background: rgba(14,14,12,0.18);
  opacity: 0; pointer-events: none; transition: opacity 200ms ease;
  z-index: 40;
}
.drawer-scrim.is-open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: 440px; max-width: 90vw;
  background: var(--surface); border-left: 1px solid var(--hairline);
  transform: translateX(100%); transition: transform 280ms cubic-bezier(.2,.7,.2,1);
  z-index: 41;
  display: flex; flex-direction: column;
}
.drawer.is-open { transform: translateX(0); box-shadow: -20px 0 40px rgba(14,14,12,0.08); }
.drawer-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 24px 18px; border-bottom: 1px solid var(--hairline);
}
.drawer-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.drawer-title { font-size: 18px; font-weight: 600; letter-spacing: -0.015em; }
.icon-btn.close { font-size: 20px; width: 32px; height: 32px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
.drawer-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 16px 24px; border-top: 1px solid var(--hairline); background: var(--surface-2);
}

.type-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.type-tab {
  border: 1px solid var(--hairline); background: var(--surface);
  border-radius: var(--radius); padding: 10px 8px;
  font-size: 13px; font-weight: 500; color: var(--ink-2);
}
.type-tab:hover { color: var(--ink); }
.type-tab.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.type-tab.tab-ingreso.is-active { background: var(--pos); border-color: var(--pos); }
.type-tab.tab-gasto.is-active   { background: var(--neg); border-color: var(--neg); }
.type-tab.tab-venta.is-active   { background: var(--venta); border-color: var(--venta); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field label {
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="date"],
.field input[type="email"],
.field input:not([type]),
.field select,
.field textarea {
  border: 1px solid var(--hairline);
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 14px; color: var(--ink);
  outline: none;
  width: 100%;
}
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ink); background: var(--surface); }
.field-error { font-size: 12px; color: var(--neg); }

.callout {
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  border-left: 2px solid var(--ink);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 12px; color: var(--ink-2);
}
.callout strong { color: var(--ink); }

.amount-input {
  display: flex; align-items: center;
  border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: var(--radius);
  padding: 4px 12px;
}
.amount-input:focus-within { border-color: var(--ink); background: var(--surface); }
.amount-input input {
  border: 0 !important; background: transparent !important;
  padding: 10px 6px !important;
  font-family: "JetBrains Mono", monospace;
  font-size: 22px; font-weight: 600; flex: 1; min-width: 0;
}
.amount-symbol { font-family: "JetBrains Mono", monospace; font-size: 18px; color: var(--ink-3); }
.amount-iso { font-size: 11px; letter-spacing: 0.12em; color: var(--ink-3); text-transform: uppercase; }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--hairline); background: var(--surface);
  border-radius: 999px; padding: 5px 12px;
  font-size: 12px; font-weight: 500; color: var(--ink-2);
}
.chip:hover { color: var(--ink); }
.chip.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------------------------------------------------------- */
/* Export drawer                                               */
/* ---------------------------------------------------------- */
.format-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.format-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  border: 1px solid var(--hairline); background: var(--surface);
  border-radius: var(--radius); padding: 10px 12px;
  color: var(--ink-2); text-align: left;
}
.format-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
.format-btn.is-active {
  background: var(--surface);
  border-color: var(--ink);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ink);
}
.format-ext {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--ink); background: var(--surface-2);
  padding: 2px 6px; border-radius: 3px;
  border: 1px solid var(--hairline);
  margin-bottom: 4px;
}
.format-btn.is-active .format-ext { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.format-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.format-desc { font-size: 11px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }

.preset-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
}
.preset-btn {
  border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: var(--radius); padding: 8px 10px;
  font-size: 12px; font-weight: 500; color: var(--ink-2);
  text-align: center;
}
.preset-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
.preset-btn.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.export-summary {
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.export-summary-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
}
.summary-count {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: var(--ink); font-weight: 600;
}
.export-summary-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.export-summary-grid > div { display: flex; flex-direction: column; gap: 2px; }

/* ---------------------------------------------------------- */
/* Confirm dialog                                              */
/* ---------------------------------------------------------- */
.dialog {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  padding: 22px 22px 16px;
  width: 420px; max-width: 92vw;
  z-index: 50;
  box-shadow: 0 30px 80px rgba(14,14,12,0.2);
}
.dialog-title { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 6px; }
.dialog-body { font-size: 13px; color: var(--ink-2); margin-bottom: 20px; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 10px; }

/* ---------------------------------------------------------- */
/* Toast & footer                                              */
/* ---------------------------------------------------------- */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: var(--radius);
  font-size: 13px; font-weight: 500;
  box-shadow: 0 12px 30px rgba(14,14,12,0.2);
  z-index: 50;
  animation: toast-in 200ms ease;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

.page-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 40px; padding-top: 20px;
  border-top: 1px solid var(--hairline);
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
}
.page-foot .link-btn { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------------------------------------------------------- */
/* Responsive                                                  */
/* ---------------------------------------------------------- */
@media (max-width: 1200px) {
  .trend-grid { grid-template-columns: repeat(6, 1fr); }
}
@media (max-width: 1100px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .row-chart, .row-detail { grid-template-columns: 1fr; }
  .totals-strip { grid-template-columns: repeat(3, 1fr); }
  /* La navegación pasa a una fila propia y se desliza en horizontal */
  .header-inner { grid-template-columns: 1fr auto; row-gap: 10px; }
  .nav {
    grid-column: 1 / -1; grid-row: 2;
    overflow-x: auto; scrollbar-width: none;
    margin: 0 -4px; padding: 2px 4px 4px;
    scroll-snap-type: x proximity;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-link { white-space: nowrap; scroll-snap-align: start; }
}
@media (max-width: 720px) {
  .main { padding: 20px 16px 60px; }
  .header-inner { padding: 12px 16px; gap: 12px; }
  .header-export .btn-text, .header-add .btn-text { display: none; }
  .header-export, .header-add { padding: 8px 11px; }
  .header-add span[aria-hidden] { font-size: 16px; line-height: 1; }
  .header-count { display: none; }
  .kpi-row { grid-template-columns: 1fr; }
  .action-bar-right { width: 100%; }
  .filters-left, .filters-right { width: 100%; }
  .search-field { width: 100%; }
  .totals-strip { grid-template-columns: repeat(2, 1fr); }
  .trend-grid { grid-template-columns: repeat(4, 1fr); }
  .actions-col { width: auto; }
  .row-actions { opacity: 1; }
  .export-summary-grid { grid-template-columns: repeat(2, 1fr); }
  .preset-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ========================================================== */
/* CRM                                                         */
/* ========================================================== */

/* form extras */
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check-row input { width: 16px; height: 16px; accent-color: var(--ink); }
.field-hint { font-size: 11px; color: var(--ink-3); }
.inline-link { font-size: 11px; margin-left: 8px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.callout-warn { border-left-color: var(--neg); }
.btn-ghost.attn { border-color: var(--neg); color: var(--neg); }

.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }
.btn-wa { background: #1FA855; border-color: #1FA855; color: #fff; }
.btn-wa:hover { background: #178a45; border-color: #178a45; }
.btn-wa:disabled { opacity: 0.4; }

/* Dashboard */
.crm-dash {
  display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: var(--col-gap);
  margin-bottom: var(--row-gap);
}
.crm-kpi {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 16px 18px;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: var(--shadow);
}
.crm-kpi .kpi-value { font-size: 24px; margin: 0; }
.crm-kpi .kpi-value.pos { color: var(--pos); }
.crm-kpi .kpi-value.neg { color: var(--neg); }

/* Alerts */
.crm-alerts {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: color-mix(in oklab, var(--neg) 7%, var(--surface));
  border: 1px solid color-mix(in oklab, var(--neg) 25%, var(--hairline));
  border-radius: var(--radius-lg); padding: 12px 16px; margin-bottom: var(--row-gap);
}
.alert-icon { color: var(--neg); font-size: 15px; }
.alert-label { font-size: 12px; font-weight: 600; color: var(--ink); letter-spacing: 0.04em; text-transform: uppercase; }
.alert-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.alert-chip {
  border: 1px solid var(--hairline); background: var(--surface);
  border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ink-2);
}
.alert-chip:hover { border-color: var(--ink); color: var(--ink); }
.alert-chip.overdue { border-color: var(--neg); color: var(--neg); }
.alert-chip.soon { border-color: color-mix(in oklab, var(--neg) 40%, var(--hairline)); }

/* Layout master-detail */
.crm-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: var(--col-gap); align-items: start; }

.crm-clients {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 12px; box-shadow: var(--shadow);
  position: sticky; top: 78px;
}
.crm-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 7px 10px; color: var(--ink-3); margin-bottom: 8px;
}
.crm-search input { border: 0; outline: none; background: transparent; flex: 1; font-size: 13px; }
.crm-client-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; max-height: 70vh; overflow-y: auto; }
.crm-client-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; background: transparent; padding: 9px 10px; border-radius: var(--radius);
}
.crm-client-item:hover { background: var(--ink-wash); }
.crm-client-item.is-active { background: var(--ink); }
.crm-client-item.is-active .cci-name { color: var(--bg); }
.crm-client-item.is-active .cci-sub { color: color-mix(in oklab, var(--bg) 70%, transparent); }
.crm-client-item.is-active .avatar-sm { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.cci-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cci-name { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cci-sub { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Detail */
.crm-detail { min-width: 0; }
.crm-client-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 18px 20px; box-shadow: var(--shadow);
  margin-bottom: var(--row-gap);
}
.cch-left { display: flex; gap: 14px; align-items: flex-start; }
.avatar-lg {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  background: var(--brand); color: var(--brand-ink);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
}
.cch-name { font-size: 19px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 4px; }
.cch-contacts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.cch-addr { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.cch-actions { display: flex; gap: 4px; }

.crm-projects-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.proj-count { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }

.proj-list { display: flex; flex-direction: column; gap: var(--row-gap); }
.proj-card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow);
}
.proj-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.proj-title-wrap { display: flex; flex-direction: column; gap: 6px; }
.proj-name { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
.proj-head-actions { display: flex; gap: 4px; }

.state-badge {
  display: inline-flex; align-self: flex-start; align-items: center;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  border: 1px solid; 
}
.state-pendiente  { color: var(--ink-2); border-color: var(--hairline); background: var(--surface-2); }
.state-proceso    { color: var(--venta); border-color: color-mix(in oklab, var(--venta) 35%, var(--hairline)); background: color-mix(in oklab, var(--venta) 8%, transparent); }
.state-finalizado { color: #8A6D1F; border-color: color-mix(in oklab, #B8902B 40%, var(--hairline)); background: color-mix(in oklab, #B8902B 10%, transparent); }
.state-entregado  { color: var(--pos); border-color: color-mix(in oklab, var(--pos) 35%, var(--hairline)); background: color-mix(in oklab, var(--pos) 8%, transparent); }

.proj-desc { font-size: 13px; color: var(--ink-2); margin: 14px 0 0; line-height: 1.55; }

.proj-meta-row { display: flex; gap: 28px; margin-top: 16px; flex-wrap: wrap; }
.proj-meta { display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.meta-value { font-size: 13px; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
.days-pill {
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  padding: 1px 7px; border-radius: 999px; border: 1px solid var(--hairline); color: var(--ink-3);
}
.days-pill.soon { color: #8A6D1F; border-color: color-mix(in oklab, #B8902B 40%, var(--hairline)); }
.days-pill.overdue { color: var(--neg); border-color: var(--neg); }

.proj-finance {
  margin-top: 18px; padding: 14px; background: var(--surface-2);
  border: 1px solid var(--hairline); border-radius: var(--radius);
}
.finance-bars { margin-bottom: 12px; }
.finance-bar { height: 6px; background: var(--ink-wash); border-radius: 3px; overflow: hidden; }
.finance-bar-fill { height: 100%; background: var(--pos); transition: width 280ms ease; }
.finance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.finance-grid > div { display: flex; flex-direction: column; gap: 2px; }
.finance-grid .ts-value.pos { color: var(--pos); }
.finance-grid .ts-value.neg { color: var(--neg); }

.proj-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hairline-2); }
.proj-section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.proj-section-title { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin-bottom: 10px; }
.proj-section-head .proj-section-title { margin-bottom: 0; }

.state-switch { display: flex; gap: 6px; flex-wrap: wrap; }
.state-opt {
  border: 1px solid var(--hairline); background: var(--surface);
  border-radius: var(--radius); padding: 6px 12px; font-size: 12px; font-weight: 500; color: var(--ink-2);
}
.state-opt:hover { color: var(--ink); border-color: var(--ink-soft); }
.state-opt.is-active.state-pendiente  { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.state-opt.is-active.state-proceso    { background: var(--venta); color: #fff; border-color: var(--venta); }
.state-opt.is-active.state-finalizado { background: #B8902B; color: #fff; border-color: #B8902B; }
.state-opt.is-active.state-entregado  { background: var(--pos); color: #fff; border-color: var(--pos); }

.pay-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.pay-row {
  display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--hairline-2); font-size: 13px;
}
.pay-row:last-child { border-bottom: 0; }
.pay-date { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-3); }
.pay-method { color: var(--ink-2); }
.pay-amount { font-family: "JetBrains Mono", monospace; font-weight: 600; color: var(--pos); }

.obs-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.obs-preset {
  border: 1px dashed var(--hairline); background: transparent;
  border-radius: 999px; padding: 4px 10px; font-size: 11px; color: var(--ink-3);
}
.obs-preset:hover { color: var(--ink); border-color: var(--ink-soft); border-style: solid; }
.obs-composer { display: flex; gap: 8px; }
.obs-composer input {
  flex: 1; border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: var(--radius); padding: 8px 12px; font-size: 13px; outline: none;
}
.obs-composer input:focus { border-color: var(--ink); background: var(--surface); }
.obs-list { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; }
.obs-row {
  display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--hairline-2); font-size: 13px;
}
.obs-row:last-child { border-bottom: 0; }
.obs-row.is-done .obs-text { text-decoration: line-through; color: var(--ink-3); }
.obs-check {
  width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--hairline);
  background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--pos);
}
.obs-row.is-done .obs-check { background: var(--pos); color: #fff; border-color: var(--pos); }
.obs-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); }
.obs-text { color: var(--ink); }
.obs-date { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-3); }

.proj-send { margin-top: 18px; }

.mini-empty { font-size: 12px; color: var(--ink-3); padding: 10px 0; text-align: center; }
.mini-empty.pad {
  padding: 30px; border: 1px dashed var(--hairline); border-radius: var(--radius-lg); background: var(--surface);
}

/* WhatsApp drawer */
.wa-to { display: flex; align-items: center; gap: 12px; }
.wa-to-name { font-size: 15px; font-weight: 600; }
.wa-textarea {
  font-family: "Hanken Grotesk", sans-serif; font-size: 13px; line-height: 1.5;
  white-space: pre-wrap;
}

@media (max-width: 1100px) {
  .crm-dash { grid-template-columns: repeat(3, 1fr); }
  .crm-layout { grid-template-columns: 1fr; }
  .crm-clients { position: static; }
  .crm-client-list { max-height: 280px; }
}
@media (max-width: 720px) {
  .crm-dash { grid-template-columns: repeat(2, 1fr); }
  .finance-grid { grid-template-columns: 1fr; gap: 8px; }
  .proj-meta-row { gap: 16px; }
}

/* ========================================================== */
/* Deudas                                                      */
/* ========================================================== */
.type-tabs-2 { grid-template-columns: 1fr 1fr; }
.type-tab.tab-cobrar.is-active { background: var(--pos); border-color: var(--pos); }
.type-tab.tab-pagar.is-active  { background: var(--neg); border-color: var(--neg); }
.type-tab:disabled { opacity: 1; cursor: default; }
.type-tabs-2 .type-tab:disabled:not(.is-active) { opacity: 0.4; }

.amount-input.sm { padding: 2px 10px; }
.amount-input.sm input { font-size: 16px; padding: 8px 6px !important; }

/* Summary */
.deuda-summary {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--col-gap);
  margin-bottom: var(--row-gap);
}
.dsum {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 16px 18px;
  display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow);
}
.dsum .kpi-value { font-size: 24px; margin: 0; }
.dsum .kpi-value.pos { color: var(--pos); }
.dsum .kpi-value.neg { color: var(--neg); }
.dsum-cobrar { border-top: 2px solid var(--pos); }
.dsum-pagar  { border-top: 2px solid var(--neg); }
.dsum-note { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }

/* Semáforo */
.semaforo { display: inline-flex; align-items: center; gap: 8px; }
.semaforo-dot {
  width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 0 3px var(--dot-halo, transparent);
}
.sem-verde    { background: #2B9E5E; --dot-halo: color-mix(in oklab, #2B9E5E 18%, transparent); }
.sem-amarillo { background: #E0A526; --dot-halo: color-mix(in oklab, #E0A526 20%, transparent); }
.sem-rojo     { background: #C8453A; --dot-halo: color-mix(in oklab, #C8453A 18%, transparent); }
.sem-pagado   { background: var(--ink-4); }
.semaforo-label { font-size: 13px; font-weight: 500; color: var(--ink); }

/* Debt status pill */
.debt-pill {
  display: inline-flex; align-items: center;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
  padding: 3px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap;
}
.debt-aldia     { color: var(--pos); border-color: color-mix(in oklab, var(--pos) 35%, var(--hairline)); background: color-mix(in oklab, var(--pos) 8%, transparent); }
.debt-porvencer { color: #8A6D1F; border-color: color-mix(in oklab, #E0A526 45%, var(--hairline)); background: color-mix(in oklab, #E0A526 12%, transparent); }
.debt-vencido   { color: var(--neg); border-color: var(--neg); background: color-mix(in oklab, var(--neg) 8%, transparent); }
.debt-pagado    { color: var(--ink-3); border-color: var(--hairline); background: var(--surface-2); }

/* Table */
.deudas-table .sem-col { width: 28px; text-align: center; padding-left: 12px; padding-right: 0; }
.deuda-row { cursor: pointer; }
.deuda-party { display: flex; flex-direction: column; gap: 1px; }
.deuda-party > span:first-child { font-weight: 600; }
.vence-cell { display: inline-flex; align-items: center; gap: 6px; }

.dir-total { font-size: 12px; color: var(--ink-3); }
.dir-total strong { color: var(--ink); font-family: "JetBrains Mono", monospace; font-weight: 600; }

/* Detail drawer */
.detail-status { display: flex; align-items: center; gap: 12px; }
.detail-concepto { font-size: 14px; color: var(--ink); font-weight: 500; }
.detail-meta { display: flex; gap: 28px; flex-wrap: wrap; }
.finance-bar-fill.is-pagar { background: var(--neg); }
.drawer-foot-split { justify-content: space-between; }
.btn-ghost.danger-ghost { color: var(--neg); border-color: color-mix(in oklab, var(--neg) 30%, var(--hairline)); }
.btn-ghost.danger-ghost:hover { border-color: var(--neg); }

.abono-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
.abono-date {
  border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: var(--radius); padding: 0 12px; font-size: 13px; color: var(--ink); outline: none;
}
.abono-date:focus { border-color: var(--ink); background: var(--surface); }
.abono-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

/* Reporte por cliente */
.cch-actions { display: flex; align-items: center; gap: 8px; }
.cch-report { white-space: nowrap; }
.drawer-wide { width: min(560px, 96vw); max-width: 96vw; }
.report-summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px;
}
.rs-cell {
  border: 1px solid var(--hairline); border-radius: var(--radius); padding: 10px 12px;
  display: flex; flex-direction: column; gap: 4px; background: var(--surface-2);
}
.rs-cell span { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.rs-cell strong { font-size: 16px; font-family: "JetBrains Mono", monospace; }
.rs-cell strong.pos { color: var(--pos); }
.rs-cell strong.neg { color: var(--neg); }
.report-pdf-btn { margin-bottom: 16px; }

@media (max-width: 1100px) {
  .deuda-summary { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .deuda-summary { grid-template-columns: 1fr 1fr; }
  .detail-meta { gap: 16px; }
}

/* ========================================================== */
/* v2 · Refinamiento visual                                    */
/* ========================================================== */

:root {
  --warn:       #B0791C;
  --warn-tint:  color-mix(in oklab, #E0A526 13%, transparent);
  --info:       #2A4A6E;
  --focus:      color-mix(in oklab, var(--brand) 55%, transparent);
  --lift:       0 1px 2px rgba(14,14,12,0.05), 0 6px 20px -12px rgba(14,14,12,0.22);
}
html[data-theme="oscuro"] {
  --warn:      #E0B45C;
  --warn-tint: color-mix(in oklab, #E0A526 16%, transparent);
  --info:      #8FB3E5;
  --lift:      0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -14px rgba(0,0,0,0.8);
}

/* Foco visible y consistente en todo el sistema */
:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--radius);
}
:where(button, a):focus:not(:focus-visible) { outline: none; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* Superficies con más aire y una elevación honesta al pasar el cursor */
.card { transition: box-shadow 160ms ease, border-color 160ms ease; }
.card:hover { border-color: color-mix(in oklab, var(--hairline) 60%, var(--ink-4)); }

.kpi { position: relative; transition: box-shadow 160ms ease; }
.kpi::before {
  content: ''; position: absolute; inset: -1px -1px auto -1px; height: 2px;
  background: var(--ink-soft); border-radius: var(--radius) var(--radius) 0 0;
  opacity: 0.6;
}
.kpi:nth-child(1)::before { background: var(--pos); }
.kpi:nth-child(2)::before { background: var(--neg); }
.kpi:nth-child(3)::before { background: var(--venta); }
.kpi:nth-child(4)::before { background: var(--brand); }
.kpi:hover { box-shadow: var(--lift); }
.kpi-value { font-size: 26px; letter-spacing: -0.03em; }

/* Botones: respuesta táctil clara */
.btn-primary, .btn-ghost, .chip, .segmented-btn, .mini-tab, .nav-link { transition: background 120ms ease, color 120ms ease, border-color 120ms ease; }
.btn-primary:active, .btn-ghost:active { transform: translateY(0.5px); }
.btn-primary:disabled, .btn-ghost:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-text { display: inline; }

/* Título de página: el número de la sección manda */
.page-title { letter-spacing: -0.035em; }
.page-eyebrow { color: var(--ink-3); }

/* Filas de tabla más legibles al recorrerlas */
.movs tbody tr, .contacts tbody tr { transition: background 100ms ease; }
.movs tbody td { vertical-align: middle; }

/* Pie de tabla con total y export */
.table-foot {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0 2px; margin-top: 4px;
  border-top: 1px solid var(--hairline-2);
  font-size: 12px; color: var(--ink-3);
}

/* Estado vacío con más presencia */
.empty-state { border-radius: var(--radius-lg); }
.empty-title { letter-spacing: -0.02em; }

.row-actions.is-static { opacity: 1; }
.mini-select {
  border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink);
  border-radius: var(--radius); padding: 7px 10px; font-size: 12px; outline: none;
}
.mini-select:focus { border-color: var(--ink); background: var(--surface); }

.sem-gris { background: var(--ink-4); }
.sem-azul { background: #3B6FA8; --dot-halo: color-mix(in oklab, #3B6FA8 18%, transparent); }

.kpi-value.warn { color: var(--warn); }
.ts-value.pos { color: var(--pos); }
.ts-value.neg { color: var(--neg); }

/* ========================================================== */
/* Pedidos · delivery, local y cuadre                          */
/* ========================================================== */

/* --- Tira de métricas operativas --- */
.ped-metrics {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: var(--col-gap); margin-top: var(--row-gap);
}
.ped-metrics.local-metrics { grid-template-columns: repeat(4, 1fr); }
.pmet {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 3px;
  box-shadow: var(--shadow);
}
.pmet .kpi-value {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 24px; font-weight: 600; letter-spacing: -0.03em;
}
.pmet .kpi-value.pos { color: var(--pos); }
.pmet-note { font-size: 11px; color: var(--ink-3); }

/* --- Píldoras de estado del pedido --- */
.ped-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 600;
  padding: 3px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap;
}
.ped-pill.is-sm { font-size: 9.5px; padding: 2px 8px; }
.ped-nuevo      { color: var(--ink-2); border-color: var(--hairline); background: var(--surface-2); }
.ped-confirmado { color: var(--info); border-color: color-mix(in oklab, var(--info) 35%, var(--hairline)); background: color-mix(in oklab, var(--info) 8%, transparent); }
.ped-ruta       { color: var(--warn); border-color: color-mix(in oklab, #E0A526 45%, var(--hairline)); background: var(--warn-tint); }
.ped-entregado  { color: var(--pos); border-color: color-mix(in oklab, var(--pos) 38%, var(--hairline)); background: color-mix(in oklab, var(--pos) 9%, transparent); }
.ped-reagendado { color: var(--warn); border-color: color-mix(in oklab, #E0A526 40%, var(--hairline)); background: transparent; }
.ped-devuelto   { color: var(--neg); border-color: var(--neg); background: color-mix(in oklab, var(--neg) 8%, transparent); }
.ped-cancelado  { color: var(--ink-3); border-color: var(--hairline); background: transparent; text-decoration: line-through; }
.ped-liquidado  { color: var(--brand); border-color: var(--brand-line); background: var(--brand-wash); }

.tag-warn {
  font-size: 11px; color: var(--warn); font-weight: 500;
  border-bottom: 1px dashed color-mix(in oklab, var(--warn) 50%, transparent);
}

/* --- Tabla de pedidos --- */
.pedidos-table .sem-col { width: 26px; text-align: center; padding-left: 12px; padding-right: 0; }
.ped-row { cursor: pointer; }
.ped-cliente { display: flex; flex-direction: column; gap: 1px; }
.ped-cliente > span:first-child { font-weight: 600; }
.ped-dir { display: flex; flex-direction: column; gap: 1px; max-width: 260px; }
.ped-dir strong { color: var(--ink-2); font-weight: 600; font-size: 11px; letter-spacing: 0.02em; }
.ped-dir span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.estado-filters { margin: 0 0 14px; }

/* --- Vista por ruta --- */
.rutas { display: flex; flex-direction: column; gap: 18px; }
.ruta-group { border: 1px solid var(--hairline); border-radius: var(--radius-lg); overflow: hidden; }
.ruta-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--surface-2);
  border-bottom: 1px solid var(--hairline);
}
.ruta-title { display: flex; flex-direction: column; gap: 2px; }
.ruta-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.ruta-meta { font-size: 11px; color: var(--ink-3); }
.ruta-list { list-style: none; margin: 0; padding: 0; counter-reset: parada; }
.ruta-item {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: start;
  padding: 12px 16px; border-bottom: 1px solid var(--hairline-2); cursor: pointer;
}
.ruta-item:last-child { border-bottom: 0; }
.ruta-item:hover { background: var(--surface-2); }
.ri-num {
  font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600;
  color: var(--ink-3); width: 22px; height: 22px; display: grid; place-items: center;
  border: 1px solid var(--hairline); border-radius: 50%;
}
.ri-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ri-top { display: flex; align-items: center; gap: 8px; }
.ri-cliente { font-weight: 600; font-size: 13.5px; }
.ri-dir { font-size: 12px; color: var(--ink-2); }
.ri-items { font-size: 11.5px; color: var(--ink-3); }
.ri-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.ri-total { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 600; }
.ri-pago { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* --- Cuadre de repartidores --- */
.cuadre-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--col-gap); margin-top: var(--row-gap);
}
.cuadre-card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg); padding: 16px 18px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: var(--shadow);
}
.cc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.cc-name { font-size: 15px; font-weight: 600; letter-spacing: -0.015em; }
.cc-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.cc-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 12px 0; border-top: 1px solid var(--hairline-2); border-bottom: 1px solid var(--hairline-2);
}
.cc-stats > div { display: flex; flex-direction: column; gap: 3px; }
.cc-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.cc-arecibir { display: flex; flex-direction: column; gap: 2px; }
.cc-amount { font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.cc-amount.pos { color: var(--pos); }
.cc-amount.muted { color: var(--ink-3); }

.cuadre-summary {
  display: grid; gap: 10px;
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  padding: 14px 16px; background: var(--surface-2);
}
.cuadre-summary > div { display: flex; justify-content: space-between; align-items: baseline; }
.cs-total { border-top: 1px solid var(--hairline); padding-top: 10px; }
.cs-total .ts-value { font-size: 20px; font-weight: 600; }

/* --- Editor de productos del pedido --- */
.items-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; }
.items-add select {
  border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink);
  border-radius: var(--radius); padding: 9px 11px; font-size: 13px; outline: none;
}
.items-add select:focus { border-color: var(--ink); background: var(--surface); }

.item-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.item-head, .item-row {
  display: grid; grid-template-columns: 1fr 58px 78px 74px 28px;
  gap: 6px; align-items: center;
}
.item-head {
  font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
  padding-bottom: 6px; border-bottom: 1px solid var(--hairline);
}
.item-head .ir-c { text-align: right; }
.item-row { padding: 6px 0; border-bottom: 1px solid var(--hairline-2); }
.item-row input {
  border: 1px solid transparent; background: transparent; color: var(--ink);
  border-radius: var(--radius); padding: 6px 8px; font-size: 13px; outline: none; width: 100%;
}
.item-row input:hover { border-color: var(--hairline); }
.item-row input:focus { border-color: var(--ink); background: var(--surface); }
.item-row .ir-qty, .item-row .ir-price { text-align: right; font-family: "JetBrains Mono", monospace; font-size: 12px; }
.ir-total { text-align: right; font-family: "JetBrains Mono", monospace; font-size: 12.5px; font-weight: 600; }
.items-subtotal {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-top: 10px; font-size: 12px; color: var(--ink-3);
}
.items-subtotal strong { font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--ink); }

/* --- Selector de zona --- */
.zona-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.zona-chip {
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: var(--radius); padding: 8px 10px; text-align: left;
}
.zona-chip:hover { border-color: var(--ink-4); }
.zona-chip.is-active { border-color: var(--brand); background: var(--brand-wash); }
.zc-name { font-size: 12px; font-weight: 500; }
.zc-flete { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-3); }
.zona-chip.is-active .zc-flete { color: var(--brand); }

/* --- Caja de totales --- */
.ped-total-box {
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  background: var(--surface-2); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 7px; margin-top: 4px;
}
.ped-total-box > div { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; }
.ped-total-box span { color: var(--ink-3); }
.ped-total-box strong { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500; }
.ped-total-box strong.neg { color: var(--neg); }
.ptb-total { border-top: 1px solid var(--hairline); padding-top: 8px; margin-top: 1px; }
.ptb-total span { color: var(--ink); font-weight: 500; }
.ptb-total strong { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }

/* --- Detalle del pedido --- */
.detail-items { list-style: none; margin: 0 0 12px; padding: 0; }
.detail-items li {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: baseline;
  padding: 7px 0; border-bottom: 1px solid var(--hairline-2);
}
.detail-items li:last-child { border-bottom: 0; }
.di-qty { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-3); }
.di-name { font-size: 13px; }
.di-amount { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500; }

.direccion-box {
  border: 1px solid var(--hairline); border-left: 3px solid var(--brand);
  border-radius: var(--radius); padding: 12px 14px; background: var(--surface-2);
  margin-top: 10px;
}
.db-text { font-size: 13.5px; font-weight: 500; }
.db-ref { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.db-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.db-actions .btn-ghost { text-decoration: none; }

/* --- Avance de estado --- */
.estado-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.estado-step {
  border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: var(--radius); padding: 9px 6px;
  font-size: 11.5px; font-weight: 500; color: var(--ink-2);
}
.estado-step:hover { border-color: var(--ink-4); color: var(--ink); }
.estado-step.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.estado-step.is-active.st-entregado { background: var(--pos); border-color: var(--pos); color: #fff; }
.estado-step.is-active.st-ruta { background: var(--warn); border-color: var(--warn); color: #fff; }

/* --- Pestañas del drawer --- */
.type-tab.tab-delivery.is-active { background: var(--info); color: #fff; border-color: var(--info); }
.type-tab.tab-local.is-active { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

/* --- Responsive --- */
@media (max-width: 1200px) {
  .ped-metrics { grid-template-columns: repeat(3, 1fr); }
  .ped-metrics.local-metrics { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .ped-metrics, .ped-metrics.local-metrics { grid-template-columns: repeat(2, 1fr); }
  .pmet .kpi-value { font-size: 20px; }
  .zona-grid { grid-template-columns: repeat(2, 1fr); }
  .item-head { display: none; }
  .item-row { grid-template-columns: 1fr 50px 68px 28px; row-gap: 2px; }
  .ir-total { display: none; }
  .estado-track { grid-template-columns: repeat(2, 1fr); }
  .cc-stats { grid-template-columns: repeat(2, 1fr); row-gap: 12px; }
  .ruta-head { flex-direction: column; align-items: flex-start; }
  .ped-dir { max-width: 160px; }
  .cuadre-grid { grid-template-columns: 1fr; }
  .filters-bar { flex-direction: column; align-items: stretch; gap: 10px; }
  .filters-right { flex-wrap: wrap; }
}

  <div id="root"></div>
  <noscript>Life Manager necesita JavaScript activado.</noscript>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {

// ============================================================

const STORAGE_KEY = 'lifemanager.v1';
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAY = 86400000;

const CATEGORIES = {

function emptyState() {
