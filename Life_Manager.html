          <div>
            <div className="drawer-eyebrow">Reporte completo</div>
            <div className="drawer-title">{[client.nombre, client.apellido].filter(Boolean).join(' ') || 'Cliente'}</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>
        <div className="drawer-body">
          {(projects || []).length === 0 ? (
            <div className="callout callout-warn">Este cliente aún no tiene proyectos para reportar.</div>
          ) : (
            <>
              <div className="report-summary">
                <div className="rs-cell"><span>Proyectos</span><strong>{t.count}</strong></div>
                <div className="rs-cell"><span>Total</span><strong>{money(t.total)}</strong></div>
                <div className="rs-cell"><span>Abonado</span><strong className="pos">{money(t.abonado)}</strong></div>
                <div className="rs-cell"><span>Saldo</span><strong className="neg">{money(t.pendiente)}</strong></div>
              </div>

              <button className="btn-primary btn-block report-pdf-btn" onClick={pdf}>
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5l3 3V14a.5.5 0 0 1-.5.5h-7A.5.5 0 0 1 4 14V2a.5.5 0 0 1 .5-.5z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round"/><path d="M9 1.5V4.5H12M6 8.5h4M6 11h4" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round"/></svg>
                Descargar / Imprimir PDF
              </button>

              {!hasWa && <div className="callout callout-warn">Registra el WhatsApp del cliente (con código de país) para poder enviarlo por chat.</div>}

              <div className="field">
                <label>Mensaje para WhatsApp (editable)</label>
                <textarea className="wa-textarea" rows="16" value={msg} onChange={(e) => setMsg(e.target.value)} />
              </div>
            </>
          )}
        </div>
        <footer className="drawer-foot">
          <button className="btn-ghost" onClick={copy} disabled={(projects || []).length === 0}>Copiar texto</button>
          <button className="btn-primary btn-wa" onClick={send} disabled={!hasWa || (projects || []).length === 0}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.01c-.24.68-1.42 1.31-1.96 1.36-.5.05-.96.23-3.23-.67-2.73-1.08-4.45-3.86-4.58-4.04-.13-.18-1.1-1.46-1.1-2.79s.7-1.98.94-2.25c.24-.27.53-.34.71-.34.18 0 .35 0 .51.01.16.01.39-.06.6.46.24.56.78 1.91.85 2.05.07.14.12.3.02.48-.09.18-.14.29-.28.45-.14.16-.29.36-.42.48-.14.14-.28.28-.12.55.16.27.71 1.17 1.53 1.9 1.05.93 1.94 1.22 2.21 1.36.27.14.43.12.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.23.6-.14.24.09 1.55.73 1.81.86.27.13.45.2.51.31.07.11.07.63-.17 1.31z"/></svg>
            Enviar por WhatsApp
          </button>
        </footer>
      </aside>
    </>
  );
}

// ============================================================
// Project card (detail)
// ============================================================
function ProjectCard({ project, client, bank, onEdit, onDelete, onAddPayment, onDeletePayment, onChangeState, onAddObservation, onToggleObservation, onDeleteObservation, onSendWhatsapp }) {
  const [obsText, setObsText] = useCrmState('');
  const paid = projectPaid(project);
  const pending = projectPending(project);
  const total = +project.precioTotal || 0;
  const pct = total > 0 ? Math.min(100, (paid / total) * 100) : 0;
  const state = projectStateMeta(project.estado);
  const dleft = project.plazoIndefinido ? null : daysUntil(project.fechaLimite);

  const pagos = [...(project.pagos || [])].sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  const obs = [...(project.observaciones || [])].sort((a, b) => (a.fecha < b.fecha ? 1 : -1));

  function addObs(text) {
    const t = (text != null ? text : obsText).trim();
    if (!t) return;
    onAddObservation(project.id, t);
    setObsText('');
  }

  return (
    <div className="proj-card">
      <div className="proj-card-head">
        <div className="proj-title-wrap">
          <span className={classNames('state-badge', 'state-' + state.cls)}>{state.label}</span>
          <h3 className="proj-name">{project.nombre}</h3>
        </div>
        <div className="proj-head-actions">
          <button className="row-btn" onClick={() => onEdit(project)} title="Editar proyecto"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4.5 11.5 2 12l.5-2.5L9.5 2.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg></button>
          <button className="row-btn danger" onClick={() => onDelete(project)} title="Eliminar proyecto"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
        </div>
      </div>

      {project.descripcion && <p className="proj-desc">{project.descripcion}</p>}

      <div className="proj-meta-row">
        <div className="proj-meta">
          <span className="meta-label">Inicio</span>
          <span className="meta-value">{project.fechaInicio ? formatDateFull(project.fechaInicio) : '—'}</span>
        </div>
        <div className="proj-meta">
          <span className="meta-label">Entrega</span>
          <span className="meta-value">
            {project.plazoIndefinido ? 'Plazo indefinido' : (project.fechaLimite ? formatDateFull(project.fechaLimite) : '—')}
            {dleft != null && (
              <span className={classNames('days-pill', dleft < 0 ? 'overdue' : dleft <= 3 ? 'soon' : '')}>
                {dleft < 0 ? `${Math.abs(dleft)}d vencido` : dleft === 0 ? 'hoy' : `${dleft}d`}
              </span>
            )}
          </span>
        </div>
      </div>

      {/* Financial */}
      <div className="proj-finance">
        <div className="finance-bars">
          <div className="finance-bar"><div className="finance-bar-fill" style={{ width: pct + '%' }} /></div>
        </div>
        <div className="finance-grid">
          <div><span className="ts-label">Total</span><span className="ts-value">{money(total)}</span></div>
          <div><span className="ts-label">Abonado</span><span className="ts-value pos">{money(paid)}</span></div>
          <div><span className="ts-label">Pendiente</span><span className={classNames('ts-value', pending > 0 && 'neg')}>{money(pending)}</span></div>
        </div>
      </div>

      {/* State changer */}
      <div className="proj-section">
        <div className="proj-section-title">Cambiar estado</div>
        <div className="state-switch">
          {PROJECT_STATES.map((s) => (
            <button key={s.id} className={classNames('state-opt', project.estado === s.id && 'is-active', 'state-' + s.cls)} onClick={() => onChangeState(project.id, s.id)}>{s.label}</button>
          ))}
        </div>
      </div>

      {/* Payments */}
      <div className="proj-section">
        <div className="proj-section-head">
          <div className="proj-section-title">Historial de pagos</div>
          <button className="btn-tiny" onClick={() => onAddPayment(project)}>+ Abono</button>
        </div>
        {pagos.length === 0 ? (
          <div className="mini-empty">Sin abonos registrados.</div>
        ) : (
          <ul className="pay-list">
            {pagos.map((p) => (
              <li key={p.id} className="pay-row">
                <span className="pay-date">{formatDateFull(p.fecha)}</span>
                <span className="pay-method">{paymentMethodLabel(p.metodo)}{p.nota ? ` · ${p.nota}` : ''}</span>
                <span className="pay-amount">{money(p.monto)}</span>
                <button className="row-btn danger" onClick={() => onDeletePayment(project.id, p.id)} title="Eliminar abono"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
              </li>
            ))}
          </ul>
        )}
      </div>

      {/* Observations / internal comms */}
      <div className="proj-section">
        <div className="proj-section-title">Observaciones internas</div>
        <div className="obs-presets">
          {OBSERVATION_PRESETS.map((p) => (
            <button key={p} className="obs-preset" onClick={() => addObs(p)}>+ {p}</button>
          ))}
        </div>
        <div className="obs-composer">
          <input value={obsText} onChange={(e) => setObsText(e.target.value)} placeholder="Escribe una observación…"
            onKeyDown={(e) => { if (e.key === 'Enter') addObs(); }} />
          <button className="btn-tiny" onClick={() => addObs()}>Agregar</button>
        </div>
        {obs.length > 0 && (
          <ul className="obs-list">
            {obs.map((o) => (
              <li key={o.id} className={classNames('obs-row', o.resuelto && 'is-done')}>
                <button className="obs-check" onClick={() => onToggleObservation(project.id, o.id)} title={o.resuelto ? 'Marcar pendiente' : 'Marcar resuelto'}>
                  {o.resuelto
                    ? <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11l5.5-7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    : <span className="obs-dot" />}
                </button>
                <span className="obs-text">{o.texto}</span>
                <span className="obs-date">{formatDate(o.fecha)}</span>
                <button className="row-btn danger" onClick={() => onDeleteObservation(project.id, o.id)} title="Eliminar"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
              </li>
            ))}
          </ul>
        )}
      </div>

      {/* Send to client */}
      <div className="proj-send">
        <button className="btn-primary btn-wa btn-block" onClick={() => onSendWhatsapp(project)}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.01c-.24.68-1.42 1.31-1.96 1.36-.5.05-.96.23-3.23-.67-2.73-1.08-4.45-3.86-4.58-4.04-.13-.18-1.1-1.46-1.1-2.79s.7-1.98.94-2.25c.24-.27.53-.34.71-.34.18 0 .35 0 .51.01.16.01.39-.06.6.46.24.56.78 1.91.85 2.05.07.14.12.3.02.48-.09.18-.14.29-.28.45-.14.16-.29.36-.42.48-.14.14-.28.28-.12.55.16.27.71 1.17 1.53 1.9 1.05.93 1.94 1.22 2.21 1.36.27.14.43.12.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.23.6-.14.24.09 1.55.73 1.81.86.27.13.45.2.51.31.07.11.07.63-.17 1.31z"/></svg>
          Enviar detalle al cliente
        </button>
      </div>
    </div>
  );
}

// ============================================================
// Main CRM view
// ============================================================
function CrmView(props) {
  const {
    crmClients, crmProjects, bankAccount,
    onSaveClient, onDeleteClient, onSaveProject, onDeleteProject,
    onAddPayment, onDeletePayment, onChangeState,
    onAddObservation, onToggleObservation, onDeleteObservation,
    onSaveBank, onToast, onConfirm,
  } = props;

  const [selectedId, setSelectedId] = useCrmState(null);
  const [search, setSearch] = useCrmState('');

  // Drawers (managed locally)
  const [cliDrawer, setCliDrawer] = useCrmState({ open: false, editing: null });
  const [projDrawer, setProjDrawer] = useCrmState({ open: false, editing: null, clienteId: null });
  const [payDrawer, setPayDrawer] = useCrmState({ open: false, project: null });
  const [bankDrawer, setBankDrawer] = useCrmState(false);
  const [waDrawer, setWaDrawer] = useCrmState({ open: false, project: null });
  const [reportDrawer, setReportDrawer] = useCrmState(false);

  // Keep a valid selection
  useCrmEffect(() => {
    if (crmClients.length === 0) { setSelectedId(null); return; }
    if (!selectedId || !crmClients.find((c) => c.id === selectedId)) {
      setSelectedId(crmClients[0].id);
    }
  }, [crmClients]);

  const projectsByClient = useCrmMemo(() => {
    const m = {};
    for (const p of crmProjects) (m[p.clienteId] = m[p.clienteId] || []).push(p);
    return m;
  }, [crmProjects]);

  // Dashboard metrics
  const dash = useCrmMemo(() => {
    let pendientes = 0, entregados = 0, pagosPendientes = 0, totalGenerado = 0, enProceso = 0;
    const alertas = [];
    for (const p of crmProjects) {
      if (p.estado === 'entregado') entregados++;
      else if (p.estado === 'pendiente') pendientes++;
      else if (p.estado === 'proceso') enProceso++;
      const paid = projectPaid(p);
      const pend = projectPending(p);
      pagosPendientes += pend;
      totalGenerado += paid;
      if (!p.plazoIndefinido && p.fechaLimite && p.estado !== 'entregado') {
        const d = daysUntil(p.fechaLimite);
        if (d != null && d <= 5) alertas.push({ project: p, days: d });
      }
    }
    alertas.sort((a, b) => a.days - b.days);
    return { pendientes, enProceso, entregados, pagosPendientes, totalGenerado, alertas };
  }, [crmProjects]);

  const filteredClients = useCrmMemo(() => {
    const q = search.trim().toLowerCase();
    const list = [...crmClients].sort((a, b) => clientFullName(a).localeCompare(clientFullName(b)));
    if (!q) return list;
    return list.filter((c) =>
      clientFullName(c).toLowerCase().includes(q) ||
      (c.celular || '').includes(q) ||
      (c.whatsapp || '').includes(q) ||
      (c.cedula || '').includes(q)
    );
  }, [crmClients, search]);

  const selected = crmClients.find((c) => c.id === selectedId) || null;
  const selectedProjects = selected ? (projectsByClient[selected.id] || []) : [];
  const clientName = selected ? clientFullName(selected) : '';

  // Confirm-wrapped deletes
  function askDeleteClient(c) {
    onConfirm({
      title: 'Eliminar cliente',
      body: <>¿Eliminar a "<strong>{clientFullName(c)}</strong>" y todos sus proyectos? Esta acción no se puede deshacer.</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => onDeleteClient(c.id),
    });
  }
  function askDeleteProject(p) {
    onConfirm({
      title: 'Eliminar proyecto',
      body: <>¿Eliminar el proyecto "<strong>{p.nombre}</strong>" con su historial de pagos y observaciones?</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => onDeleteProject(p.id),
    });
  }

  const bankReady = bankAccount && (bankAccount.banco || bankAccount.numeroCuenta);

  return (
    <>
      <section className="action-bar">
        <div className="action-bar-left">
          <div className="page-eyebrow">CRM · Clientes y proyectos</div>
          <h1 className="page-title">gestión</h1>
        </div>
        <div className="action-bar-right">
          <button className={classNames('btn-ghost', !bankReady && 'attn')} onClick={() => setBankDrawer(true)}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5l5.5 2.5H1.5L7 1.5zM2 4v6m3-6v6m4-6v6m3-6v6M1.5 12.5h11" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round" strokeLinejoin="round"/></svg>
            {bankReady ? 'Cuenta bancaria' : 'Configurar cuenta'}
          </button>
          <button className="btn-primary" onClick={() => setCliDrawer({ open: true, editing: null })}>
            <span aria-hidden="true">+</span> Nuevo cliente
          </button>
        </div>
      </section>

      {/* Dashboard */}
      <div className="crm-dash">
        <div className="crm-kpi"><span className="kpi-label">Clientes</span><span className="kpi-value">{crmClients.length}</span></div>
        <div className="crm-kpi"><span className="kpi-label">Pendientes</span><span className="kpi-value">{dash.pendientes}</span></div>
        <div className="crm-kpi"><span className="kpi-label">En proceso</span><span className="kpi-value">{dash.enProceso}</span></div>
        <div className="crm-kpi"><span className="kpi-label">Entregados</span><span className="kpi-value">{dash.entregados}</span></div>
        <div className="crm-kpi"><span className="kpi-label">Por cobrar</span><span className="kpi-value neg">{money(dash.pagosPendientes)}</span></div>
        <div className="crm-kpi"><span className="kpi-label">Total generado</span><span className="kpi-value pos">{money(dash.totalGenerado)}</span></div>
      </div>

      {dash.alertas.length > 0 && (
        <div className="crm-alerts">
          <span className="alert-icon">⚠</span>
          <span className="alert-label">Entregas próximas:</span>
          <div className="alert-chips">
            {dash.alertas.slice(0, 6).map(({ project, days }) => (
              <button key={project.id} className={classNames('alert-chip', days < 0 ? 'overdue' : 'soon')}
                onClick={() => setSelectedId(project.clienteId)}>
                {project.nombre} · {days < 0 ? `${Math.abs(days)}d vencido` : days === 0 ? 'hoy' : `${days}d`}
              </button>
            ))}
          </div>
        </div>
      )}

      {crmClients.length === 0 ? (
        <EmptyState
          title="Aún no tienes clientes en el CRM"
          body="Registra tu primer cliente para gestionar sus proyectos web, controlar pagos y enviarle el detalle por WhatsApp."
          action={<button className="btn-primary" onClick={() => setCliDrawer({ open: true, editing: null })}><span>+</span> Registrar primer cliente</button>}
        />
      ) : (
        <div className="crm-layout">
          {/* Clients list */}
          <aside className="crm-clients">
            <div className="crm-search">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.25" stroke="currentColor" strokeWidth="1.1"/><path d="M9.5 9.5L12.5 12.5" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round"/></svg>
              <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar cliente…" />
            </div>
            <ul className="crm-client-list">
              {filteredClients.map((c) => {
                const projs = projectsByClient[c.id] || [];
                const pend = projs.reduce((s, p) => s + projectPending(p), 0);
                return (
                  <li key={c.id}>
                    <button className={classNames('crm-client-item', selectedId === c.id && 'is-active')} onClick={() => setSelectedId(c.id)}>
                      <span className="avatar-sm">{clientInitials(c)}</span>
                      <span className="cci-main">
                        <span className="cci-name">{clientFullName(c)}</span>
                        <span className="cci-sub">{projs.length} {projs.length === 1 ? 'proyecto' : 'proyectos'}{pend > 0 ? ` · ${money(pend)} por cobrar` : ''}</span>
                      </span>
                    </button>
                  </li>
                );
              })}
              {filteredClients.length === 0 && <li className="mini-empty">Sin coincidencias.</li>}
            </ul>
          </aside>

          {/* Detail */}
          <div className="crm-detail">
            {selected && (
              <>
                <div className="crm-client-head">
                  <div className="cch-left">
                    <span className="avatar-lg">{clientInitials(selected)}</span>
                    <div>
                      <h2 className="cch-name">{clientFullName(selected)}</h2>
                      <div className="cch-contacts">
                        {selected.celular && <span>📱 {selected.celular}</span>}
                        {selected.whatsapp && <span>🟢 {selected.whatsapp}</span>}
                        {selected.cedula && <span>🪪 {selected.cedula}</span>}
                        {selected.email && <span>✉ {selected.email}</span>}
                      </div>
                      {selected.direccion && <div className="cch-addr">📍 {selected.direccion}</div>}
                    </div>
                  </div>
                  <div className="cch-actions">
                    <button className="btn-primary btn-sm cch-report" onClick={() => setReportDrawer(true)} title="Reporte completo del cliente">
                      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5l3 3V14a.5.5 0 0 1-.5.5h-7A.5.5 0 0 1 4 14V2a.5.5 0 0 1 .5-.5z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round"/><path d="M9 1.5V4.5H12M6 8.5h4M6 11h4" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round"/></svg>
                      Reporte completo
                    </button>
                    <button className="row-btn" onClick={() => setCliDrawer({ open: true, editing: selected })} title="Editar cliente"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4.5 11.5 2 12l.5-2.5L9.5 2.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg></button>
                    <button className="row-btn danger" onClick={() => askDeleteClient(selected)} title="Eliminar cliente"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
                  </div>
                </div>

                <div className="crm-projects-head">
                  <div className="proj-count">{selectedProjects.length} {selectedProjects.length === 1 ? 'proyecto' : 'proyectos'}</div>
                  <button className="btn-primary btn-sm" onClick={() => setProjDrawer({ open: true, editing: null, clienteId: selected.id })}><span>+</span> Nuevo proyecto</button>
                </div>

                {selectedProjects.length === 0 ? (
                  <div className="mini-empty pad">Este cliente aún no tiene proyectos. Crea el primero.</div>
                ) : (
                  <div className="proj-list">
                    {selectedProjects.map((p) => (
                      <ProjectCard
                        key={p.id}
                        project={p} client={selected} bank={bankAccount}
                        onEdit={(proj) => setProjDrawer({ open: true, editing: proj, clienteId: selected.id })}
                        onDelete={askDeleteProject}
                        onAddPayment={(proj) => setPayDrawer({ open: true, project: proj })}
                        onDeletePayment={onDeletePayment}
                        onChangeState={onChangeState}
                        onAddObservation={onAddObservation}
                        onToggleObservation={onToggleObservation}
                        onDeleteObservation={onDeleteObservation}
                        onSendWhatsapp={(proj) => setWaDrawer({ open: true, project: proj })}
                      />
                    ))}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      )}

      {/* Drawers */}
      <CrmClientDrawer
        open={cliDrawer.open} editing={cliDrawer.editing}
        onClose={() => setCliDrawer({ open: false, editing: null })}
        onSave={onSaveClient}
      />
      <ProjectDrawer
        open={projDrawer.open} editing={projDrawer.editing} clientName={clientName}
        onClose={() => setProjDrawer({ open: false, editing: null, clienteId: null })}
        onSave={(proj, isEdit) => onSaveProject(proj, isEdit, projDrawer.clienteId)}
      />
      <PaymentDrawer
        open={payDrawer.open} project={payDrawer.project}
        onClose={() => setPayDrawer({ open: false, project: null })}
        onSave={(pago) => onAddPayment(payDrawer.project.id, pago)}
      />
      <BankDrawer
        open={bankDrawer} bank={bankAccount}
        onClose={() => setBankDrawer(false)}
        onSave={onSaveBank}
      />
      <WhatsappDrawer
        open={waDrawer.open} project={waDrawer.project} client={selected} bank={bankAccount}
        onClose={() => setWaDrawer({ open: false, project: null })}

      <ClientReportDrawer
        open={reportDrawer} client={selected} projects={selectedProjects} bank={bankAccount}
        onClose={() => setReportDrawer(false)}

}

  <script type="text/babel" data-presets="env,react">
// ============================================================
// Life Manager — Deudas (cuentas por cobrar y por pagar)
// ============================================================
const { useState: useDState, useMemo: useDMemo, useEffect: useDEffect } = React;

// ---- Semáforo dot ------------------------------------------
function SemaforoDot({ debt, withLabel }) {
  const meta = debtStatusMeta(debt);
  return (
    <span className="semaforo">
      <span className={classNames('semaforo-dot', 'sem-' + meta.dot)} />
      {withLabel && <span className="semaforo-label">{meta.label}</span>}
    </span>
  );
}

function DebtStatusPill({ debt }) {
  const meta = debtStatusMeta(debt);
  return <span className={classNames('debt-pill', 'debt-' + meta.cls)}>{meta.label}</span>;
}

// ============================================================
// Drawer: create / edit a debt
// ============================================================
function DeudaDrawer({ open, onClose, onSave, editing, defaultDir }) {
  const [f, setF] = useDState({});
  const [touched, setTouched] = useDState(false);

  useDEffect(() => {
    if (!open) return;
    if (editing) {
      setF({ ...editing, abonoInicial: '' });
    } else {
      setF({
        direccion: defaultDir || 'cobrar',
        contraparte: '', telefono: '', concepto: '',
        total: '', abonoInicial: '',
        fecha: todayISO(), fechaVencimiento: '', sinVencimiento: false, nota: '',
      });
    }
    setTouched(false);
  }, [open, editing]);

  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const isEdit = !!editing;
  const dir = f.direccion || 'cobrar';
  const dirMeta = DEBT_DIRECTIONS.find((d) => d.id === dir) || DEBT_DIRECTIONS[0];
  const valid = (f.contraparte || '').trim() && f.total !== '' && +f.total > 0;

  function handleSave() {
    setTouched(true);
    if (!valid) return;
    let pagos = isEdit ? (editing.pagos || []) : [];
    if (!isEdit && +f.abonoInicial > 0) {
      pagos = [{ id: newId('dpay'), monto: +(+f.abonoInicial).toFixed(2), metodo: 'efectivo', fecha: f.fecha || todayISO(), nota: 'Abono inicial' }];
    }
    onSave({
      id: editing ? editing.id : newId('debt'),
      direccion: dir,
      contraparte: (f.contraparte || '').trim(),
      telefono: (f.telefono || '').trim(),
      concepto: (f.concepto || '').trim(),
      total: +(+f.total || 0).toFixed(2),
      fecha: f.fecha || todayISO(),
      fechaVencimiento: f.sinVencimiento ? '' : (f.fechaVencimiento || ''),
      sinVencimiento: !!f.sinVencimiento,
      nota: (f.nota || '').trim(),
      pagos,
      createdAt: editing ? editing.createdAt : todayISO(),
    }, isEdit);
    onClose();
  }

  return (
    <>
      <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
      <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open}>
        <header className="drawer-head">
          <div>
            <div className="drawer-eyebrow">{isEdit ? 'Editar deuda' : 'Nueva deuda'}</div>
            <div className="drawer-title">{isEdit ? f.contraparte : 'Registrar deuda'}</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>

        <div className="drawer-body">
          <div className="type-tabs type-tabs-2">
            {DEBT_DIRECTIONS.map((d) => (
              <button
                key={d.id}
                className={classNames('type-tab', dir === d.id && 'is-active', 'tab-' + d.id)}
                onClick={() => set('direccion', d.id)}
                disabled={isEdit}
              >{d.label}</button>
            ))}
          </div>

          <div className="field">
            <label>{dir === 'cobrar' ? 'Cliente · quién me debe' : 'A quién le debo'}</label>
            <input value={f.contraparte || ''} onChange={(e) => set('contraparte', e.target.value)} placeholder={dir === 'cobrar' ? 'ej. Juan Pérez' : 'ej. Proveedora del Valle'} />
            {touched && !(f.contraparte || '').trim() && <div className="field-error">Indica el nombre.</div>}
          </div>

          <div className="field">
            <label>Teléfono <span className="muted small">opcional</span></label>
            <input value={f.telefono || ''} onChange={(e) => set('telefono', e.target.value)} placeholder="ej. 0999999999" />
            {dir === 'cobrar' && <div className="field-hint">Con código de país (593…) para enviar recordatorios por WhatsApp.</div>}
          </div>

          <div className="field">
            <label>Concepto · producto, factura o motivo</label>
            <input value={f.concepto || ''} onChange={(e) => set('concepto', e.target.value)} placeholder="ej. 2 sacos de café · factura #0142" />
          </div>

          <div className="field amount-field">
            <label>Valor total</label>
            <div className="amount-input">
              <span className="amount-symbol">$</span>
              <input type="number" inputMode="decimal" step="0.01" min="0" value={f.total || ''} onChange={(e) => set('total', e.target.value)} placeholder="0.00" />
              <span className="amount-iso">USD</span>
            </div>
            {touched && (f.total === '' || +f.total <= 0) && <div className="field-error">Indica un valor mayor a 0.</div>}
          </div>

          {!isEdit && (
            <div className="field">
              <label>Abono inicial <span className="muted small">opcional</span></label>
              <div className="amount-input sm">
                <span className="amount-symbol">$</span>
                <input type="number" step="0.01" min="0" value={f.abonoInicial || ''} onChange={(e) => set('abonoInicial', e.target.value)} placeholder="0.00" />
                <span className="amount-iso">USD</span>
              </div>
              {+f.total > 0 && (
                <div className="field-hint">
                  Saldo pendiente: <strong>{money(Math.max(0, +f.total - (+f.abonoInicial || 0)))}</strong>
                </div>
              )}
            </div>
          )}

          <div className="field-row">
            <div className="field">
              <label>{dir === 'cobrar' ? 'Fecha de venta' : 'Fecha de la deuda'}</label>
              <input type="date" value={f.fecha || ''} onChange={(e) => set('fecha', e.target.value)} />
            </div>
            <div className="field">
              <label>Fecha de vencimiento</label>
              <input type="date" value={f.fechaVencimiento || ''} disabled={f.sinVencimiento} onChange={(e) => set('fechaVencimiento', e.target.value)} />
            </div>
          </div>
          <label className="check-row">
            <input type="checkbox" checked={!!f.sinVencimiento} onChange={(e) => set('sinVencimiento', e.target.checked)} />
            <span>Sin fecha de vencimiento</span>
          </label>

          <div className="field">
            <label>Observaciones <span className="muted small">opcional</span></label>
            <textarea rows="2" value={f.nota || ''} onChange={(e) => set('nota', e.target.value)} placeholder="Acuerdo de pago, referencia…" />
          </div>
        </div>

        <footer className="drawer-foot">
          <button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" onClick={handleSave}>{isEdit ? 'Guardar cambios' : 'Registrar deuda'}</button>
        </footer>
      </aside>
    </>
  );
}

function DeudaDetailDrawer({ open, debt, bank, onClose, onAddPayment, onDeletePayment, onEdit, onDelete }) {
  const [monto, setMonto] = useDState('');
  const [metodo, setMetodo] = useDState('efectivo');
  const [fecha, setFecha] = useDState(todayISO());

  useDEffect(() => {
    if (open) { setMonto(''); setMetodo('efectivo'); setFecha(todayISO()); }
  }, [open, debt && debt.id]);

  if (!debt) {
    return (
      <>
        <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
        <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open} />
      </>
    );
  }

  const dir = debt.direccion || 'cobrar';
  const isCobrar = dir === 'cobrar';
  const total = +debt.total || 0;
  const paid = debtPaid(debt);
  const saldo = debtBalance(debt);
  const pct = total > 0 ? Math.min(100, (paid / total) * 100) : 0;
  const meta = debtStatusMeta(debt);
  const dleft = debt.sinVencimiento ? null : daysUntil(debt.fechaVencimiento);
  const pagos = [...(debt.pagos || [])].sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  const hasWa = !!String(debt.telefono || '').replace(/[^\d]/g, '');

  function addAbono(full) {
    const amt = full ? saldo : +monto;
    if (!amt || amt <= 0) return;
    onAddPayment(debt.id, { id: newId('dpay'), monto: +amt.toFixed(2), metodo, fecha, nota: '' });
    setMonto('');
  }
  function sendReminder() {
    if (!hasWa) return;
    window.open(whatsappLink(debt.telefono, buildDebtReminder(debt, bank)), '_blank');
  }

  return (
    <>
      <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
      <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open}>
        <header className="drawer-head">
          <div>
            <div className="drawer-eyebrow">{isCobrar ? 'Por cobrar · me deben' : 'Por pagar · yo debo'}</div>
            <div className="drawer-title">{debt.contraparte}</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>

        <div className="drawer-body">
          <div className="detail-status">
            <SemaforoDot debt={debt} withLabel />
            {dleft != null && saldo > 0 && (
              <span className={classNames('days-pill', dleft < 0 ? 'overdue' : dleft <= 3 ? 'soon' : '')}>
                {dleft < 0 ? `${Math.abs(dleft)}d vencido` : dleft === 0 ? 'vence hoy' : `vence en ${dleft}d`}
              </span>
            )}
          </div>

          {debt.concepto && <div className="detail-concepto">{debt.concepto}</div>}

          <div className="proj-finance" style={{ marginTop: 4 }}>
            <div className="finance-bars">
              <div className="finance-bar"><div className={classNames('finance-bar-fill', !isCobrar && 'is-pagar')} style={{ width: pct + '%' }} /></div>
            </div>
            <div className="finance-grid">
              <div><span className="ts-label">Total</span><span className="ts-value">{money(total)}</span></div>
              <div><span className="ts-label">Abonado</span><span className="ts-value pos">{money(paid)}</span></div>
              <div><span className="ts-label">Saldo</span><span className={classNames('ts-value', saldo > 0 && 'neg')}>{money(saldo)}</span></div>
            </div>
          </div>

          <div className="detail-meta">
            <div className="proj-meta">
              <span className="meta-label">{isCobrar ? 'Venta' : 'Inicio'}</span>
              <span className="meta-value">{debt.fecha ? formatDateFull(debt.fecha) : '—'}</span>
            </div>
            <div className="proj-meta">
              <span className="meta-label">Vencimiento</span>
              <span className="meta-value">{debt.sinVencimiento ? 'Sin fecha' : (debt.fechaVencimiento ? formatDateFull(debt.fechaVencimiento) : '—')}</span>
            </div>
            {debt.telefono && (
              <div className="proj-meta">
                <span className="meta-label">Teléfono</span>
                <span className="meta-value">{debt.telefono}</span>
              </div>
            )}
          </div>

          {debt.nota && <div className="callout">{debt.nota}</div>}

          {/* Add abono */}
          {saldo > 0 && (
            <div className="proj-section">
              <div className="proj-section-title">Registrar abono</div>
              <div className="abono-form">
                <div className="amount-input sm">
                  <span className="amount-symbol">$</span>
                  <input type="number" step="0.01" min="0" value={monto} onChange={(e) => setMonto(e.target.value)} placeholder="0.00" />
                </div>
                <input type="date" className="abono-date" value={fecha} onChange={(e) => setFecha(e.target.value)} />
              </div>
              <div className="chip-row" style={{ marginTop: 8 }}>
                {PAYMENT_METHODS.map((m) => (
                  <button key={m.id} className={classNames('chip', metodo === m.id && 'is-active')} onClick={() => setMetodo(m.id)}>{m.label}</button>
                ))}
              </div>
              <div className="abono-actions">
                <button className="btn-ghost btn-sm" onClick={() => addAbono(true)}>Saldar todo ({money(saldo)})</button>
                <button className="btn-primary btn-sm" onClick={() => addAbono(false)} disabled={!monto || +monto <= 0}>+ Abono</button>
              </div>
            </div>
          )}

          {/* Payment history */}
          <div className="proj-section">
            <div className="proj-section-title">Historial de pagos</div>
            {pagos.length === 0 ? (
              <div className="mini-empty">Sin abonos registrados.</div>

                  </li>
                ))}
              </ul>
            )}
          </div>

          {isCobrar && saldo > 0 && (
            <button className="btn-primary btn-wa btn-block" onClick={sendReminder} disabled={!hasWa} title={hasWa ? '' : 'Agrega el teléfono con código de país'}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.01c-.24.68-1.42 1.31-1.96 1.36-.5.05-.96.23-3.23-.67-2.73-1.08-4.45-3.86-4.58-4.04-.13-.18-1.1-1.46-1.1-2.79s.7-1.98.94-2.25c.24-.27.53-.34.71-.34.18 0 .35 0 .51.01.16.01.39-.06.6.46.24.56.78 1.91.85 2.05.07.14.12.3.02.48-.09.18-.14.29-.28.45-.14.16-.29.36-.42.48-.14.14-.28.28-.12.55.16.27.71 1.17 1.53 1.9 1.05.93 1.94 1.22 2.21 1.36.27.14.43.12.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.23.6-.14.24.09 1.55.73 1.81.86.27.13.45.2.51.31.07.11.07.63-.17 1.31z"/></svg>
              Enviar recordatorio
            </button>

        </div>

        <footer className="drawer-foot drawer-foot-split">

          <button className="btn-primary" onClick={() => onEdit(debt)}>Editar deuda</button>
        </footer>
      </aside>
    </>
  );
}

// ============================================================
// Main Deudas view
// ============================================================
function DeudasView(props) {
  const { debts, bankAccount, onSave, onDelete, onAddPayment, onDeletePayment, onConfirm } = props;
  const [dir, setDir] = useDState('cobrar');
  const [search, setSearch] = useDState('');
  const [statusFilter, setStatusFilter] = useDState('todas');
  const [drawer, setDrawer] = useDState({ open: false, editing: null });
  const [detail, setDetail] = useDState({ open: false, debt: null });

  // Totals across both directions (always shown)
  const totals = useDMemo(() => {
    let porCobrar = 0, porPagar = 0, vencidas = 0;
    for (const d of debts) {
      const bal = debtBalance(d);
      if (d.direccion === 'pagar') porPagar += bal; else porCobrar += bal;
      if (bal > 0 && debtStatus(d) === 'vencido') vencidas++;
    }
    return { porCobrar, porPagar, neto: porCobrar - porPagar, vencidas };
  }, [debts]);

  const list = useDMemo(() => {
    const q = search.trim().toLowerCase();
    return debts
      .filter((d) => (d.direccion || 'cobrar') === dir)
      .filter((d) => statusFilter === 'todas' ? true : statusFilter === 'pendientes' ? debtBalance(d) > 0 : debtStatus(d) === statusFilter)
      .filter((d) => !q || (d.contraparte || '').toLowerCase().includes(q) || (d.concepto || '').toLowerCase().includes(q) || (d.telefono || '').includes(q))
      .sort((a, b) => {
        const sa = debtBalance(a) <= 0 ? 1 : 0, sb = debtBalance(b) <= 0 ? 1 : 0;
        if (sa !== sb) return sa - sb;
        const da = daysUntil(a.fechaVencimiento), db = daysUntil(b.fechaVencimiento);
        if (da == null && db == null) return 0;
        if (da == null) return 1;
        if (db == null) return -1;
        return da - db;
      });
  }, [debts, dir, search, statusFilter]);

  const dirTotal = useDMemo(() => list.reduce((s, d) => s + debtBalance(d), 0), [list]);

  // Alerts (current direction)
  const alerts = useDMemo(() => {
    return debts
      .filter((d) => (d.direccion || 'cobrar') === dir && debtBalance(d) > 0)
      .map((d) => ({ debt: d, days: daysUntil(d.fechaVencimiento) }))
      .filter((x) => x.days != null && x.days <= 3)
      .sort((a, b) => a.days - b.days);
  }, [debts, dir]);

  const isCobrar = dir === 'cobrar';

  function askDelete(d) {
    onConfirm({
      title: 'Eliminar deuda',
      body: <>¿Eliminar la deuda de "<strong>{d.contraparte}</strong>" por {money(d.total)}? Se borrará su historial de abonos.</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => { onDelete(d.id); setDetail({ open: false, debt: null }); },
    });
  }

  const statusFilters = [
    ['todas', 'Todas'],
    ['pendientes', 'Pendientes'],
    ['vencido', 'Vencidas'],
    ['porvencer', 'Por vencer'],
    ['pagado', 'Pagadas'],
  ];

  return (
    <>
      <section className="action-bar">
        <div className="action-bar-left">
          <div className="page-eyebrow">Cobros y pagos</div>
          <h1 className="page-title">deudas</h1>
        </div>
        <div className="action-bar-right">
          <div className="segmented">
            {DEBT_DIRECTIONS.map((d) => (
              <button key={d.id} className={classNames('segmented-btn', dir === d.id && 'is-active')} onClick={() => setDir(d.id)}>{d.label}</button>
            ))}
          </div>
          <button className="btn-primary" onClick={() => setDrawer({ open: true, editing: null })}><span aria-hidden="true">+</span> Nueva deuda</button>
        </div>
      </section>

      {/* Summary */}
      <div className="deuda-summary">
        <div className="dsum dsum-cobrar">
          <span className="kpi-label">Por cobrar · me deben</span>
          <span className="kpi-value pos">{money(totals.porCobrar)}</span>
        </div>
        <div className="dsum dsum-pagar">
          <span className="kpi-label">Por pagar · yo debo</span>
          <span className="kpi-value neg">{money(totals.porPagar)}</span>
        </div>
        <div className="dsum">
          <span className="kpi-label">Balance neto</span>
          <span className={classNames('kpi-value', totals.neto < 0 ? 'neg' : 'pos')}>{money(totals.neto)}</span>
          <span className="dsum-note">{totals.neto >= 0 ? 'a tu favor' : 'en contra'}</span>
        </div>
        <div className="dsum">
          <span className="kpi-label">Vencidas</span>
          <span className={classNames('kpi-value', totals.vencidas > 0 && 'neg')}>{totals.vencidas}</span>
          <span className="dsum-note">{totals.vencidas === 1 ? 'deuda vencida' : 'deudas vencidas'}</span>
        </div>
      </div>

      {alerts.length > 0 && (
        <div className="crm-alerts">
          <span className="alert-icon">⚠</span>
          <span className="alert-label">{isCobrar ? 'Cobros urgentes:' : 'Pagos urgentes:'}</span>
          <div className="alert-chips">
            {alerts.slice(0, 6).map(({ debt, days }) => (
              <button key={debt.id} className={classNames('alert-chip', days < 0 ? 'overdue' : 'soon')} onClick={() => setDetail({ open: true, debt })}>
                {debt.contraparte} · {money(debtBalance(debt))} · {days < 0 ? `${Math.abs(days)}d vencido` : days === 0 ? 'hoy' : `${days}d`}
              </button>
            ))}
          </div>
        </div>
      )}

      {debts.filter((d) => (d.direccion || 'cobrar') === dir).length === 0 ? (
        <EmptyState
          title={isCobrar ? 'Nadie te debe… por ahora' : 'No tienes deudas registradas'}
          body={isCobrar
            ? 'Registra las ventas a crédito (fiados) para llevar el control de quién te debe, cuánto y cuándo vence cada saldo.'
            : 'Registra el dinero que debes a proveedores o personas para no perder de vista tus pagos y vencimientos.'}
          action={<button className="btn-primary" onClick={() => setDrawer({ open: true, editing: null })}><span>+</span> Registrar primera deuda</button>}
        />
      ) : (
        <div className="card">
          <div className="filters-bar">
            <div className="filters-left">
              <div className="search-field">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.25" stroke="currentColor" strokeWidth="1.1"/><path d="M9.5 9.5L12.5 12.5" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round"/></svg>
                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar nombre o concepto…" />
              </div>
              <div className="mini-tabs">
                {statusFilters.map(([id, label]) => (
                  <button key={id} className={classNames('mini-tab', statusFilter === id && 'is-active')} onClick={() => setStatusFilter(id)}>{label}</button>
                ))}
              </div>
            </div>
            <div className="filters-right">
              <span className="dir-total">{isCobrar ? 'Por cobrar' : 'Por pagar'}: <strong>{money(dirTotal)}</strong></span>
            </div>
          </div>

          {list.length === 0 ? (
            <div className="empty-row" style={{ padding: '40px 0' }}>Sin deudas para este filtro.</div>
          ) : (
            <div className="table-wrap">
              <table className="movs deudas-table">
                <thead>
                  <tr>
                    <th className="sem-col"></th>
                    <th>{isCobrar ? 'Cliente' : 'Acreedor'}</th>
                    <th>Concepto</th>
                    <th className="num">Total</th>
                    <th className="num">Abonado</th>
                    <th className="num">Saldo</th>
                    <th>Vence</th>
                    <th>Estado</th>
                    <th className="actions-col"></th>
                  </tr>
                </thead>
                <tbody>
                  {list.map((d) => {
                    const saldo = debtBalance(d);
                    const dleft = d.sinVencimiento ? null : daysUntil(d.fechaVencimiento);
                    return (
                      <tr key={d.id} className="deuda-row" onClick={() => setDetail({ open: true, debt: d })}>
                        <td className="sem-col"><SemaforoDot debt={d} /></td>
                        <td className="concept">
                          <div className="deuda-party">
                            <span>{d.contraparte}</span>
                            {d.telefono && <span className="muted small">{d.telefono}</span>}
                          </div>
                        </td>
                        <td className="muted">{d.concepto || '—'}</td>
                        <td className="num">{money(d.total)}</td>
                        <td className="num muted">{money(debtPaid(d))}</td>
                        <td className={classNames('num', saldo > 0 ? 'amount neg' : 'muted')}>{money(saldo)}</td>
                        <td className="muted">
                          {d.sinVencimiento || !d.fechaVencimiento ? '—' : (
                            <span className="vence-cell">
                              {formatDate(d.fechaVencimiento)}
                              {dleft != null && saldo > 0 && (
                                <span className={classNames('days-pill', dleft < 0 ? 'overdue' : dleft <= 3 ? 'soon' : '')}>
                                  {dleft < 0 ? `${Math.abs(dleft)}d` : dleft === 0 ? 'hoy' : `${dleft}d`}
                                </span>
                              )}
                            </span>
                          )}
                        </td>
                        <td><DebtStatusPill debt={d} /></td>
                        <td className="actions-col" onClick={(e) => e.stopPropagation()}>
                          <div className="row-actions">
                            <button className="row-btn" onClick={() => setDrawer({ open: true, editing: d })} title="Editar"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4.5 11.5 2 12l.5-2.5L9.5 2.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg></button>
                            <button className="row-btn danger" onClick={() => askDelete(d)} title="Eliminar"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      <DeudaDrawer
        open={drawer.open} editing={drawer.editing} defaultDir={dir}
        onClose={() => setDrawer({ open: false, editing: null })}
        onSave={onSave}
      />
      <DeudaDetailDrawer
        open={detail.open} debt={detail.debt ? debts.find((x) => x.id === detail.debt.id) || detail.debt : null} bank={bankAccount}
        onClose={() => setDetail({ open: false, debt: null })}
        onAddPayment={onAddPayment}
        onDeletePayment={onDeletePayment}
        onEdit={(d) => { setDetail({ open: false, debt: null }); setDrawer({ open: true, editing: d }); }}
        onDelete={askDelete}
      />
    </>
  );
}

Object.assign(window, { DeudasView });

  </script>

  <script type="text/babel" data-presets="env,react">
// ============================================================
// Life Manager — Pedidos
// Delivery Guayaquil · Ventas en local · Cuadre de repartidores
// ============================================================
const { useState: usePState, useMemo: usePMemo, useEffect: usePEffect } = React;

const HORARIOS = ['Mañana 9–13', 'Tarde 13–18', 'Noche 18–21', 'A convenir'];

// ---- Píldoras de estado ------------------------------------
function EstadoPill({ estado, size }) {
  const m = pedidoEstadoMeta(estado);
  return <span className={classNames('ped-pill', 'ped-' + m.cls, size === 'sm' && 'is-sm')}>{m.label}</span>;
}
function EstadoDot({ estado }) {
  const m = pedidoEstadoMeta(estado);
  return <span className={classNames('semaforo-dot', 'sem-' + m.dot)} title={m.label} />;
}

function waHref(tel, msg) { return whatsappLink(tel, msg); }
function hasTel(tel) { return !!String(tel || '').replace(/[^\d]/g, ''); }

// ============================================================
// Editor de productos del pedido
// ============================================================
function ItemsEditor({ items, setItems, products }) {
  function addFromProduct(id) {
    const p = products.find((x) => x.id === id);
    if (!p) return;
    const existing = items.find((it) => it.productoId === id);
    if (existing) {
      setItems(items.map((it) => it.productoId === id ? { ...it, cantidad: (+it.cantidad || 0) + 1 } : it));
    } else {
      setItems([...items, { id: newId('it'), productoId: p.id, nombre: p.nombre, precio: +p.precio || 0, cantidad: 1 }]);
    }
  }
  function addManual() {
    setItems([...items, { id: newId('it'), productoId: '', nombre: '', precio: '', cantidad: 1 }]);
  }
  function upd(id, k, v) { setItems(items.map((it) => it.id === id ? { ...it, [k]: v } : it)); }
  function del(id) { setItems(items.filter((it) => it.id !== id)); }

  const subtotal = items.reduce((s, it) => s + (+it.precio || 0) * (+it.cantidad || 0), 0);

  return (
    <div className="field">
      <label>Productos del pedido</label>

      <div className="items-add">
        <select value="" onChange={(e) => { addFromProduct(e.target.value); e.target.value = ''; }}>
          <option value="">Agregar desde inventario…</option>
          {products.map((p) => (
            <option key={p.id} value={p.id}>{p.nombre} · {money(p.precio)} · {p.stock} en stock</option>
          ))}
        </select>
        <button type="button" className="btn-ghost btn-sm" onClick={addManual}>+ Ítem libre</button>
      </div>

      {items.length === 0 ? (
        <div className="mini-empty">Todavía no agregas productos.</div>
      ) : (
        <ul className="item-rows">
          <li className="item-head">
            <span>Producto</span><span className="ir-c">Cant</span><span className="ir-c">P. unit</span><span className="ir-c">Total</span><span />
          </li>
          {items.map((it) => (
            <li key={it.id} className="item-row">
              <input
                className="ir-name" value={it.nombre}
                onChange={(e) => upd(it.id, 'nombre', e.target.value)}
                placeholder="Nombre del producto"
              />
              <input
                className="ir-qty" type="number" min="1" step="1" value={it.cantidad}
                onChange={(e) => upd(it.id, 'cantidad', Math.max(1, +e.target.value || 1))}
              />
              <input
                className="ir-price" type="number" min="0" step="0.01" value={it.precio}
                onChange={(e) => upd(it.id, 'precio', e.target.value)} placeholder="0.00"
              />
              <span className="ir-total">{money((+it.precio || 0) * (+it.cantidad || 0))}</span>
              <button type="button" className="row-btn danger" onClick={() => del(it.id)} title="Quitar">
                <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
              </button>
            </li>
          ))}
        </ul>
      )}
      {items.length > 0 && (
        <div className="items-subtotal"><span>Subtotal de productos</span><strong>{money(subtotal)}</strong></div>
      )}
    </div>
  );
}

// ============================================================
// Drawer: crear / editar pedido
// ============================================================
function PedidoDrawer({ open, onClose, onSave, editing, canal, products, repartidores, pedidos, clients }) {
  const [f, setF] = usePState({});
  const [items, setItems] = usePState([]);
  const [touched, setTouched] = usePState(false);
  const isEdit = !!editing;
  const ch = f.canal || canal || 'delivery';
  const isLocal = ch === 'local';

  usePEffect(() => {
    if (!open) return;
    if (editing) {
      setF({ ...editing });
      setItems(editing.items || []);
    } else {
      setF({
        canal: canal || 'delivery',
        clienteNombre: '', clienteTelefono: '', clienteId: '',
        zona: 'centro', direccion: '', referencia: '',
        fecha: todayISO(), fechaEntrega: todayISO(), horario: 'A convenir',
        descuento: '', flete: canal === 'local' ? 0 : zonaMeta('centro').flete,
        fleteParaRepartidor: true,
        metodoPago: 'efectivo', repartidorId: '',
        estado: canal === 'local' ? 'entregado' : 'nuevo',
        nota: '',
      });
      setItems([]);
    }
    setTouched(false);
  }, [open, editing, canal]);

  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));

  function setZona(z) {
    setF((p) => ({ ...p, zona: z, flete: zonaMeta(z).flete }));
  }

  const draft = { ...f, items, canal: ch };
  const subtotal = pedidoSubtotal(draft);
  const total = pedidoTotal(draft);
  const valid = items.length > 0
    && items.every((it) => (it.nombre || '').trim() && +it.cantidad > 0)
    && (isLocal || (f.clienteNombre || '').trim())
    && (isLocal || (f.direccion || '').trim());

  function handleSave() {
    setTouched(true);
    if (!valid) return;
    const p = {
      id: editing ? editing.id : newId('ped'),
      numero: editing ? editing.numero : nextPedidoNumero(pedidos),
      canal: ch,
      clienteNombre: (f.clienteNombre || '').trim(),
      clienteTelefono: (f.clienteTelefono || '').trim(),
      clienteId: f.clienteId || '',
      zona: isLocal ? '' : (f.zona || 'otro'),
      direccion: isLocal ? '' : (f.direccion || '').trim(),
      referencia: isLocal ? '' : (f.referencia || '').trim(),
      fecha: f.fecha || todayISO(),
      fechaEntrega: isLocal ? (f.fecha || todayISO()) : (f.fechaEntrega || f.fecha || todayISO()),
      horario: isLocal ? '' : (f.horario || ''),
      items: items.map((it) => ({ ...it, precio: +(+it.precio || 0).toFixed(2), cantidad: +it.cantidad || 1 })),
      descuento: +(+f.descuento || 0).toFixed(2),
      flete: isLocal ? 0 : +(+f.flete || 0).toFixed(2),
      fleteParaRepartidor: isLocal ? false : !!f.fleteParaRepartidor,
      metodoPago: f.metodoPago || 'efectivo',
      repartidorId: isLocal ? '' : (f.repartidorId || ''),
      estado: f.estado || (isLocal ? 'entregado' : 'nuevo'),
      liquidado: editing ? !!editing.liquidado : (isLocal ? true : false),
      fechaEntregaReal: editing ? editing.fechaEntregaReal : (isLocal ? (f.fecha || todayISO()) : ''),
      nota: (f.nota || '').trim(),
      createdAt: editing ? editing.createdAt : todayISO(),
    };
    onSave(p, isEdit);
    onClose();
  }

  return (
    <>
      <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
      <aside className={classNames('drawer drawer-wide', open && 'is-open')} aria-hidden={!open}>
        <header className="drawer-head">
          <div>
            <div className="drawer-eyebrow">{isEdit ? `Editar ${pedidoRef(editing)}` : (isLocal ? 'Venta en local' : 'Nuevo pedido')}</div>
            <div className="drawer-title">{isLocal ? 'Registrar venta del local' : 'Pedido con delivery'}</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>

        <div className="drawer-body">
          {!isEdit && (
            <div className="type-tabs type-tabs-2">
              <button className={classNames('type-tab', !isLocal && 'is-active', 'tab-delivery')} onClick={() => set('canal', 'delivery')}>🛵 Delivery</button>
              <button className={classNames('type-tab', isLocal && 'is-active', 'tab-local')} onClick={() => { set('canal', 'local'); set('estado', 'entregado'); }}>🏪 Local</button>
            </div>
          )}

          <div className="field-row">
            <div className="field">
              <label>Cliente {isLocal && <span className="muted small">opcional</span>}</label>
              <input value={f.clienteNombre || ''} onChange={(e) => set('clienteNombre', e.target.value)} placeholder="ej. María Zambrano" list="lm-clientes" />
              <datalist id="lm-clientes">
                {(clients || []).map((c) => <option key={c.id} value={c.nombre} />)}
              </datalist>
              {touched && !isLocal && !(f.clienteNombre || '').trim() && <div className="field-error">Indica el nombre del cliente.</div>}
            </div>
            <div className="field">
              <label>WhatsApp {isLocal && <span className="muted small">opcional</span>}</label>
              <input value={f.clienteTelefono || ''} onChange={(e) => set('clienteTelefono', e.target.value)} placeholder="5939XXXXXXXX" inputMode="tel" />
              {!isLocal && <div className="field-hint">Con 593 al inicio para escribirle directo.</div>}
            </div>
          </div>

          {!isLocal && (
            <>
              <div className="field">
                <label>Zona de Guayaquil</label>
                <div className="zona-grid">
                  {ZONAS_GYE.map((z) => (
                    <button key={z.id} type="button"
                      className={classNames('zona-chip', f.zona === z.id && 'is-active')}
                      onClick={() => setZona(z.id)}>
                      <span className="zc-name">{z.label}</span>
                      {z.flete > 0 && <span className="zc-flete">{money(z.flete)}</span>}
                    </button>
                  ))}
                </div>
              </div>

              <div className="field">
                <label>Dirección de entrega</label>
                <textarea rows="2" value={f.direccion || ''} onChange={(e) => set('direccion', e.target.value)} placeholder="ej. Alborada 6ta etapa, Mz 620 V. 12" />
                {touched && !(f.direccion || '').trim() && <div className="field-error">Sin dirección el repartidor no puede salir.</div>}
              </div>

              <div className="field">
                <label>Referencia <span className="muted small">opcional</span></label>
                <input value={f.referencia || ''} onChange={(e) => set('referencia', e.target.value)} placeholder="ej. casa esquinera reja negra, junto a la farmacia" />
              </div>

              <div className="field-row">
                <div className="field">
                  <label>Fecha de entrega</label>
                  <input type="date" value={f.fechaEntrega || ''} onChange={(e) => set('fechaEntrega', e.target.value)} />
                </div>
                <div className="field">
                  <label>Horario</label>
                  <select value={f.horario || ''} onChange={(e) => set('horario', e.target.value)}>
                    {HORARIOS.map((h) => <option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
              </div>
            </>
          )}

          {isLocal && (
            <div className="field">
              <label>Fecha de la venta</label>
              <input type="date" value={f.fecha || ''} onChange={(e) => set('fecha', e.target.value)} />
            </div>
          )}

          <ItemsEditor items={items} setItems={setItems} products={products} />

          <div className="field-row">
            <div className="field">
              <label>Descuento <span className="muted small">opcional</span></label>
              <div className="amount-input sm">
                <span className="amount-symbol">$</span>
                <input type="number" min="0" step="0.01" value={f.descuento || ''} onChange={(e) => set('descuento', e.target.value)} placeholder="0.00" />
              </div>
            </div>
            {!isLocal && (
              <div className="field">
                <label>Valor del envío</label>
                <div className="amount-input sm">
                  <span className="amount-symbol">$</span>
                  <input type="number" min="0" step="0.01" value={f.flete} onChange={(e) => set('flete', e.target.value)} placeholder="0.00" />
                </div>
              </div>
            )}
          </div>

          {!isLocal && (
            <label className="check-row">
              <input type="checkbox" checked={!!f.fleteParaRepartidor} onChange={(e) => set('fleteParaRepartidor', e.target.checked)} />
              <span>El envío se lo queda el repartidor (se descuenta en el cuadre)</span>
            </label>
          )}

          <div className="field">
            <label>Forma de pago</label>
            <div className="chip-row">
              {PAYMENT_METHODS.map((m) => (
                <button key={m.id} type="button" className={classNames('chip', f.metodoPago === m.id && 'is-active')} onClick={() => set('metodoPago', m.id)}>
                  {m.id === 'efectivo' && !isLocal ? 'Efectivo · contra entrega' : m.label}
                </button>
              ))}
            </div>
          </div>

          {!isLocal && (
            <div className="field-row">
              <div className="field">
                <label>Repartidor <span className="muted small">opcional</span></label>
                <select value={f.repartidorId || ''} onChange={(e) => set('repartidorId', e.target.value)}>
                  <option value="">— Sin asignar —</option>
                  {repartidores.map((r) => <option key={r.id} value={r.id}>{r.nombre}</option>)}
                </select>
              </div>
              <div className="field">
                <label>Estado</label>
                <select value={f.estado || 'nuevo'} onChange={(e) => set('estado', e.target.value)}>
                  {PEDIDO_ESTADOS.map((e2) => <option key={e2.id} value={e2.id}>{e2.label}</option>)}
                </select>
              </div>
            </div>
          )}

          <div className="field">
            <label>Nota interna <span className="muted small">opcional</span></label>
            <textarea rows="2" value={f.nota || ''} onChange={(e) => set('nota', e.target.value)} placeholder="ej. llamar antes de llegar, cambio de $20" />
          </div>

          <div className="ped-total-box">
            <div><span>Productos</span><strong>{money(subtotal)}</strong></div>
            {+f.descuento > 0 && <div><span>Descuento</span><strong className="neg">−{money(f.descuento)}</strong></div>}
            {!isLocal && <div><span>Envío</span><strong>{money(f.flete)}</strong></div>}
            <div className="ptb-total"><span>Total a cobrar</span><strong>{money(total)}</strong></div>
          </div>
        </div>

        <footer className="drawer-foot">
          <button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" onClick={handleSave}>
            {isEdit ? 'Guardar cambios' : (isLocal ? 'Registrar venta' : 'Crear pedido')}
          </button>
        </footer>
      </aside>
    </>
  );
}

// ============================================================
// Drawer: detalle del pedido
// ============================================================
function PedidoDetailDrawer({ open, pedido, repartidores, onClose, onEdit, onDelete, onChangeEstado, onAssign, onToast }) {
  if (!pedido) {
    return (
      <>
        <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
        <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open} />
      </>
    );
  }
  const p = pedido;
  const isLocal = p.canal === 'local';
  const rep = repartidores.find((r) => r.id === p.repartidorId);
  const total = pedidoTotal(p);

  function copy(text, msg) {
    navigator.clipboard?.writeText(text).then(() => onToast && onToast(msg || 'Copiado.'));
  }

  return (
    <>
      <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
      <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open}>
        <header className="drawer-head">
          <div>
            <div className="drawer-eyebrow">{isLocal ? 'Venta en local' : 'Pedido delivery'} · {pedidoRef(p)}</div>
            <div className="drawer-title">{p.clienteNombre || 'Sin nombre'}</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>

        <div className="drawer-body">
          <div className="detail-status">
            <EstadoPill estado={p.estado} />
            {p.liquidado && p.estado === 'entregado' && <span className="ped-pill ped-liquidado">Liquidado</span>}
            <span className="muted small">{formatDateFull(p.fechaEntrega || p.fecha)}{p.horario ? ` · ${p.horario}` : ''}</span>
          </div>

          {!isLocal && (
            <div className="proj-section">
              <div className="proj-section-title">Avanzar el pedido</div>
              <div className="estado-track">
                {PEDIDO_ESTADOS.filter((e) => !['reagendado', 'devuelto', 'cancelado'].includes(e.id)).map((e) => (
                  <button key={e.id}
                    className={classNames('estado-step', p.estado === e.id && 'is-active', 'st-' + e.cls)}
                    onClick={() => onChangeEstado(p.id, e.id)}>
                    {e.short}
                  </button>
                ))}
              </div>
              <div className="chip-row" style={{ marginTop: 8 }}>
                {['reagendado', 'devuelto', 'cancelado'].map((id) => (
                  <button key={id} className={classNames('chip', p.estado === id && 'is-active')} onClick={() => onChangeEstado(p.id, id)}>
                    {pedidoEstadoMeta(id).label}
                  </button>
                ))}
              </div>
              {p.estado === 'entregado' && (
                <div className="field-hint" style={{ marginTop: 8 }}>
                  Al marcar entregado se registra automáticamente una venta de {money(total)} en Movimientos.
                </div>
              )}
            </div>
          )}

          <div className="proj-section">
            <div className="proj-section-title">Productos</div>
            <ul className="detail-items">
              {(p.items || []).map((it) => (
                <li key={it.id}>
                  <span className="di-qty">{it.cantidad}×</span>
                  <span className="di-name">{it.nombre}</span>
                  <span className="di-amount">{money((+it.precio || 0) * (+it.cantidad || 0))}</span>
                </li>
              ))}
            </ul>
            <div className="ped-total-box">
              <div><span>Productos</span><strong>{money(pedidoSubtotal(p))}</strong></div>
              {+p.descuento > 0 && <div><span>Descuento</span><strong className="neg">−{money(p.descuento)}</strong></div>}
              {!isLocal && <div><span>Envío · {zonaLabel(p.zona)}</span><strong>{money(p.flete)}</strong></div>}
              <div className="ptb-total"><span>Total</span><strong>{money(total)}</strong></div>

            <div className="field-hint" style={{ marginTop: 6 }}>
              Cobro: {paymentMethodLabel(p.metodoPago)}{p.metodoPago === 'efectivo' && !isLocal ? ' · contra entrega' : ''}
            </div>
          </div>

          {!isLocal && (
            <div className="proj-section">

function RepartidorDrawer({ open, onClose, onSave, editing }) {
  const [f, setF] = usePState({});
  const [touched, setTouched] = usePState(false);

  usePEffect(() => {
    if (!open) return;
    setF(editing ? { ...editing } : { nombre: '', telefono: '', vehiculo: 'Moto', zona: '', nota: '' });
    setTouched(false);
  }, [open, editing]);

  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const valid = (f.nombre || '').trim();

  function handleSave() {
    setTouched(true);
    if (!valid) return;
    onSave({
      id: editing ? editing.id : newId('rep'),
      nombre: (f.nombre || '').trim(),
      telefono: (f.telefono || '').trim(),
      vehiculo: f.vehiculo || 'Moto',
      zona: (f.zona || '').trim(),
      nota: (f.nota || '').trim(),
    }, !!editing);
    onClose();
  }

  return (
    <>
      <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
      <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open}>
        <header className="drawer-head">
          <div>
            <div className="drawer-eyebrow">{editing ? 'Editar repartidor' : 'Nuevo repartidor'}</div>
            <div className="drawer-title">{editing ? f.nombre : 'Agregar repartidor'}</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>
        <div className="drawer-body">
          <div className="field">
            <label>Nombre</label>
            <input value={f.nombre || ''} onChange={(e) => set('nombre', e.target.value)} placeholder="ej. Kevin Mendoza" />
            {touched && !valid && <div className="field-error">Indica el nombre.</div>}
          </div>
          <div className="field">
            <label>WhatsApp</label>
            <input value={f.telefono || ''} onChange={(e) => set('telefono', e.target.value)} placeholder="5939XXXXXXXX" inputMode="tel" />
            <div className="field-hint">Con 593 al inicio para enviarle la hoja de ruta.</div>
          </div>
          <div className="field">
            <label>Vehículo</label>
            <div className="chip-row">
              {['Moto', 'Carro', 'Bicicleta', 'A pie'].map((v) => (
                <button key={v} className={classNames('chip', f.vehiculo === v && 'is-active')} onClick={() => set('vehiculo', v)}>{v}</button>
              ))}
            </div>
          </div>
          <div className="field">
            <label>Zonas que cubre <span className="muted small">opcional</span></label>
            <input value={f.zona || ''} onChange={(e) => set('zona', e.target.value)} placeholder="ej. Norte y Vía a Daule" />
          </div>
          <div className="field">
            <label>Nota <span className="muted small">opcional</span></label>
            <textarea rows="2" value={f.nota || ''} onChange={(e) => set('nota', e.target.value)} placeholder="Horario, acuerdo de pago…" />
          </div>
        </div>
        <footer className="drawer-foot">
          <button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" onClick={handleSave}>{editing ? 'Guardar cambios' : 'Agregar repartidor'}</button>
        </footer>
      </aside>
    </>
  );
}

function LiquidarDrawer({ open, onClose, repartidor, cuadre, onLiquidar, onToast }) {
  const [gastoFlete, setGastoFlete] = usePState(true);
  if (!repartidor || !cuadre) {
    return (
      <>
        <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
        <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open} />
      </>
    );
  }
  const lista = cuadre.porLiquidar;

  return (
    <>
      <div className={classNames('drawer-scrim', open && 'is-open')} onClick={onClose} />
      <aside className={classNames('drawer', open && 'is-open')} aria-hidden={!open}>
        <header className="drawer-head">
          <div>
            <div className="drawer-eyebrow">Cuadre de caja</div>
            <div className="drawer-title">{repartidor.nombre}</div>
          </div>
          <button className="icon-btn close" onClick={onClose} aria-label="Cerrar">×</button>
        </header>
        <div className="drawer-body">
          <div className="cuadre-summary">
            <div><span className="ts-label">Efectivo cobrado</span><span className="ts-value">{money(cuadre.efectivo)}</span></div>
            <div><span className="ts-label">Fletes a pagarle</span><span className="ts-value neg">−{money(cuadre.fletes)}</span></div>
            <div className="cs-total"><span className="ts-label">Debe entregarte</span><span className="ts-value pos">{money(cuadre.aRecibir)}</span></div>
          </div>

          {cuadre.otros > 0 && (
            <div className="callout">
              <strong>{money(cuadre.otros)}</strong> de estos pedidos se cobraron por transferencia o PayPhone: ese dinero no lo trae el repartidor.
            </div>
          )}

          <div className="proj-section">
            <div className="proj-section-title">Pedidos por liquidar ({lista.length})</div>
            {lista.length === 0 ? (
              <div className="mini-empty">No hay pedidos pendientes de cuadre.</div>
            ) : (
              <ul className="pay-list">
                {lista.map((p) => (
                  <li key={p.id} className="pay-row">
                    <span className="pay-date">{pedidoRef(p)}</span>
                    <span className="pay-method">{p.clienteNombre} · {paymentMethodLabel(p.metodoPago)}</span>
                    <span className="pay-amount">{money(pedidoTotal(p))}</span>
                  </li>
                ))}
              </ul>
            )}
          </div>

          {cuadre.fletes > 0 && (
            <label className="check-row">
              <input type="checkbox" checked={gastoFlete} onChange={(e) => setGastoFlete(e.target.checked)} />
              <span>Registrar {money(cuadre.fletes)} de fletes como gasto de transporte</span>
            </label>
          )}
        </div>
        <footer className="drawer-foot">
          <button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" disabled={lista.length === 0}
            onClick={() => { onLiquidar(repartidor, lista, gastoFlete && cuadre.fletes > 0 ? cuadre.fletes : 0); onClose(); }}>
            Cerrar cuadre
          </button>
        </footer>
      </aside>
    </>
  );
}
