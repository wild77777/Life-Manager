function PedidosView(props) {
  const {
    pedidos, repartidores, products, clients,
    onSavePedido, onDeletePedido, onChangeEstado, onAssign,
    onSaveRepartidor, onDeleteRepartidor, onLiquidar,
    onToast, onConfirm,
  } = props;

  const [tab, setTab] = usePState('delivery');
  const [rango, setRango] = usePState('hoy');
  const [estadoF, setEstadoF] = usePState('abiertos');
  const [repF, setRepF] = usePState('todos');
  const [search, setSearch] = usePState('');
  const [vista, setVista] = usePState('lista');
  const [fechaLocal, setFechaLocal] = usePState(todayISO());

  const [drawer, setDrawer] = usePState({ open: false, editing: null, canal: 'delivery' });
  const [detail, setDetail] = usePState({ open: false, id: null });
  const [repDrawer, setRepDrawer] = usePState({ open: false, editing: null });
  const [liqDrawer, setLiqDrawer] = usePState({ open: false, rep: null });

  const deliveries = usePMemo(() => pedidos.filter((p) => p.canal !== 'local'), [pedidos]);
  const locales = usePMemo(() => pedidos.filter((p) => p.canal === 'local'), [pedidos]);

  // ---- Rango de fechas para delivery ----
  function inRango(p) {
    const f = p.fechaEntrega || p.fecha;
    const hoy = todayISO();
    if (rango === 'hoy') return f === hoy;
    if (rango === 'manana') {
      const m = new Date(TODAY); m.setDate(m.getDate() + 1);
      return f === m.toISOString().slice(0, 10);
    }
    if (rango === 'semana') {
      const s = startOfPeriod(TODAY, 'semana'), e = endOfPeriod(TODAY, 'semana');
      return inRange(f, s, e);
    }
    return true;
  }

  const listaDelivery = usePMemo(() => {
    const q = search.trim().toLowerCase();
    return deliveries
      .filter(inRango)
      .filter((p) => estadoF === 'todos' ? true : estadoF === 'abiertos' ? pedidoAbierto(p) : p.estado === estadoF)
      .filter((p) => repF === 'todos' ? true : repF === 'sin' ? !p.repartidorId : p.repartidorId === repF)
      .filter((p) => !q
        || (p.clienteNombre || '').toLowerCase().includes(q)
        || (p.direccion || '').toLowerCase().includes(q)
        || (p.clienteTelefono || '').includes(q)
        || pedidoRef(p).includes(q)
        || (p.items || []).some((it) => (it.nombre || '').toLowerCase().includes(q)))
      .sort((a, b) => {
        const fa = a.fechaEntrega || a.fecha, fb = b.fechaEntrega || b.fecha;
        if (fa !== fb) return fa < fb ? -1 : 1;
        return (b.numero || 0) - (a.numero || 0);
      });
  }, [deliveries, rango, estadoF, repF, search]);

  // ---- Métricas delivery ----
  const met = usePMemo(() => {
    const enRango = deliveries.filter(inRango);
    const entregados = enRango.filter((p) => p.estado === 'entregado');
    const cerrados = enRango.filter((p) => ['entregado', 'devuelto'].includes(p.estado));
    let efectivoCalle = 0;
    for (const p of deliveries) {
      if (p.estado === 'entregado' && !p.liquidado && p.metodoPago === 'efectivo') efectivoCalle += pedidoTotal(p);
    }
    return {
      abiertos: enRango.filter(pedidoAbierto).length,
      enRuta: enRango.filter((p) => p.estado === 'ruta').length,
      entregados: entregados.length,
      vendido: entregados.reduce((s, p) => s + pedidoTotal(p), 0),
      efectivoCalle,
      tasa: cerrados.length ? Math.round((entregados.length / cerrados.length) * 100) : null,
      devueltos: enRango.filter((p) => ['devuelto', 'reagendado'].includes(p.estado)).length,
      sinAsignar: enRango.filter((p) => !p.repartidorId && pedidoAbierto(p)).length,
    };
  }, [deliveries, rango]);

  // ---- Agrupado por repartidor (vista ruta) ----
  const grupos = usePMemo(() => {
    const map = new Map();
    for (const p of listaDelivery) {
      const k = p.repartidorId || '__sin__';
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(p);
    }
    return [...map.entries()].sort((a, b) => (a[0] === '__sin__' ? -1 : b[0] === '__sin__' ? 1 : 0));
  }, [listaDelivery]);

  const caja = usePMemo(() => cierreCaja(pedidos, fechaLocal), [pedidos, fechaLocal]);

  const cuadres = usePMemo(() => repartidores.map((r) => ({ rep: r, c: cuadreRepartidor(deliveries, r.id) })), [repartidores, deliveries]);
  const totalCalle = cuadres.reduce((s, x) => s + x.c.aRecibir, 0);

  const detalle = detail.id ? pedidos.find((p) => p.id === detail.id) : null;

  function askDelete(p) {
    onConfirm({
      title: 'Eliminar pedido',
      body: <>¿Eliminar el pedido <strong>{pedidoRef(p)}</strong> de {p.clienteNombre || 'sin nombre'} por {money(pedidoTotal(p))}?</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => { onDeletePedido(p.id); setDetail({ open: false, id: null }); },
    });
  }
  function askDeleteRep(r) {
    onConfirm({
      title: 'Eliminar repartidor',
      body: <>¿Eliminar a <strong>{r.nombre}</strong>? Los pedidos que tenía quedarán sin asignar.</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => onDeleteRepartidor(r.id),
    });
  }

  function enviarRuta(rep, lista) {
    if (!hasTel(rep.telefono)) { onToast('Agrega el WhatsApp del repartidor para enviarle la ruta.'); return; }
    const msg = buildRutaWhatsapp(rep, lista, lista[0] ? (lista[0].fechaEntrega || lista[0].fecha) : todayISO());
    window.open(waHref(rep.telefono, msg), '_blank');
  }

  const rangos = [['hoy', 'Hoy'], ['manana', 'Mañana'], ['semana', 'Esta semana'], ['todos', 'Todos']];
  const estados = [['abiertos', 'Pendientes'], ['ruta', 'En ruta'], ['entregado', 'Entregados'], ['reagendado', 'Reagendados'], ['devuelto', 'Devueltos'], ['todos', 'Todos']];

  return (
    <>
      <section className="action-bar">
        <div className="action-bar-left">
          <div className="page-eyebrow">Operación diaria</div>
          <h1 className="page-title">pedidos</h1>
        </div>
        <div className="action-bar-right">
          <div className="segmented">
            {[['delivery', 'Delivery'], ['local', 'Local'], ['cuadre', 'Cuadre']].map(([id, label]) => (
              <button key={id} className={classNames('segmented-btn', tab === id && 'is-active')} onClick={() => setTab(id)}>{label}</button>
            ))}
          </div>
          {tab !== 'cuadre' && (
            <button className="btn-primary" onClick={() => setDrawer({ open: true, editing: null, canal: tab === 'local' ? 'local' : 'delivery' })}>
              <span aria-hidden="true">+</span> {tab === 'local' ? 'Nueva venta' : 'Nuevo pedido'}
            </button>
          )}
          {tab === 'cuadre' && (
            <button className="btn-primary" onClick={() => setRepDrawer({ open: true, editing: null })}>
              <span aria-hidden="true">+</span> Repartidor
            </button>
          )}
        </div>
      </section>

      {/* ============================ DELIVERY ============================ */}
      {tab === 'delivery' && (
        <>
          <div className="ped-metrics">
            <div className="pmet">
              <span className="kpi-label">Pendientes</span>
              <span className="kpi-value">{met.abiertos}</span>
              <span className="pmet-note">{met.sinAsignar > 0 ? `${met.sinAsignar} sin repartidor` : 'todos asignados'}</span>
            </div>
            <div className="pmet">
              <span className="kpi-label">En ruta</span>
              <span className="kpi-value">{met.enRuta}</span>
              <span className="pmet-note">saliendo ahora</span>
            </div>
            <div className="pmet">
              <span className="kpi-label">Entregados</span>
              <span className="kpi-value pos">{met.entregados}</span>
              <span className="pmet-note">{money(met.vendido)} vendidos</span>
            </div>
            <div className="pmet">
              <span className="kpi-label">Efectivo en la calle</span>
              <span className={classNames('kpi-value', met.efectivoCalle > 0 && 'warn')}>{money(met.efectivoCalle)}</span>
              <span className="pmet-note">sin cuadrar</span>
            </div>
            <div className="pmet">
              <span className="kpi-label">Entregas logradas</span>
              <span className="kpi-value">{met.tasa == null ? '—' : met.tasa + '%'}</span>
              <span className="pmet-note">{met.devueltos} devueltos o reagendados</span>

          {deliveries.length === 0 ? (
            <EmptyState

              body="Registra los pedidos que salen con los deliver: dirección, zona, qué se cobra y quién lo lleva. Después cuadras el efectivo de cada repartidor en un clic."
              action={<button className="btn-primary" onClick={() => setDrawer({ open: true, editing: null, canal: 'delivery' })}><span>+</span> Crear el primer pedido</button>}

                                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.01c-.24.68-1.42 1.31-1.96 1.36-.5.05-.96.23-3.23-.67-2.73-1.08-4.45-3.86-4.58-4.04-.13-.18-1.1-1.46-1.1-2.79s.7-1.98.94-2.25c.24-.27.53-.34.71-.34.18 0 .35 0 .51.01.16.01.39-.06.6.46.24.56.78 1.91.85 2.05.07.14.12.3.02.48-.09.18-.14.29-.28.45-.14.16-.29.36-.42.48-.14.14-.28.28-.12.55.16.27.71 1.17 1.53 1.9 1.05.93 1.94 1.22 2.21 1.36.27.14.43.12.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.23.6-.14.24.09 1.55.73 1.81.86.27.13.45.2.51.31.07.11.07.63-.17 1.31z"/></svg>
                                </a>
                              )}
                              <button className="row-btn" onClick={() => setDrawer({ open: true, editing: p, canal: 'delivery' })} title="Editar">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4.5 11.5 2 12l.5-2.5L9.5 2.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>

                              <button className="row-btn danger" onClick={() => askDelete(p)} title="Eliminar">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>

      {/* ============================ LOCAL ============================ */}
      {tab === 'local' && (
        <>
          <div className="ped-metrics local-metrics">

              <span className="kpi-label">Vendido</span>

            <div className="pmet">
              <span className="kpi-label">Tickets</span>

              <div className="table-wrap">
                <table className="movs">
                  <thead>
                    <tr>
                      <th>Ticket</th>

                      <th>Productos</th>

                    {caja.lista.map((p) => (
                      <tr key={p.id} className="ped-row" onClick={() => setDetail({ open: true, id: p.id })}>
                        <td className="concept">{pedidoRef(p)}</td>
                        <td className="muted">{p.clienteNombre || 'Mostrador'}</td>
                        <td className="muted small">{pedidoItemsResumen(p)}</td>
                        <td className="num muted">{pedidoUnidades(p)}</td>
                        <td className="muted small">{paymentMethodLabel(p.metodoPago)}</td>
                        <td className="num amount pos">{money(pedidoTotal(p))}</td>
                        <td className="actions-col" onClick={(e) => e.stopPropagation()}>
                          <div className="row-actions">
                            <button className="row-btn" onClick={() => setDrawer({ open: true, editing: p, canal: 'local' })} title="Editar">
                              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4.5 11.5 2 12l.5-2.5L9.5 2.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>
                            </button>
                            <button className="row-btn danger" onClick={() => askDelete(p)} title="Eliminar">
                              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr>
                      <td colSpan="5">Total del día</td>
                      <td className="num amount pos">{money(caja.total)}</td>
                      <td></td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            )}
          </div>
        </>
      )}

      {/* ============================ CUADRE ============================ */}
      {tab === 'cuadre' && (
        <>
          <div className="ped-metrics local-metrics">
            <div className="pmet">
              <span className="kpi-label">Por recibir de repartidores</span>
              <span className={classNames('kpi-value', totalCalle > 0 && 'warn')}>{money(totalCalle)}</span>
              <span className="pmet-note">efectivo menos fletes</span>
            </div>
            <div className="pmet">
              <span className="kpi-label">Repartidores</span>
              <span className="kpi-value">{repartidores.length}</span>
              <span className="pmet-note">activos</span>
            </div>
            <div className="pmet">
              <span className="kpi-label">En ruta ahora</span>
              <span className="kpi-value">{deliveries.filter((p) => p.estado === 'ruta').length}</span>
              <span className="pmet-note">pedidos fuera</span>
            </div>
            <div className="pmet">
              <span className="kpi-label">Devueltos</span>
              <span className="kpi-value">{deliveries.filter((p) => p.estado === 'devuelto').length}</span>
              <span className="pmet-note">histórico</span>
            </div>
          </div>

          {repartidores.length === 0 ? (
            <EmptyState
              title="Agrega a tus repartidores"
              body="Con cada repartidor registrado puedes asignarle pedidos, mandarle la hoja de ruta por WhatsApp y cuadrar al final del día cuánto efectivo trae y cuánto le toca de fletes."
              action={<button className="btn-primary" onClick={() => setRepDrawer({ open: true, editing: null })}><span>+</span> Agregar repartidor</button>}
            />
          ) : (
            <div className="cuadre-grid">
              {cuadres.map(({ rep, c }) => (
                <div key={rep.id} className="cuadre-card">
                  <div className="cc-head">
                    <div>
                      <div className="cc-name">{rep.nombre}</div>
                      <div className="cc-sub">{rep.vehiculo}{rep.zona ? ` · ${rep.zona}` : ''}{rep.telefono ? ` · ${rep.telefono}` : ''}</div>
                    </div>
                    <div className="row-actions is-static">
                      <button className="row-btn" onClick={() => setRepDrawer({ open: true, editing: rep })} title="Editar">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4.5 11.5 2 12l.5-2.5L9.5 2.5z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>
                      </button>
                      <button className="row-btn danger" onClick={() => askDeleteRep(rep)} title="Eliminar">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5 4V2.5h4V4M4 4l.5 7.5h5L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      </button>
                    </div>
                  </div>

                  <div className="cc-stats">
                    <div><span className="ts-label">En ruta</span><span className="ts-value">{c.enRuta}</span></div>
                    <div><span className="ts-label">Por liquidar</span><span className="ts-value">{c.porLiquidar.length}</span></div>
                    <div><span className="ts-label">Efectivo</span><span className="ts-value">{money(c.efectivo)}</span></div>
                    <div><span className="ts-label">Fletes</span><span className="ts-value neg">{money(c.fletes)}</span></div>
                  </div>

                  <div className="cc-foot">
                    <div className="cc-arecibir">
                      <span className="ts-label">Debe entregarte</span>
                      <span className={classNames('cc-amount', c.aRecibir > 0 ? 'pos' : 'muted')}>{money(c.aRecibir)}</span>
                    </div>
                    <button className="btn-primary btn-sm" disabled={c.porLiquidar.length === 0}
                      onClick={() => setLiqDrawer({ open: true, rep })}>
                      Cuadrar
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      <PedidoDrawer
        open={drawer.open} editing={drawer.editing} canal={drawer.canal}
        products={products} repartidores={repartidores} pedidos={pedidos} clients={clients}
        onClose={() => setDrawer({ open: false, editing: null, canal: drawer.canal })}
        onSave={onSavePedido}
      />
      <PedidoDetailDrawer
        open={detail.open} pedido={detalle} repartidores={repartidores}
        onClose={() => setDetail({ open: false, id: null })}
        onEdit={(p) => { setDetail({ open: false, id: null }); setDrawer({ open: true, editing: p, canal: p.canal || 'delivery' }); }}
        onDelete={askDelete}
        onChangeEstado={onChangeEstado}
        onAssign={onAssign}
        onToast={onToast}
      />
      <RepartidorDrawer
        open={repDrawer.open} editing={repDrawer.editing}
        onClose={() => setRepDrawer({ open: false, editing: null })}
        onSave={onSaveRepartidor}
      />
      <LiquidarDrawer
        open={liqDrawer.open}
        repartidor={liqDrawer.rep}
        cuadre={liqDrawer.rep ? cuadreRepartidor(deliveries, liqDrawer.rep.id) : null}
        onClose={() => setLiqDrawer({ open: false, rep: null })}
        onLiquidar={onLiquidar}
        onToast={onToast}
      />
    </>
  );
}

Object.assign(window, { PedidosView });

  <!-- ===== app.jsx ===== -->
  <script type="text/babel" data-presets="env,react">
// ============================================================
// Life Manager — main app
// ============================================================
const { useState, useMemo, useEffect, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "claro",
  "density": "comoda"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Persisted state ------------------------------------------
  const [state, setState] = useState(() => loadState());
  const { transactions, products, clients, suppliers, crmClients, crmProjects, debts, pedidos, repartidores, bankAccount } = state;

  useEffect(() => { saveState(state); }, [state]);

  useEffect(() => {
    document.documentElement.dataset.theme = tweaks.theme;
    document.documentElement.dataset.density = tweaks.density;
  }, [tweaks]);

  // View routing ---------------------------------------------
  const [view, setView] = useState('resumen');

  // Period state (shared between Resumen and Reportes) -------
  const [period, setPeriod] = useState('mes');
  const [anchor, setAnchor] = useState(new Date(TODAY));
  useEffect(() => { setAnchor((a) => startOfPeriod(a, period)); }, [period]);

  // Drawer state ---------------------------------------------
  const [txDrawer, setTxDrawer] = useState({ open: false, editing: null });
  const [prodDrawer, setProdDrawer] = useState({ open: false, editing: null });
  const [cliDrawer, setCliDrawer] = useState({ open: false, editing: null });
  const [supDrawer, setSupDrawer] = useState({ open: false, editing: null });
  const [exportOpen, setExportOpen] = useState(false);

  // Confirm dialog -------------------------------------------
  const [confirm, setConfirm] = useState(null);

  // Toast ----------------------------------------------------
  const [toast, setToast] = useState('');
  const flash = useCallback((msg) => {
    setToast(msg);
    window.clearTimeout(flash._t);
    flash._t = window.setTimeout(() => setToast(''), 2600);
  }, []);

  // ---- Mutations ------------------------------------------
  const saveTransaction = useCallback((tx, isEdit) => {
    setState((s) => {
      let nextTxs;
      let nextProducts = s.products;

      if (isEdit) {
        const prev = s.transactions.find((t) => t.id === tx.id);
        nextTxs = s.transactions.map((t) => (t.id === tx.id ? tx : t));
        // Reverse previous stock effect, then apply new
        if (prev && prev.tipo === 'venta' && prev.productoId) {
          nextProducts = nextProducts.map((p) => p.id === prev.productoId ? { ...p, stock: p.stock + (prev.cantidad || 1) } : p);
        }
        if (tx.tipo === 'venta' && tx.productoId) {
          nextProducts = nextProducts.map((p) => p.id === tx.productoId ? { ...p, stock: Math.max(0, p.stock - (tx.cantidad || 1)) } : p);
        }
      } else {
        nextTxs = [tx, ...s.transactions];
        if (tx.tipo === 'venta' && tx.productoId) {
          nextProducts = nextProducts.map((p) => p.id === tx.productoId ? { ...p, stock: Math.max(0, p.stock - (tx.cantidad || 1)) } : p);
        }
      }
      // Re-sort newest first
      nextTxs.sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
      return { ...s, transactions: nextTxs, products: nextProducts };
    });
    flash(isEdit ? 'Transacción actualizada.' : `${tx.tipo === 'gasto' ? 'Gasto' : tx.tipo === 'ingreso' ? 'Ingreso' : 'Venta'} de ${money(tx.monto)} registrado.`);
  }, [flash]);

  const deleteTransaction = useCallback((tx) => {
    setState((s) => {
      const nextTxs = s.transactions.filter((t) => t.id !== tx.id);
      let nextProducts = s.products;
      if (tx.tipo === 'venta' && tx.productoId) {
        nextProducts = nextProducts.map((p) => p.id === tx.productoId ? { ...p, stock: p.stock + (tx.cantidad || 1) } : p);
      }
      return { ...s, transactions: nextTxs, products: nextProducts };
    });
    flash('Transacción eliminada.');
  }, [flash]);

  const saveProduct = useCallback((p, isEdit) => {
    setState((s) => {
      const next = isEdit
        ? s.products.map((x) => (x.id === p.id ? p : x))
        : [...s.products, p];
      return { ...s, products: next };
    });
    flash(isEdit ? 'Producto actualizado.' : 'Producto creado.');
  }, [flash]);

  const deleteProduct = useCallback((p) => {
    setState((s) => ({ ...s, products: s.products.filter((x) => x.id !== p.id) }));
    flash('Producto eliminado.');
  }, [flash]);

  const saveClient = useCallback((c, isEdit) => {
    setState((s) => ({
      ...s,
      clients: isEdit ? s.clients.map((x) => (x.id === c.id ? c : x)) : [...s.clients, c],
    }));
    flash(isEdit ? 'Cliente actualizado.' : 'Cliente creado.');
  }, [flash]);

  const deleteClient = useCallback((c) => {
    setState((s) => ({ ...s, clients: s.clients.filter((x) => x.id !== c.id) }));
    flash('Cliente eliminado.');
  }, [flash]);

  const saveSupplier = useCallback((sp, isEdit) => {
    setState((s) => ({
      ...s,
      suppliers: isEdit ? s.suppliers.map((x) => (x.id === sp.id ? sp : x)) : [...s.suppliers, sp],
    }));
    flash(isEdit ? 'Proveedor actualizado.' : 'Proveedor creado.');
  }, [flash]);

  const deleteSupplier = useCallback((sp) => {
    setState((s) => ({ ...s, suppliers: s.suppliers.filter((x) => x.id !== sp.id) }));
    flash('Proveedor eliminado.');
  }, [flash]);

  // ---- CRM mutations --------------------------------------
  const saveCrmClient = useCallback((c, isEdit) => {
    setState((s) => ({
      ...s,
      crmClients: isEdit ? s.crmClients.map((x) => (x.id === c.id ? c : x)) : [...s.crmClients, c],
    }));
    flash(isEdit ? 'Cliente actualizado.' : 'Cliente registrado.');
  }, [flash]);

  const deleteCrmClient = useCallback((id) => {
    setState((s) => ({
      ...s,
      crmClients: s.crmClients.filter((x) => x.id !== id),
      crmProjects: s.crmProjects.filter((p) => p.clienteId !== id),
    }));
    flash('Cliente y sus proyectos eliminados.');
  }, [flash]);

  const saveProject = useCallback((proj, isEdit, clienteId) => {
    setState((s) => {
      if (isEdit) return { ...s, crmProjects: s.crmProjects.map((p) => (p.id === proj.id ? proj : p)) };
      return { ...s, crmProjects: [...s.crmProjects, { ...proj, clienteId: proj.clienteId || clienteId }] };
    });
    flash(isEdit ? 'Proyecto actualizado.' : 'Proyecto creado.');
  }, [flash]);

  const deleteProject = useCallback((id) => {
    setState((s) => ({ ...s, crmProjects: s.crmProjects.filter((p) => p.id !== id) }));
    flash('Proyecto eliminado.');
  }, [flash]);

  const changeProjectState = useCallback((id, estado) => {
    setState((s) => ({ ...s, crmProjects: s.crmProjects.map((p) => (p.id === id ? { ...p, estado } : p)) }));
  }, []);

  const addPayment = useCallback((projectId, pago) => {
    setState((s) => ({
      ...s,
      crmProjects: s.crmProjects.map((p) => p.id === projectId ? { ...p, pagos: [...(p.pagos || []), pago] } : p),
    }));
    flash(`Abono de ${money(pago.monto)} registrado.`);
  }, [flash]);

  const deletePayment = useCallback((projectId, payId) => {
    setState((s) => ({
      ...s,
      crmProjects: s.crmProjects.map((p) => p.id === projectId ? { ...p, pagos: (p.pagos || []).filter((x) => x.id !== payId) } : p),
    }));
    flash('Abono eliminado.');
  }, [flash]);

  const addObservation = useCallback((projectId, texto) => {
    const obs = { id: newId('obs'), texto, fecha: todayISO(), resuelto: false };
    setState((s) => ({
      ...s,
      crmProjects: s.crmProjects.map((p) => p.id === projectId ? { ...p, observaciones: [...(p.observaciones || []), obs] } : p),
    }));
  }, []);

  const toggleObservation = useCallback((projectId, obsId) => {
    setState((s) => ({
      ...s,
      crmProjects: s.crmProjects.map((p) => p.id === projectId
        ? { ...p, observaciones: (p.observaciones || []).map((o) => o.id === obsId ? { ...o, resuelto: !o.resuelto } : o) }
        : p),
    }));
  }, []);

  const deleteObservation = useCallback((projectId, obsId) => {
    setState((s) => ({
      ...s,
      crmProjects: s.crmProjects.map((p) => p.id === projectId
        ? { ...p, observaciones: (p.observaciones || []).filter((o) => o.id !== obsId) }
        : p),
    }));
  }, []);

  const saveBank = useCallback((bank) => {
    setState((s) => ({ ...s, bankAccount: bank }));
    flash('Cuenta bancaria guardada.');
  }, [flash]);

  // ---- Deudas mutations -----------------------------------
  const saveDebt = useCallback((d, isEdit) => {
    setState((s) => ({
      ...s,
      debts: isEdit ? s.debts.map((x) => (x.id === d.id ? d : x)) : [d, ...s.debts],
    }));
    flash(isEdit ? 'Deuda actualizada.' : 'Deuda registrada.');
  }, [flash]);

  const deleteDebt = useCallback((id) => {
    setState((s) => ({ ...s, debts: s.debts.filter((x) => x.id !== id) }));
    flash('Deuda eliminada.');
  }, [flash]);

  const addDebtPayment = useCallback((debtId, pago) => {
    setState((s) => ({
      ...s,
      debts: s.debts.map((d) => d.id === debtId ? { ...d, pagos: [...(d.pagos || []), pago] } : d),
    }));
    flash(`Abono de ${money(pago.monto)} registrado.`);
  }, [flash]);

  const deleteDebtPayment = useCallback((debtId, payId) => {
    setState((s) => ({
      ...s,
      debts: s.debts.map((d) => d.id === debtId ? { ...d, pagos: (d.pagos || []).filter((x) => x.id !== payId) } : d),
    }));
    flash('Abono eliminado.');
  }, [flash]);

  // ---- Pedidos: sincronización con movimientos e inventario ----
  // Un pedido genera una venta cuando se entrega (delivery) o al
  // registrarse (local). Si se revierte, la venta se retira sola.
  function debeFacturar(p) {
    if (!p) return false;
    if (p.canal === 'local') return p.estado !== 'cancelado';
    return p.estado === 'entregado';
  }

  function syncPedido(s, prev, next) {
    const prevOn = debeFacturar(prev);
    const nextOn = debeFacturar(next);
    let transactions = s.transactions;
    let products = s.products;
    const id = (next || prev).id;
    const txId = 'tx_ped_' + id;

    const moveStock = (p, dir) => {
      for (const it of (p.items || [])) {
        if (!it.productoId) continue;
        products = products.map((pr) => pr.id === it.productoId
          ? { ...pr, stock: Math.max(0, (+pr.stock || 0) + dir * (+it.cantidad || 0)) }
          : pr);
      }
    };

    if (prevOn) { transactions = transactions.filter((t) => t.id !== txId); moveStock(prev, +1); }
    if (nextOn) {
      transactions = [pedidoToTransaction(next), ...transactions.filter((t) => t.id !== txId)];
      moveStock(next, -1);
    }
    transactions = [...transactions].sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
    return { transactions, products };
  }

  const savePedido = useCallback((p, isEdit) => {
    setState((s) => {
      const prev = isEdit ? s.pedidos.find((x) => x.id === p.id) : null;
      const pedidosNext = isEdit ? s.pedidos.map((x) => (x.id === p.id ? p : x)) : [p, ...s.pedidos];
      return { ...s, pedidos: pedidosNext, ...syncPedido(s, prev, p) };
    });
    flash(isEdit ? 'Pedido actualizado.' : `${p.canal === 'local' ? 'Venta' : 'Pedido'} ${pedidoRef(p)} registrado por ${money(pedidoTotal(p))}.`);
  }, [flash]);

  const deletePedido = useCallback((id) => {
    setState((s) => {
      const prev = s.pedidos.find((x) => x.id === id);
      return { ...s, pedidos: s.pedidos.filter((x) => x.id !== id), ...syncPedido(s, prev, null) };
    });
    flash('Pedido eliminado.');
  }, [flash]);

  const changePedidoEstado = useCallback((id, estado) => {
    setState((s) => {
      const prev = s.pedidos.find((x) => x.id === id);
      if (!prev) return s;
      const next = {
        ...prev,
        estado,
        fechaEntregaReal: estado === 'entregado' ? (prev.fechaEntregaReal || todayISO()) : '',
        liquidado: estado === 'entregado' ? !!prev.liquidado : false,
      };
      return { ...s, pedidos: s.pedidos.map((x) => (x.id === id ? next : x)), ...syncPedido(s, prev, next) };
    });
    const meta = pedidoEstadoMeta(estado);
    flash(`Pedido marcado como ${meta.label.toLowerCase()}.`);
  }, [flash]);

  const assignRepartidor = useCallback((id, repartidorId) => {
    setState((s) => ({
      ...s,
      pedidos: s.pedidos.map((p) => p.id === id ? { ...p, repartidorId } : p),
    }));
  }, []);

  const saveRepartidor = useCallback((r, isEdit) => {
    setState((s) => ({
      ...s,
      repartidores: isEdit ? s.repartidores.map((x) => (x.id === r.id ? r : x)) : [...s.repartidores, r],
    }));
    flash(isEdit ? 'Repartidor actualizado.' : 'Repartidor agregado.');
  }, [flash]);

  const deleteRepartidor = useCallback((id) => {
    setState((s) => ({
      ...s,
      repartidores: s.repartidores.filter((x) => x.id !== id),
      pedidos: s.pedidos.map((p) => p.repartidorId === id ? { ...p, repartidorId: '' } : p),
    }));
    flash('Repartidor eliminado.');
  }, [flash]);

  // Cierra el cuadre: marca los pedidos como liquidados y, si se pide,
  // registra los fletes del repartidor como gasto de transporte.
  const liquidarRepartidor = useCallback((rep, lista, fletes) => {
    const ids = new Set(lista.map((p) => p.id));
    setState((s) => {
      const next = {
        ...s,
        pedidos: s.pedidos.map((p) => ids.has(p.id) ? { ...p, liquidado: true, fechaLiquidacion: todayISO() } : p),
      };
      if (fletes > 0) {
        const tx = {
          id: newId('tx'),
          tipo: 'gasto',
          categoria: 'transporte',
          concepto: `Fletes de ${rep.nombre} · ${lista.length} entregas`,
          monto: +(+fletes).toFixed(2),
          fecha: todayISO(),
          nota: 'Cuadre de delivery',
        };
        next.transactions = [tx, ...s.transactions].sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
      }
      return next;
    });
    flash(`Cuadre de ${rep.nombre} cerrado.`);
  }, [flash]);

  // ---- Export ---------------------------------------------
  const openExport = useCallback(() => setExportOpen(true), []);

  // ---- Reset all data -------------------------------------
  function handleReset() {
    setConfirm({
      title: 'Borrar todos los datos',
      body: 'Se eliminarán todos los movimientos, productos, clientes y proveedores guardados en este navegador. Esta acción no se puede deshacer.',
      confirmLabel: 'Borrar todo',
      onConfirm: () => {
        setState(emptyState());
        setConfirm(null);
        flash('Todos los datos fueron borrados.');
      },
    });
  }

  // ---- Confirm helpers ------------------------------------
  function askDeleteTx(tx) {
    setConfirm({
      title: 'Eliminar transacción',
      body: <>¿Eliminar "<strong>{tx.concepto}</strong>" por {money(tx.monto)}?</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => { deleteTransaction(tx); setConfirm(null); },
    });
  }
  function askDeleteProduct(p) {
    setConfirm({
      title: 'Eliminar producto',
      body: <>¿Eliminar "<strong>{p.nombre}</strong>" del catálogo? Las ventas pasadas se conservan.</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => { deleteProduct(p); setConfirm(null); },
    });
  }
  function askDeleteClient(c) {
    setConfirm({
      title: 'Eliminar cliente',
      body: <>¿Eliminar "<strong>{c.nombre}</strong>"? Las ventas pasadas se conservan.</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => { deleteClient(c); setConfirm(null); },
    });
  }
  function askDeleteSupplier(sp) {
    setConfirm({
      title: 'Eliminar proveedor',
      body: <>¿Eliminar "<strong>{sp.nombre}</strong>"?</>,
      confirmLabel: 'Eliminar',
      onConfirm: () => { deleteSupplier(sp); setConfirm(null); },
    });
  }

  // ---- Render ---------------------------------------------
  const totalCount = transactions.length;

  return (
    <div className="app">
      <Header
        view={view} setView={setView}
        dataCount={totalCount}
        onOpenAdd={() => setTxDrawer({ open: true, editing: null })}
        onOpenExport={openExport}
      />

      <main className="main">
        {view === 'resumen' && (
          <ResumenView
            transactions={transactions} products={products} clients={clients}
            period={period} setPeriod={setPeriod} anchor={anchor} setAnchor={setAnchor}
            onOpenAdd={() => setTxDrawer({ open: true, editing: null })}
            onEdit={(tx) => setTxDrawer({ open: true, editing: tx })}
            onDelete={askDeleteTx}
          />
        )}
        {view === 'movs' && (
          <MovimientosView
            transactions={transactions} products={products} clients={clients}
            onOpenAdd={() => setTxDrawer({ open: true, editing: null })}
            onEdit={(tx) => setTxDrawer({ open: true, editing: tx })}
            onDelete={askDeleteTx}
            onOpenExport={openExport}
          />
        )}
        {view === 'inv' && (
          <InventarioView
            products={products} transactions={transactions}
            onAdd={() => setProdDrawer({ open: true, editing: null })}
            onEdit={(p) => setProdDrawer({ open: true, editing: p })}
            onDelete={askDeleteProduct}
          />
        )}
        {view === 'contactos' && (
          <ContactosView
            clients={clients} suppliers={suppliers} transactions={transactions}
            onAddClient={() => setCliDrawer({ open: true, editing: null })}
            onEditClient={(c) => setCliDrawer({ open: true, editing: c })}
            onDeleteClient={askDeleteClient}
            onAddSupplier={() => setSupDrawer({ open: true, editing: null })}
            onEditSupplier={(s) => setSupDrawer({ open: true, editing: s })}
            onDeleteSupplier={askDeleteSupplier}
          />
        )}
        {view === 'reportes' && (
          <ReportesView
            transactions={transactions} products={products} clients={clients}
            period={period} setPeriod={setPeriod} anchor={anchor} setAnchor={setAnchor}
          />
        )}
        {view === 'deudas' && (
          <DeudasView
            debts={debts} bankAccount={bankAccount}
            onSave={saveDebt}
            onDelete={deleteDebt}
            onAddPayment={addDebtPayment}
            onDeletePayment={deleteDebtPayment}
            onConfirm={(cfg) => setConfirm({ ...cfg, onConfirm: () => { cfg.onConfirm(); setConfirm(null); } })}
          />
        )}
        {view === 'pedidos' && (
          <PedidosView
            pedidos={pedidos} repartidores={repartidores} products={products} clients={clients}
            onSavePedido={savePedido}
            onDeletePedido={deletePedido}
            onChangeEstado={changePedidoEstado}
            onAssign={assignRepartidor}
            onSaveRepartidor={saveRepartidor}
            onDeleteRepartidor={deleteRepartidor}
            onLiquidar={liquidarRepartidor}
            onToast={flash}
            onConfirm={(cfg) => setConfirm({ ...cfg, onConfirm: () => { cfg.onConfirm(); setConfirm(null); } })}
          />
        )}
        {view === 'crm' && (
          <CrmView
            crmClients={crmClients} crmProjects={crmProjects} bankAccount={bankAccount}
            onSaveClient={saveCrmClient}
            onDeleteClient={deleteCrmClient}
            onSaveProject={saveProject}
            onDeleteProject={deleteProject}
            onAddPayment={addPayment}
            onDeletePayment={deletePayment}
            onChangeState={changeProjectState}
            onAddObservation={addObservation}
            onToggleObservation={toggleObservation}
            onDeleteObservation={deleteObservation}
            onSaveBank={saveBank}
            onToast={flash}
            onConfirm={(cfg) => setConfirm({ ...cfg, onConfirm: () => { cfg.onConfirm(); setConfirm(null); } })}
          />
        )}

        <footer className="page-foot">
          <div>Life Manager · datos guardados en este navegador</div>
          <div>
            <button className="link-btn danger-link" onClick={handleReset}>Borrar todos los datos</button>
          </div>
        </footer>
      </main>

      {/* Drawers */}
      <TransactionDrawer
        open={txDrawer.open} editing={txDrawer.editing}
        products={products} clients={clients}
        onClose={() => setTxDrawer({ open: false, editing: null })}
        onSave={saveTransaction}
      />
      <ProductDrawer
        open={prodDrawer.open} editing={prodDrawer.editing}
        onClose={() => setProdDrawer({ open: false, editing: null })}
        onSave={saveProduct}
      />
      <ClientDrawer
        open={cliDrawer.open} editing={cliDrawer.editing}
        onClose={() => setCliDrawer({ open: false, editing: null })}
        onSave={saveClient}
      />
      <SupplierDrawer
        open={supDrawer.open} editing={supDrawer.editing}
        onClose={() => setSupDrawer({ open: false, editing: null })}
        onSave={saveSupplier}
      />
      <ExportDrawer
        open={exportOpen}
        onClose={() => setExportOpen(false)}
        transactions={transactions} products={products} clients={clients}
        onToast={flash}
      />

      <ConfirmDialog
        open={!!confirm}
        title={confirm?.title}
        body={confirm?.body}
        confirmLabel={confirm?.confirmLabel}
        onCancel={() => setConfirm(null)}
        onConfirm={confirm?.onConfirm}
      />

      <Toast text={toast} />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Apariencia">
          <TweakRadio
            label="Tema"
            value={tweaks.theme}
            onChange={(v) => setTweak('theme', v)}
            options={[{ value: 'claro', label: 'Claro' }, { value: 'oscuro', label: 'Oscuro' }]}
          />
          <TweakRadio
            label="Densidad"
            value={tweaks.density}
            onChange={(v) => setTweak('density', v)}
            options={[{ value: 'comoda', label: 'Cómoda' }, { value: 'compacta', label: 'Compacta' }]}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
